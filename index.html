/* Self-hosted so a cold launch never touches a third-party origin. Latin
   subset only; unicode-range is deliberately omitted so any glyph the subset
   lacks falls back to the system font rather than silently to no font.

@font-face {
  font-family: 'Oswald';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url('./fonts/oswald-var.woff2') format('woff2');

}

:root {

  --accent:    #e34f1e;
  --danger:    #c0392b;
  --ok:        #4b7a3f;
  --on-dark:   #f2efe8;
  --on-ink:    #f2efe8;
  --bar-dark:  #191813;
  --bar-line:  #33312a;
  --bar-btn:   #26241f;

* { box-sizing: border-box; }

/* Touch hygiene for every control. `manipulation` drops the 300ms double-tap
   delay; the tap-highlight and user-select suppression stop a firm gym-hand
   press from flashing a blue box or starting a text selection. */
[data-act], button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
[data-act] { transition: opacity .12s ease; }
[data-act]:active { opacity: .55; transition: none; }
[data-act]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* The tip overlay's scrim is itself a tap target (tap anywhere to close) —
   dimming the whole screen on press would read as a bug. */
.ov[data-act]:active { opacity: 1; }
/* The inline weight/reps edit field must stay selectable. */
.step-in { user-select: text; -webkit-user-select: text; }

/* Invisible centered hit rect: lifts a small glyph control to a full tap
   target without changing how it looks. Pseudo-elements are never event
   targets, so the delegated closest('[data-act]') lookup still resolves to
   the button itself. No ancestor of a .hit element clips overflow. */
.hit { position: relative; }
.hit::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 100%; height: 100%;
  min-width: var(--tap); min-height: var(--tap);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;

#app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; }
#scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }

.mono { font-family: var(--font-mono); }
.disp { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 1px; }

#masthead { padding: 18px 20px 0; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.mh-top { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 3px solid var(--ink); padding-bottom: 9px; }
.mh-title { font-family: var(--font-display); font-size: 34px; font-weight: 600; line-height: .95; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mh-title span { color: var(--accent); }
.mh-sub { font-family: var(--font-mono); font-size: 9px; letter-spacing: 1.2px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mh-right { display: flex; align-items: flex-start; gap: 12px; flex: none; }
.wk-row { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
/* Narrower than tall on purpose: .hit supplies the full 44px tap width, so
   the visible box stays slim and leaves the masthead title its room. */
.wk-btn { border: none; background: none; cursor: pointer; color: var(--muted-2); font-size: 22px; line-height: 1; padding: 0; width: 26px; height: 36px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
.wk-lbl { font-family: var(--font-display); font-size: 19px; font-weight: 600; color: var(--accent); min-width: 42px; text-align: center; }
.phase-line { font-family: var(--font-mono); font-size: 8px; letter-spacing: .5px; color: var(--muted); margin-top: 2px; text-align: right; }
/* 38px visible, 44px tap via .hit. The masthead's width budget is set by
   .phase-line, so every px the gear grows comes straight out of the title. */
.gear { width: 38px; height: 38px; flex: none; border: 1.5px solid var(--ink); background: transparent; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink); font-size: 18px; }
.gear.on { background: var(--ink); color: var(--accent); }
.prog-chips { display: flex; gap: 8px; padding: 8px 0; }
.chip { font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); padding: 0 14px; border-radius: 3px; cursor: pointer; border: 1.5px solid var(--border); background: transparent; color: var(--muted-2); }
.chip.on { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: transparent; border: none; cursor: pointer; padding: 0 12px; min-height: 46px; white-space: nowrap; font-family: var(--font-mono); font-size: 9px; letter-spacing: .8px; font-weight: 600; color: var(--muted-2); }
.tab.on { background: var(--ink); color: var(--on-ink); }
.tab i { color: var(--accent); font-style: normal; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--border); margin: 0 20px; }
.stat { padding: 10px 0 10px 10px; border-right: 1px solid var(--border); }
.stat:first-child { padding-left: 0; }
.stat:last-child { border-right: none; }
.stat-k { font-family: var(--font-mono); font-size: 8px; letter-spacing: 1px; color: var(--muted-2); }
.stat-v { font-family: var(--font-display); font-size: 18px; font-weight: 500; margin-top: 2px; }
.stat-v small { font-size: 11px; color: var(--muted-2); }
.pr { margin: 14px 20px 0; background: var(--ink); color: var(--on-ink); border-radius: 4px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.pr b { font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: 1.5px; background: var(--accent); padding: 3px 7px; border-radius: 2px; flex: none; }
.pr span { font-size: 12px; line-height: 1.4; }
.daybtns { display: flex; gap: 10px; margin: 14px 20px 0; }
.dbtn { flex: 1; background: transparent; border: 1px dashed var(--faint); border-radius: 4px; color: var(--muted-2); font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 1px; padding: 0 10px; min-height: var(--tap-lg); cursor: pointer; }
.dbtn.strong { border-color: var(--ink); color: var(--ink); }
.panel { margin: 16px 20px 0; border: 1px solid var(--ink); border-radius: 4px; padding: 12px 14px; }
.panel-h { font-family: var(--font-mono); font-size: 9px; font-weight: 600; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 8px; }
.proto { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 0; min-height: var(--tap); }
.proto-box { width: 20px; height: 20px; border: 1.5px solid var(--ink); flex: none; display: flex; align-items: center; justify-content: center; color: var(--on-ink); font-size: 12px; font-weight: 700; }
.proto-box.on { background: var(--ink); }
.proto span { font-size: 12px; line-height: 1.35; color: var(--ink-soft); }
.proto.on span { color: var(--muted-2); }

.ex { padding: 18px 20px 0; }
.ex-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: var(--tap-lg); }
.ex-name { font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: .5px; min-width: 0; }
.ex-name.done { color: var(--muted-2); }
.ex.sel { box-shadow: inset 3px 0 0 var(--accent); }
.ex.sel .ex-name { color: var(--accent); }
.ex-top.pick { cursor: pointer; }
.ex-right { display: flex; align-items: center; gap: 8px; flex: none; }
.swap { border: 1px solid var(--border); background: transparent; color: var(--muted-2); border-radius: 4px; width: 36px; height: 36px; cursor: pointer; font-size: 16px; }
.swap.on { border-color: var(--accent); color: var(--accent); background: rgba(227,79,30,.1); }
.ex-count { font-family: var(--font-mono); font-size: 9px; color: var(--muted); }
/* 12px gap so adjacent tags' expanded .hit rects clear each other: the
   narrowest tappable tag ("LLP", ~37px) bleeds ~3.5px per side to reach 44. */
.tags { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.tag { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .5px; display: inline-flex; align-items: center; min-height: 26px; padding: 0 9px; border-radius: 2px; border: 1px solid var(--border); color: var(--muted); }
.tag[data-act] { cursor: help; }
.tag.ink { border-color: var(--ink); color: var(--ink); }
.tag.acc { border-color: var(--accent); color: var(--accent); }
.ex-note { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted-2); margin-top: 6px; line-height: 1.5; }
.trend { display: flex; align-items: flex-end; gap: 14px; margin-top: 10px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 46px; }
.bar-col { display: flex; flex-direction: column; align-items: center; gap: 3px; justify-content: flex-end; height: 46px; }
.bar-col span { font-family: var(--font-mono); font-size: 7px; color: var(--muted-2); }
.bar { width: 22px; background: var(--faint); }
.bar.now { background: var(--accent); }
.trend-empty { font-family: var(--font-mono); font-size: 9px; color: var(--faint); margin-top: 8px; }
.grid { margin-top: 12px; border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; }
.grid-h, .grid-r { display: grid; grid-template-columns: 34px 1fr 1fr 112px; align-items: center; }
.grid-h { background: var(--ink); color: var(--on-ink); font-family: var(--font-mono); font-size: 8px; letter-spacing: .8px; }
.grid-h span { padding: 6px 0; }
.grid-h span:first-child { padding-left: 8px; }
.grid-h span:last-child { padding-right: 8px; text-align: right; }
.grid-r { font-family: var(--font-mono); font-size: 11px; border-top: 1px solid var(--border); }
.grid-r.active { border-top: 2px solid var(--accent); background: var(--surface); }
.grid-r.done { background: var(--done-bg); }
.grid-r > span { padding: 8px 0; }
.grid-r .n { padding-left: 8px; color: var(--faint); }
.grid-r.active .n { color: var(--accent); font-weight: 600; }
.grid-r.done .n { color: var(--muted-2); }
.grid-r .last { color: var(--muted-2); }
/* 2px vertical padding, not 5px, so a full 44px .log-btn fits inside the
   48px cell without pushing every set row taller. */
.cell-today { padding: 2px 8px 2px 0; display: flex; align-items: center; justify-content: flex-end; min-height: var(--tap-lg); }
.log-btn { display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: var(--on-dark); font-weight: 600; font-size: 11.5px; letter-spacing: 1px; min-height: var(--tap); padding: 0 18px; border-radius: 4px; cursor: pointer; border: none; }
.t-done { color: var(--ink); font-weight: 600; cursor: pointer; }
.t-skip { color: var(--muted); text-decoration: line-through; cursor: pointer; }
.t-pend { color: var(--muted); cursor: pointer; font-size: 10px; }
.effort { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.effort-k { font-family: var(--font-mono); font-size: 9px; letter-spacing: 1px; color: var(--muted-2); }
.eff { font-family: var(--font-mono); font-size: 9px; padding: 0 14px; min-height: var(--tap); border-radius: 3px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted-2); }
.eff.on { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }
.skipex { margin-top: 12px; background: transparent; border: 1px dashed var(--border); border-radius: 4px; color: var(--muted); font-family: var(--font-mono); font-size: 9px; letter-spacing: 1px; padding: 0 16px; min-height: var(--tap); cursor: pointer; }

#bottombar:empty { display: none; }
.barbar { background: var(--bar-dark); color: var(--on-dark); padding: 0 16px; flex: none; }
.pill { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; border-bottom: 1px solid var(--bar-line); }
.pill-l { display: flex; align-items: center; gap: 9px; cursor: pointer; min-width: 0; min-height: var(--tap); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.dot.urgent { background: var(--danger); }
.pill-k { font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.5px; color: rgba(242,239,232,.5); }
.pill-t { font-family: var(--font-mono); font-size: 17px; font-weight: 600; color: var(--accent); }
.pill-t.urgent { color: var(--danger); }
.pill-b { background: none; border: 1px solid var(--bar-edge); border-radius: 8px; color: var(--on-dark); font-family: var(--font-mono); font-size: 12px; min-height: 46px; padding: 0 18px; cursor: pointer; }
.log-row { padding: 11px 0 14px; }
.log-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.log-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-set { font-family: var(--font-mono); font-size: 8px; letter-spacing: 1px; color: rgba(242,239,232,.45); flex: none; }
.log-ctl { display: flex; flex-direction: column; gap: 8px; }
.log-steps { display: flex; gap: 12px; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 6px; flex: 1; min-width: 0; }
.step-b { width: 44px; height: 52px; background: var(--bar-btn); border: 1px solid var(--bar-edge); border-radius: 8px; color: var(--on-dark); font-size: 20px; cursor: pointer; flex: none; }
.step-v { text-align: center; min-width: 0; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 52px; }
.step-v div:first-child { font-family: var(--font-mono); font-size: 16px; font-weight: 600; }
.step-v div:last-child { font-family: var(--font-mono); font-size: 7px; color: rgba(242,239,232,.4); }
.step-in { width: 100%; min-width: 0; box-sizing: border-box; background: var(--bar-btn); border: 1px solid var(--accent); border-radius: 6px; color: var(--on-dark); font-family: var(--font-mono); font-size: 16px; font-weight: 600; text-align: center; padding: 3px 2px; }
.log-go { width: 100%; background: var(--accent); border: none; border-radius: 8px; color: var(--on-dark); font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 1px; height: 52px; cursor: pointer; }
/* The finished-day bar. Wider type, an accent rule and a check badge so the
   end of a session reads as an event rather than a status line, plus a CTA
   that hands the user straight to whatever comes next. */
.done-row { display: flex; align-items: center; gap: 12px; padding: 13px 2px 15px; border-top: 2px solid var(--accent); }
.done-mark { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--on-dark); font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none; }
.done-txt { min-width: 0; flex: 1; }
.done-t { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: 1.5px; color: var(--accent); line-height: 1.05; }
.done-s { font-family: var(--font-mono); font-size: 10.5px; color: rgba(242,239,232,.6); margin-top: 2px; }
.done-go { flex: none; max-width: 45%; background: var(--accent); border: none; border-radius: 8px; color: var(--on-dark); font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 1px; min-height: var(--tap-lg); padding: 0 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Standing banner at the top of a finished day, so the completed state is
   still obvious after the celebration overlay is dismissed. */

  try {

}

let DAYS = PROGRAMS[0].days;
let MESOCYCLE = PROGRAMS[0].mesocycle;
let WEEK_PHASES = PROGRAMS[0].weekPhases;
let PROTOCOL_ITEMS = PROGRAMS[0].protocolItems;

// PROGRAM TRACKING
let currentProgramIdx = 0;

function currentProgramId() {
  return PROGRAMS[currentProgramIdx].id;
}

function weekStorageKey(week) {
  return `${STORAGE_KEY}_${currentProgramId()}_w${week}`;
}

function weekKey() {
  return `hypertrophy_week_${currentProgramId()}`;
}

function programStartKey(progId) { return `hypertrophy_start_${progId}`; }

// Derive approximate dates for historical sets logged before timestamps
// existed. Everything written here is src:"est" and must stay distinguishable
// from measured data forever — see the design spec. Returns {ok, written} or
// {ok:false, reason}.
function backfillProgram(progId, startDate) {
  const prog = PROGRAMS.find(p => p.id === progId);
  if (!prog) return { ok: false, reason: 'unknown program' };
  // dayIndex is added as a day offset within the week, so a program longer
  // than a week would spill into the next week's dates. Refuse rather than
  // silently produce wrong dates.
  if (prog.days.length > 7) return { ok: false, reason: 'program has more than 7 days' };
  const base = Date.parse(String(startDate) + 'T00:00:00');
  if (isNaN(base)) return { ok: false, reason: 'invalid date' };

  let written = 0;
  for (let w = 1; w <= prog.totalWeeks; w++) {
    const key = `${STORAGE_KEY}_${progId}_w${w}`;
    let raw;
    try { raw = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { continue; }
    if (!raw || !Object.keys(raw).length) continue;

    prog.days.forEach((day, dayIndex) => {
      const sd = raw[day.id];
      if (!sd || !sd.sets) return;
      const at = base + ((w - 1) * 7 + dayIndex) * 86400000;
      if (!sd.times) sd.times = {};
      Object.keys(sd.sets).forEach(exId => {
        const arr = sd.sets[exId];
        if (!Array.isArray(arr)) return;
        arr.forEach((v, i) => {
          if (v !== true && v !== 'skipped') return;
          const k = `${exId}_${i}`;
          const existing = sd.times[k];
          // The safety property: only ever write over our own estimates.
          if (existing && existing.src !== 'est') return;
          sd.times[k] = { at, src: 'est' };
          written++;
        });
      });
    });
    localStorage.setItem(key, JSON.stringify(raw));
  }
  localStorage.setItem(programStartKey(progId), String(startDate));
  return { ok: true, written };
}

// WEEK TRACKING
let currentWeek = 1;

function loadWeek() {
  try { currentWeek = parseInt(localStorage.getItem(weekKey()) || '1'); } catch(e) {}
  const maxWeeks = PROGRAMS[currentProgramIdx].totalWeeks;
  if (isNaN(currentWeek) || currentWeek < 1) currentWeek = 1;
  if (currentWeek > maxWeeks) currentWeek = maxWeeks;
}

function saveWeek() {
  try { localStorage.setItem(weekKey(), currentWeek); } catch(e) {}
}

function loadProgram() {
  try {
    const saved = parseInt(localStorage.getItem('hypertrophy_program') || '0');
    if (!isNaN(saved) && saved >= 0 && saved < PROGRAMS.length) currentProgramIdx = saved;
  } catch(e) {}
}

function saveProgram() {
  try { localStorage.setItem('hypertrophy_program', currentProgramIdx); } catch(e) {}
}

const SEEN_PROGRAMS_KEY = 'hypertrophy_seen_programs';

// Has this program ever had a set actually completed, in any week? Used only
// by the first-run heuristic below. A state key existing is not enough —
// initState()/saveState() write a blob the moment a program is merely
// opened, all-`false`/`'skipped'` entries and all, so key-existence alone
// would mean "has been viewed," not "has been trained." tools/analyze-history.js
// hit the same trap (see countWeeksWithCompletedSets) and fixed it the same
// way: only a `true` in some day's sets array counts as real training.
function programHasLoggedData(program) {
  for (let w = 1; w <= program.totalWeeks; w++) {
    try {
      const raw = JSON.parse(localStorage.getItem(`${STORAGE_KEY}_${program.id}_w${w}`) || '{}');
      const hasCompleted = Object.values(raw || {}).some(dayData =>
        Object.values((dayData && dayData.sets) || {}).some(arr => Array.isArray(arr) && arr.some(v => v === true))
      );
      if (hasCompleted) return true;
    } catch(e) {}
  }
  return false;
}

// Jump to a newly added program the first time it appears. On a fresh install we
// only record what exists, so we never override a deliberate selection.
function autoSelectNewProgram() {
  let seen = null;
  try { seen = JSON.parse(localStorage.getItem(SEEN_PROGRAMS_KEY)); } catch(e) {}
  const ids = PROGRAMS.map(p => p.id);
  // The seen key never existed for this user (fresh install, or — the
  // rollout-gap case — auto-select shipped in the same release as a new
  // program, so it was never around to record anything before now).
  const firstRun = seen === null;
  // An array sharing no ids with the current programs is suspect data (corrupt,
  // wiped, or foreign), not proof that every program is new — treat it like a
  // fresh install rather than let it clobber a deliberate selection.
  const trustworthy = Array.isArray(seen) && seen.some(id => ids.includes(id));
  let recorded = false;
  try { localStorage.setItem(SEEN_PROGRAMS_KEY, JSON.stringify(ids)); recorded = true; } catch(e) {}
  // Only switch if we could actually record having seen it — otherwise the
  // stale seen-list would trigger the same "unseen" verdict on every future
  // load, permanently overriding any manual switch back.
  if (!recorded) return;

  if (trustworthy) {
    const unseenIdx = PROGRAMS.findIndex(p => !seen.includes(p.id));
    if (unseenIdx !== -1) {
      currentProgramIdx = unseenIdx;
      saveProgram();
    }
    return;
  }

  // Parseable but shares no ids with the current programs: suspect data, not
  // a genuine first run — leave it alone, same as before.
  if (!firstRun) return;

  // First run: there's no seen-list to compare against, so the trusted path
  // above can't tell us anything. Generated programs are always appended, so
  // the LAST program is the only sensible auto-select target — jumping to
  // "the first unseen" here could yank a user backwards into a mid-list
  // program that predates this feature just as much as the rest. Only select
  // it if it has no logged training data of its own (a program the user has
  // already trained is not new to them, whatever the key says) AND some
  // other program does have data (otherwise this is a genuinely fresh
  // install, and there's nothing to distinguish "new" from "the default").
  const lastIdx = PROGRAMS.length - 1;
  const lastHasData = programHasLoggedData(PROGRAMS[lastIdx]);
  const anyOtherHasData = PROGRAMS.slice(0, lastIdx).some(programHasLoggedData);
  if (!lastHasData && anyOtherHasData) {
    currentProgramIdx = lastIdx;
    saveProgram();
  }
}

function changeWeek(delta) {
  const maxWeeks = PROGRAMS[currentProgramIdx].totalWeeks;
  currentWeek = Math.min(maxWeeks, Math.max(1, currentWeek + delta));
  saveWeek();
  initState();
  updateWeekDisplay();
  updateOverallProgress();
  if (currentDayId !== 'info') switchDay(currentDayId);
}

  Object.keys(LEGACY_ID_MAP).forEach(k => delete LEGACY_ID_MAP[k]);
  DAYS.forEach(day => {
    LEGACY_ID_MAP[day.id] = {};
    day.exercises.forEach((ex, i) => { LEGACY_ID_MAP[day.id][i] = ex.id; });
  });
}

function resolveExercise(dayId, ex) {
  const swaps = (state[dayId] && state[dayId].swaps) || {};
  const altId = swaps[ex.id];
  if (!altId) return ex;
  const alts = EXERCISE_ALTERNATIVES[ex.id];
  if (!alts) return ex;
  const alt = alts.find(a => a.id === altId);
  if (!alt) return ex;
  const merged = { ...ex, ...alt };
  // A `ramp` is authored against the exercise it belongs to: its values are
  // ABSOLUTE set counts tuned to that exercise's own base `sets`. Alternatives
  // carry their own `sets` but (today) no `ramp`, so inheriting the original's
  // would apply the original's absolute targets to a different base — e.g.
  // swapping {sets:4, ramp:{3:5}} for a 3-set alt would jump to 5 sets in week
  // 3, a +2 rather than the intended +1. The alt's own ramp wins if it has one;
  // otherwise the key must be absent entirely (not `undefined`) so the sparse
  // lookup in setsForWeek falls back to the alt's flat `sets`.
  if (!alt.ramp) delete merged.ramp;
  return merged;
}

// Prescribed set count for a RESOLVED exercise in a given week.
// `ex.ramp` is sparse: its keys are the weeks where the count CHANGES and its
// values are the ABSOLUTE count from that week until the next key. Weeks below
// the lowest key use `ex.sets`; no `ramp` at all means `ex.sets` everywhere.
//   { sets: 4, ramp: { 3: 5, 7: 6 } }  →  w1–2: 4, w3–6: 5, w7+: 6
// A week whose phase carries `deload: true` halves the RAMPED value. The flag
// is an explicit boolean on the phase, never the phase's label — a program is
// free to name its deload week anything, and matching on 'Deload' would both
// miss those and catch programs that only borrow the word.
function setsForWeek(ex, week = currentWeek, prog = curProg()) {
  let n = ex.sets;
  if (ex.ramp) {
    Object.keys(ex.ramp)
      .map(Number)
      .sort((a, b) => a - b)
      .forEach(k => { if (k <= week) n = ex.ramp[k]; });
  }
  const phase = prog && prog.weekPhases ? prog.weekPhases[week - 1] : null;
  if (phase && phase.deload) n = Math.max(1, Math.floor(n / 2));
  return n;
}

// Grow or shrink a live set array to `target` without ever destroying logged
// work: growth appends unlogged sets, shrinking only pops trailing blanks and
// stops dead at the first resolved (true / 'skipped') entry from the end. The
// array is synced IN PLACE so anything already holding a reference to it — a
// half-rendered card, the saved blob — keeps seeing the same array.
function syncSetCount(dayId, exId, target) {
  const sd = state[dayId];
  if (!sd || !sd.sets) return;
  const arr = sd.sets[exId];
  if (!Array.isArray(arr)) return;
  while (arr.length < target) arr.push(false);
  while (arr.length > target && arr[arr.length - 1] === false) arr.pop();
}

function syncProgramGlobals() {
  const prog = PROGRAMS[currentProgramIdx];
  DAYS = prog.days;
  MESOCYCLE = prog.mesocycle;
  WEEK_PHASES = prog.weekPhases;
  PROTOCOL_ITEMS = prog.protocolItems;
  rebuildLegacyIdMap();
}

let programInitialized = false;
function switchProgram(idx) {
  if (programInitialized && idx === currentProgramIdx) return;
  programInitialized = true;
  currentProgramIdx = idx;
  syncProgramGlobals();
  saveProgram();
  loadWeek();
  initState();
  advanceToCurrentWeek();
  updateWeekDisplay();
  updateProgramSelector();
  switchDay(getStartDay());
  updateOverallProgress();
}

// STATE — sets[exId][si] = false | true | 'skipped', weights[exId] = number|null
let state = {};

const LEGACY_ID_MAP = {};
rebuildLegacyIdMap();

function migrateDayState(dayId, sd) {
  if (!sd || !sd.sets) return sd;
  const hasStringKeys = Object.keys(sd.sets).some(k => isNaN(k));
  if (hasStringKeys) return sd;
  const map = LEGACY_ID_MAP[dayId];
  const m = { sets: {}, weights: {}, effort: {}, protocol: sd.protocol || [], swaps: sd.swaps || {} };
  Object.keys(sd.sets).forEach(k => {
    const exId = map[k];
    if (exId) m.sets[exId] = sd.sets[k];
  });
  if (sd.weights) {
    Object.keys(sd.weights).forEach(k => {
      if (k.includes('_')) {
        const [ei, si] = k.split('_');
        const exId = map[ei];
        if (exId) m.weights[`${exId}_${si}`] = sd.weights[k];
      } else {
        const exId = map[k];
        if (exId) m.weights[exId] = sd.weights[k];
      }
    });
  }
  if (sd.effort) {
    Object.keys(sd.effort).forEach(k => {
      const exId = map[k];
      if (exId) m.effort[exId] = sd.effort[k];
    });
  }
  return m;
}

function initState() {
  const raw = loadState();
  const saved = {};
  DAYS.forEach(day => { saved[day.id] = migrateDayState(day.id, raw[day.id]); });
  DAYS.forEach(day => {
    const savedDay = saved[day.id] || {};
    state[day.id] = {
      sets: {},
      weights: savedDay.weights || {},
      reps: savedDay.reps || {},
      times: savedDay.times || {},
      effort: savedDay.effort || {},
      protocol: savedDay.protocol || [],
      swaps: savedDay.swaps || {}
    };
    day.exercises.forEach(originalEx => {
      const ex = resolveExercise(day.id, originalEx);
      // Seed from the saved blob when there is one, else start empty; either
      // way syncSetCount reconciles the length to this week's prescription in
      // both directions, keeping any sets already logged in this week.
      const savedArr = savedDay.sets ? savedDay.sets[ex.id] : null;
      state[day.id].sets[ex.id] = Array.isArray(savedArr) ? savedArr : [];
      syncSetCount(day.id, ex.id, setsForWeek(ex));
    });
  });
  saveState();
  prefillFromPreviousWeeks();
  seedCompleteFlags();
}

function prefillFromPreviousWeeks() {
  if (currentWeek <= 1) return;
  DAYS.forEach(day => {
    const weights = state[day.id].weights;
    const effort = state[day.id].effort;
    day.exercises.forEach(originalEx => {
      const ex = resolveExercise(day.id, originalEx);
      for (let w = currentWeek - 1; w >= 1; w--) {
        try {
          const raw = JSON.parse(localStorage.getItem(weekStorageKey(w)) || '{}');
          const prev = migrateDayState(day.id, raw[day.id]);
          if (!prev) continue;
          if (!weights[ex.id] && prev.weights && prev.weights[ex.id]) {
            weights[ex.id] = prev.weights[ex.id];
          }
          if (!effort[ex.id] && prev.effort && prev.effort[ex.id]) {
            effort[ex.id] = prev.effort[ex.id];
          }
          if (weights[ex.id] && effort[ex.id]) return;
        } catch(e) {}
      }
    });
  });
}

// Cross-week history for a single exercise (current program). Ascending by week.
// Reads each week's localStorage blob via migrateDayState; prefers in-memory
// `state` for the current week so unsaved edits are reflected.
function getExerciseHistory(dayId, exId) {
  const maxWeeks = PROGRAMS[currentProgramIdx].totalWeeks;
  const out = [];
  for (let w = 1; w <= maxWeeks; w++) {
    let dayState;
    if (w === currentWeek && state[dayId]) {
      dayState = state[dayId];
    } else {
      try {
        const raw = JSON.parse(localStorage.getItem(weekStorageKey(w)) || '{}');
        dayState = migrateDayState(dayId, raw[dayId]);
      } catch (e) { dayState = null; }
    }
    if (!dayState) continue;
    const rawW = (dayState.weights || {})[exId];
    const weight = (rawW === '' || rawW == null) ? null : Number(rawW);
    const rawR = (dayState.reps || {})[exId];
    const reps = (rawR === '' || rawR == null) ? null : Number(rawR);
    const eff = (dayState.effort || {})[exId] || '';
    // Per-set reps, keyed by set index. The suffix must be all digits: a bare
    // startsWith(exId + '_') would credit `m3_squat_pause_0` to `m3_squat`,
    // silently mixing two different exercises' reps together.
    const setReps = {};
    const repsMap = dayState.reps || {};
    Object.keys(repsMap).forEach(k => {
      if (!k.startsWith(exId + '_')) return;
      const suffix = k.slice(exId.length + 1);
      if (/^\d+$/.test(suffix)) setReps[suffix] = Number(repsMap[k]);
    });
    if (weight == null && reps == null && !eff) continue;
    out.push({ week: w, weight, reps, effort: eff, setReps });
  }
  return out;
}

// Most recent logged entry strictly before the current week, or null.
function priorWeekEntry(dayId, exId) {
  const hist = getExerciseHistory(dayId, exId);
  for (let i = hist.length - 1; i >= 0; i--) {
    if (hist[i].week < currentWeek) return hist[i];
  }
  return null;
}

// Clock seam. Every timestamp this feature writes goes through nowMs() so
// tests can pin the clock. The rest timer's own Date.now() calls are
// deliberately left alone — that logic works and is backgrounding-sensitive.
let clockNow = () => Date.now();
function nowMs() { return clockNow(); }
function setClock(fn) { clockNow = fn || (() => Date.now()); }

// A set was performed at a moment, by one of four routes. `src` is what keeps
// a bulk tap or an estimated backfill from ever being mistaken for a measured
// log — see docs/superpowers/specs/2026-07-29-set-timestamps-design.md.
function markTime(dayId, exId, setIdx, src) {
  if (!state[dayId]) return;
  if (!state[dayId].times) state[dayId].times = {};
  state[dayId].times[`${exId}_${setIdx}`] = { at: nowMs(), src };
}

// A set that was un-done was not performed. A stale timestamp is worse than
// no timestamp, so every un-resolve path deletes rather than leaving it.
function clearTime(dayId, exId, setIdx) {
  if (!state[dayId] || !state[dayId].times) return;
  delete state[dayId].times[`${exId}_${setIdx}`];
}

function saveState() {
  try { localStorage.setItem(weekStorageKey(currentWeek), JSON.stringify(state)); } catch(e) {}
}

function loadState() {
  try { return JSON.parse(localStorage.getItem(weekStorageKey(currentWeek)) || '{}'); } catch(e) { return {}; }
}

// Migrate old non-week-aware state to week 1
function migrateOldState() {
  try {
    const old = localStorage.getItem(STORAGE_KEY);
    if (!old) return;
    const parsed = JSON.parse(old);
    const dayIds = DAYS.map(d => d.id);
    if (!dayIds.some(id => parsed[id])) return;
    if (!localStorage.getItem(weekStorageKey(1))) {
      localStorage.setItem(weekStorageKey(1), old);
    }
    localStorage.removeItem(STORAGE_KEY);
  } catch(e) {}
}

function migrateToMultiProgram() {
  if (localStorage.getItem('hypertrophy_migrated_v3')) return;
  for (let w = 1; w <= 8; w++) {
    const oldKey = `${STORAGE_KEY}_w${w}`;
    const newKey = `${STORAGE_KEY}_meso1_w${w}`;
    const data = localStorage.getItem(oldKey);
    if (data && !localStorage.getItem(newKey)) {
      localStorage.setItem(newKey, data);
      localStorage.removeItem(oldKey);
    }
  }
  const oldWeek = localStorage.getItem('hypertrophy_week');
  if (oldWeek && !localStorage.getItem('hypertrophy_week_meso1')) {
    localStorage.setItem('hypertrophy_week_meso1', oldWeek);
    localStorage.removeItem('hypertrophy_week');
  }
  localStorage.setItem('hypertrophy_migrated_v3', '1');
}

function isResolved(v) { return v === true || v === 'skipped'; }

function totalSets() {
  let total = 0;
  DAYS.forEach(d => d.exercises.forEach(originalEx => {
    const ex = resolveExercise(d.id, originalEx);
    total += ex.sets;
  }));
  return total;
}

function completedSets() {
  let done = 0;
  DAYS.forEach(day => {
    day.exercises.forEach(originalEx => {
      const ex = resolveExercise(day.id, originalEx);
      const arr = state[day.id].sets[ex.id];
      if (arr) arr.forEach(v => { if (v === true) done++; });
    });
  });
  return done;
}

function skippedSetsCount() {
  let count = 0;
  DAYS.forEach(day => {
    day.exercises.forEach(originalEx => {
      const ex = resolveExercise(day.id, originalEx);
      const arr = state[day.id].sets[ex.id];
      if (arr) arr.forEach(v => { if (v === 'skipped') count++; });
    });
  });
  return count;
}

function isDayComplete(dayId) {
  const day = DAYS.find(d => d.id === dayId);
  if (!day) return false;
  return day.exercises.every(originalEx => {
    const ex = resolveExercise(dayId, originalEx);
    const arr = state[dayId].sets[ex.id];
    return arr && arr.every(v => isResolved(v));
  });
}

// Which days were complete as of the last mutation, so a day flipping from
// incomplete to complete can be detected exactly once. Seeded by initState()
// on every week/program load — without that seed, merely opening an already
// finished week would fire the celebration again.
const completeFlags = {};

function seedCompleteFlags() {
  Object.keys(completeFlags).forEach(k => delete completeFlags[k]);
  DAYS.forEach(d => { completeFlags[d.id] = isDayComplete(d.id); });
}

// Call after any mutation to a day's sets. Fires the celebration on the
// false -> true edge, and takes it back down if the day is un-completed
// (undo, unskip, a swap that adds fresh sets) while it's still showing.
function syncCompletion(dayId) {
  if (!dayId || !state[dayId]) return;
  const now = isDayComplete(dayId);
  const was = completeFlags[dayId] === true;
  completeFlags[dayId] = now;
  if (now && !was) openDayDone(dayId);
  else if (!now && view.done && view.done.dayId === dayId) view.done = null;
}

// Builds the celebration payload for a day that just finished, and — when
// that day was the last one left in the week — moves the app on to the next
// week before showing it. The payload is captured first so the overlay still
// reports the week that was actually just finished.
function openDayDone(dayId) {
  const day = DAYS.find(d => d.id === dayId);
  if (!day) return;
  const s = dayStats(dayId);
  const maxWeeks = curProg().totalWeeks;
  const weekDone = isWeekComplete();
  const nextDay = weekDone ? null : DAYS.find(d => !isDayComplete(d.id));
  const done = {
    dayId,
    dayTitle: day.title.replace(/\.$/, ''),
    week: currentWeek,
    weekDone,
    programDone: weekDone && currentWeek >= maxWeeks,
    advancedTo: null,
    nextPhase: '',
    nextDayId: nextDay ? nextDay.id : null,
    nextDayLabel: nextDay ? nextDay.label : '',
    sets: s.done, total: s.total, skipped: s.skipped,
    elapsed: Date.now() - view.sessionStart
  };

  if (weekDone && currentWeek < maxWeeks) {
    changeWeek(1);
    done.advancedTo = currentWeek;
    const phase = curProg().weekPhases[currentWeek - 1];
    done.nextPhase = phase ? `${phase.label.toUpperCase()} · ${phase.rpe}` : '';
    view.dayId = getStartDay();
    view.selectedExId = null;
    view.pendKey = '';
    view.latestPr = null;
  }

  view.restEnd = null;
  view.restMinimized = false;
  view.done = done;
}

// Compatibility shim — the preserved logic layer calls this; it now just re-renders.
function updateOverallProgress(){ render(); }

// Compatibility shim — the preserved logic layer calls this; it now just re-renders.
function switchDay(dayId) { if (dayId) view.dayId = dayId; render(); }

let currentDayId = DAYS[0].id;

function toggleSet(dayId, exId, setIdx) {
  const wasDone = state[dayId].sets[exId][setIdx] === true;

  if (wasDone) {
    state[dayId].sets[exId][setIdx] = false;
    clearTime(dayId, exId, setIdx);
    saveState();
    syncCompletion(dayId);
    refreshCurrentDay(dayId);
    return;
  }

  requestNotificationPermission();

  const weightInput = document.getElementById(`weight-${dayId}-${exId}`);
  const wVal = weightInput ? weightInput.value.trim() : '';
  if (wVal) {
    if (!state[dayId].weights) state[dayId].weights = {};
    state[dayId].weights[`${exId}_${setIdx}`] = wVal;
    state[dayId].weights[exId] = wVal;
  }

  state[dayId].sets[exId][setIdx] = true;
  markTime(dayId, exId, setIdx, 'log');
  saveState();
  // Ordered ahead of syncCompletion: finishing the last day of a week
  // reloads `state` for the next week, so this must be read first.
  const dayDone = isDayComplete(dayId);
  syncCompletion(dayId);
  refreshCurrentDay(dayId);

  if (dayDone) {
    return;
  }

  const day = DAYS.find(d => d.id === dayId);
  const exIdx = day.exercises.findIndex(e => resolveExercise(dayId, e).id === exId);
  const ex = resolveExercise(dayId, day.exercises[exIdx]);
  const nextSetInEx = setIdx + 1 < ex.sets ? setIdx + 1 : null;
  const nextOriginalEx = nextSetInEx === null ? day.exercises[exIdx + 1] : null;
  const nextEx = nextOriginalEx ? resolveExercise(dayId, nextOriginalEx) : null;

  let nextLabel = '';
  if (nextSetInEx !== null) {
    nextLabel = `Next: <strong>${ex.name}</strong> — Set ${nextSetInEx + 1}`;
  } else if (nextEx) {
    nextLabel = `Next exercise: <strong>${nextEx.name}</strong>`;
  } else {
    nextLabel = `<strong>Last set of the day!</strong>`;
  }

  document.getElementById('timerSetInfo').textContent = `${ex.name} — Set ${setIdx + 1} Complete`;
  document.getElementById('timerNext').innerHTML = nextLabel;

  const exerciseRest = ex.rest || currentRestTime;
  const restInfo = document.getElementById('timerRestRec');
  if (restInfo && ex.restLabel) {
    restInfo.textContent = `Recommended: ${ex.restLabel}`;
    restInfo.style.display = '';
  } else if (restInfo) {
    restInfo.style.display = 'none';
  }
  startTimer(exerciseRest, () => { refreshCurrentDay(dayId); });
}

function saveWeight(dayId, exId) {
  const input = document.getElementById(`weight-${dayId}-${exId}`);
  if (!input) return;
  const val = input.value.trim();
  if (!state[dayId].weights) state[dayId].weights = {};
  state[dayId].weights[exId] = val;
  saveState();
  const day = DAYS.find(d => d.id === dayId);
  if (!day) return;
  const ex = day.exercises.find(e => e.id === exId);
  if (!ex) return;
  for (let si = 0; si < ex.sets; si++) {
    const btn = document.getElementById(`set-${dayId}-${exId}-${si}`);
    if (!btn) continue;
    let wDiv = btn.querySelector('.set-weight');
    if (val) {
      if (!wDiv) { wDiv = document.createElement('div'); wDiv.className = 'set-weight'; btn.appendChild(wDiv); }
      wDiv.textContent = `${val} lbs`;
    } else {
      if (wDiv) wDiv.remove();
    }
  }
}

function saveEffort(dayId, exId, level) {
  if (!state[dayId].effort) state[dayId].effort = {};
  const current = state[dayId].effort[exId];
  state[dayId].effort[exId] = current === level ? '' : level;
  saveState();
  document.querySelectorAll(`[id^="effort-${dayId}-${exId}-"]`).forEach(btn => {
    const btnLevel = btn.getAttribute('data-level');
    btn.className = 'effort-btn' + (btnLevel === state[dayId].effort[exId] ? ` active-${btnLevel}` : '');
  });
}

// Compatibility shim — the preserved logic layer calls this; it now just re-renders.
function refreshCurrentDay()    { render(); }

function toggleProtocol(dayId, idx) {
  if (!state[dayId].protocol) state[dayId].protocol = Array(PROTOCOL_ITEMS.length).fill(false);
  state[dayId].protocol[idx] = !state[dayId].protocol[idx];
  saveState();
  switchDay(dayId);
}

function skipSet(dayId, exId, setIdx) {
  const current = state[dayId].sets[exId][setIdx];
  if (current === 'skipped') {
    state[dayId].sets[exId][setIdx] = false;
    clearTime(dayId, exId, setIdx);
  } else if (current === false) {
    state[dayId].sets[exId][setIdx] = 'skipped';
    markTime(dayId, exId, setIdx, 'skip');
  }
  saveState();
  // Release the selection once the selected exercise has no set left to log.
  if (view.selectedExId) {
    const day = DAYS.find(d => d.id === dayId);
    const orig = day && day.exercises.find(o => o.id === view.selectedExId);
    if (orig && !hasPendingSet(day, orig)) view.selectedExId = null;
  }
  syncCompletion(dayId);
  refreshCurrentDay(dayId);
}

function skipExercise(dayId, exId) {
  const sets = state[dayId].sets[exId];
  const allSkipped = sets.every(v => v === 'skipped');
  if (allSkipped) {
    for (let i = 0; i < sets.length; i++) { sets[i] = false; clearTime(dayId, exId, i); }
  } else {
    for (let i = 0; i < sets.length; i++) {
      if (sets[i] === false) { sets[i] = 'skipped'; markTime(dayId, exId, i, 'bulk'); }
    }
  }
  saveState();
  syncCompletion(dayId);
  refreshCurrentDay(dayId);
}

function activeExIds(dayId) {
  const day = DAYS.find(d => d.id === dayId);
  if (!day) return [];
  return day.exercises.map(ex => resolveExercise(dayId, ex).id);
}

function skipDay(dayId) {
  const d = state[dayId];
  const ids = activeExIds(dayId);
  const allResolved = ids.every(id => d.sets[id] && d.sets[id].every(v => isResolved(v)));
  const hasSkipped = ids.some(id => d.sets[id] && d.sets[id].some(v => v === 'skipped'));
  ids.forEach(id => {
    const arr = d.sets[id];
    if (!arr) return;
    for (let i = 0; i < arr.length; i++) {
      if (allResolved && hasSkipped) {
        if (arr[i] === 'skipped') { arr[i] = false; clearTime(dayId, id, i); }
      } else {
        if (arr[i] === false) { arr[i] = 'skipped'; markTime(dayId, id, i, 'bulk'); }
      }
    }
  });
  saveState();
  syncCompletion(dayId);
  refreshCurrentDay(dayId);
}

function completeDay(dayId) {
  const ids = activeExIds(dayId);
  ids.forEach(id => {
    const arr = state[dayId].sets[id];
    if (!arr) return;
    for (let i = 0; i < arr.length; i++) {
      if (arr[i] !== true) { arr[i] = true; markTime(dayId, id, i, 'bulk'); }
    }
  });
  saveState();
  syncCompletion(dayId);
  refreshCurrentDay(dayId);
}

// EXERCISE SWAP
function performSwap(dayId, originalExId, newExId) {
  if (!state[dayId].swaps) state[dayId].swaps = {};
  if (newExId === originalExId) {
    delete state[dayId].swaps[originalExId];
  } else {
    state[dayId].swaps[originalExId] = newExId;
  }
  const day = DAYS.find(d => d.id === dayId);
  const originalEx = day.exercises.find(e => e.id === originalExId);
  const ex = resolveExercise(dayId, originalEx);
  // Always re-sync, not just when the array is absent: swapping back and forth
  // between exercises of different lengths would otherwise reuse whatever array
  // the previous occupant of this id left behind, at its length.
  if (!state[dayId].sets[ex.id]) state[dayId].sets[ex.id] = [];
  syncSetCount(dayId, ex.id, setsForWeek(ex));
  saveState();
  syncCompletion(dayId);
  switchDay(dayId);
  updateOverallProgress();
}

// NOTIFICATIONS
function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    try { audioCtx = new Ctor(); }
    catch(err) { console.warn('AudioContext creation failed', err); return null; }
  }
  return audioCtx;
}

function primeAudio() {
  const ctx = getAudioCtx();
  if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
}

function playTimerSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const schedule = () => {
    const t0 = ctx.currentTime;
    [0, 0.15, 0.3].forEach(delay => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, t0 + delay);
      gain.gain.exponentialRampToValueAtTime(0.01, t0 + delay + 0.12);
      osc.start(t0 + delay);
      osc.stop(t0 + delay + 0.12);
    });
  };
  if (ctx.state === 'suspended') {
    ctx.resume().then(schedule).catch(err => console.warn('audio resume failed', err));
  } else {
    schedule();
  }
}

function notifyTimerDone() {
  playTimerSound();
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('Rest Over', { body: 'Time for your next set!', icon: '🏋️', tag: 'gains-timer' });
  }
}

// TIMER — timestamp-based so it survives backgrounding
let timerInterval = null;
let audioKeepAlive = null;
let timerEndTime = null;   // absolute epoch ms when timer expires
let timerTotal = 90;
let currentRestTime = 90;
let pendingCallback = null;
let timerMinimized = false;

const CIRCUMFERENCE = 565; // 2 * π * 90

function startAudioKeepAlive() {
  if (audioKeepAlive) clearInterval(audioKeepAlive);
  audioKeepAlive = setInterval(() => {
    const ctx = getAudioCtx();
    if (!ctx || ctx.state !== 'running') return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    g.gain.value = 0;
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.001);
  }, 5000);
}

function stopAudioKeepAlive() {
  if (audioKeepAlive) { clearInterval(audioKeepAlive); audioKeepAlive = null; }
}

function startTimer(seconds, onComplete) {
  primeAudio();
  startAudioKeepAlive();
  clearInterval(timerInterval);
  timerTotal = seconds;
  timerEndTime = Date.now() + seconds * 1000;
  pendingCallback = onComplete;

  timerMinimized = false;
  updateTimerDisplay();
  document.getElementById('timerPill').classList.remove('visible');
  document.getElementById('timerOverlay').classList.add('visible');
  updatePresetButtons(seconds);

  timerInterval = setInterval(timerTick, 250); // poll 4×/sec for accuracy
}

function timerTick() {
  const remaining = Math.max(0, Math.ceil((timerEndTime - Date.now()) / 1000));
  updateTimerDisplayValue(remaining);
  if (remaining <= 0) {
    clearInterval(timerInterval);
    timerInterval = null;
    notifyTimerDone();
    closeTimer();
    if (pendingCallback) pendingCallback();
  }
}

// When user returns to tab/app, immediately resync
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && timerEndTime !== null) {
    const remaining = Math.max(0, Math.ceil((timerEndTime - Date.now()) / 1000));
    updateTimerDisplayValue(remaining);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      timerEndTime = null;
      notifyTimerDone();
      closeTimer();
      if (pendingCallback) pendingCallback();
    }
  }
});

function updateTimerDisplay() {
  const remaining = timerEndTime
    ? Math.max(0, Math.ceil((timerEndTime - Date.now()) / 1000))
    : timerTotal;
  updateTimerDisplayValue(remaining);
}

function updateTimerDisplayValue(remaining) {
  const mins = Math.floor(remaining / 60);
  const secs = remaining % 60;
  const display = `${mins}:${String(secs).padStart(2, '0')}`;
  const urgent = remaining <= 10;
  const progress = remaining / timerTotal;

  // Full overlay
  const timeEl = document.getElementById('timerDisplay');
  const ringEl = document.getElementById('timerRingFill');
  timeEl.textContent = display;
  timeEl.classList.toggle('urgent', urgent);
  ringEl.classList.toggle('urgent', urgent);
  ringEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);

  // Minimized pill
  const pillTime = document.getElementById('pillTimerDisplay');
  const pillRing = document.getElementById('pillRingFill');
  pillTime.textContent = display;
  pillTime.classList.toggle('urgent', urgent);
  pillRing.classList.toggle('urgent', urgent);
  const pillCirc = 2 * Math.PI * 12; // r=12
  pillRing.style.strokeDashoffset = pillCirc * (1 - progress);
}

function closeTimer() {
  timerEndTime = null;
  timerMinimized = false;
  stopAudioKeepAlive();
}

function updatePresetButtons(active) {
  document.querySelectorAll('.rest-preset-btn').forEach(btn => {
    const parts = btn.textContent.split(':');
    const val = parseInt(parts[0]) * 60 + parseInt(parts[1]);
    btn.classList.toggle('active', val === active);
  });
}

// Suppress iOS shake-to-undo: blur inputs on outside tap so iOS has no undo target
document.addEventListener('touchstart', (e) => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT' && !e.target.closest('input')) {
    document.activeElement.blur();
  }
}, { passive: true });
document.addEventListener('beforeinput', (e) => {
  if (e.inputType === 'historyUndo') e.preventDefault();
});

// TOOLTIP — fixed position, escapes all overflow:hidden parents
const tooltipEl = document.getElementById('tooltip');
let tooltipTimeout = null;

function showTooltip(e) {
  const target = e.currentTarget;
  const text = target.getAttribute('data-tip');
  if (!text) return;
  tooltipEl.textContent = text;
  positionTooltip(e.clientX, e.clientY);
  tooltipEl.classList.add('visible');
}

function positionTooltip(cx, cy) {
  const W = 240, pad = 10;
  let left = cx - W / 2;
  let top = cy - tooltipEl.offsetHeight - 12;
  if (left < pad) left = pad;
  if (left + W > window.innerWidth - pad) left = window.innerWidth - W - pad;
  if (top < pad) top = cy + 20; // flip below if no room above
  tooltipEl.style.left = left + 'px';
  tooltipEl.style.top = top + 'px';
}

function moveTooltip(e) { positionTooltip(e.clientX, e.clientY); }
function hideTooltip() { tooltipEl.classList.remove('visible'); }

// Delegate to all .tip elements via event delegation
document.addEventListener('mouseover', e => {
  const tip = e.target.closest('.tip');
  if (tip) { tip.addEventListener('mousemove', moveTooltip); showTooltip({ currentTarget: tip, clientX: e.clientX, clientY: e.clientY }); }
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.tip')) hideTooltip();
});

// Touch support
document.addEventListener('touchstart', e => {
  const tip = e.target.closest('.tip');
  if (tip) {
    const t = e.touches[0];
    tooltipEl.textContent = tip.getAttribute('data-tip') || '';
    positionTooltip(t.clientX, t.clientY);
    tooltipEl.classList.add('visible');
    clearTimeout(tooltipTimeout);
    tooltipTimeout = setTimeout(hideTooltip, 5000);
  }
}, { passive: true });

// Prime AudioContext on first user gesture so later timer beeps are reliable
document.addEventListener('touchstart', primeAudio, { once: true, passive: true });
document.addEventListener('click', primeAudio, { once: true });

// EXPORT / IMPORT
function exportData() {
  const savedProgIdx = currentProgramIdx;
  const allPrograms = {};
  PROGRAMS.forEach((prog, pi) => {
    const weeks = {};
    for (let w = 1; w <= prog.totalWeeks; w++) {
      try {
        const key = `${STORAGE_KEY}_${prog.id}_w${w}`;
        const d = JSON.parse(localStorage.getItem(key) || '{}');
        if (Object.keys(d).length) weeks[w] = d;
      } catch(e) {}
    }
    const weekNum = parseInt(localStorage.getItem(`hypertrophy_week_${prog.id}`) || '1');
    const startDate = localStorage.getItem(programStartKey(prog.id));
    allPrograms[prog.id] = startDate
      ? { weeks, currentWeek: weekNum, startDate }
      : { weeks, currentWeek: weekNum };
  });
  // Stays labelled 3 deliberately. The version integer is the import gate, so a
  // file labelled 4 is rejected outright by builds that predate `times`. The
  // format is a structural superset of v3 — `times` and `startDate` are extra
  // keys older builds ignore — so a 3-labelled file imports into both.
  const data = { programs: allPrograms, currentProgram: savedProgIdx, version: 3 };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `gains-backup-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
  view.importMsg = 'Exported all programs & weeks.';
  view.importOk = true;
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);

      // Nothing emits 4 any more (see exportData), but accepting it costs
      // nothing and handles any file written by an interim build.
      if ((data.version === 4 || data.version === 3) && data.programs) {
        for (const [progId, progData] of Object.entries(data.programs)) {
          for (const [w, wState] of Object.entries(progData.weeks)) {
            localStorage.setItem(`${STORAGE_KEY}_${progId}_w${w}`, JSON.stringify(wState));
          }
          localStorage.setItem(`hypertrophy_week_${progId}`, progData.currentWeek);
          if (progData.startDate) {
            localStorage.setItem(programStartKey(progId), progData.startDate);
          } else {
            // Otherwise a start date from the pre-import state would survive and
            // be shown against restored data it has nothing to do with.
            localStorage.removeItem(programStartKey(progId));
          }
        }
        if (typeof data.currentProgram === 'number') {
          currentProgramIdx = data.currentProgram;
          saveProgram();
        }
      } else if (data.version === 2 && data.weeks) {
        if (!data.currentWeek) { alert('Invalid backup file.'); return; }
        for (const [w, wState] of Object.entries(data.weeks)) {
          localStorage.setItem(`${STORAGE_KEY}_meso1_w${w}`, JSON.stringify(wState));
        }
        localStorage.setItem('hypertrophy_week_meso1', data.currentWeek);
      } else if (data.state && data.currentWeek) {
        localStorage.setItem(`${STORAGE_KEY}_meso1_w${data.currentWeek}`, JSON.stringify(data.state));
        localStorage.setItem('hypertrophy_week_meso1', data.currentWeek);
      } else {
        alert('Invalid backup file.'); return;
      }

      switchProgram(currentProgramIdx);
    } catch (err) {
      alert('Could not read backup file.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function isWeekComplete() {
  return DAYS.every(day => isDayComplete(day.id));
}

function getStartDay() {
  for (const day of DAYS) {
    const ids = day.exercises.map(e => resolveExercise(day.id, e).id);
    const some = ids.some(id => state[day.id].sets[id] && state[day.id].sets[id].some(isResolved));
    const all  = ids.every(id => state[day.id].sets[id] && state[day.id].sets[id].every(isResolved));
    if (some && !all) return day.id;
  }
  for (const day of DAYS) if (!isDayComplete(day.id)) return day.id;
  return DAYS[0].id;
}

// Does this week have anything logged or skipped at all? Guards the
// auto-advance: a program day carrying no exercises is vacuously "complete",
// and without this an untouched week would walk straight to the last one.
function weekHasActivity() {
  return DAYS.some(d => d.exercises.some(o => {
    const ex = resolveExercise(d.id, o);
    return (state[d.id].sets[ex.id] || []).some(isResolved);
  }));
}

function advanceToCurrentWeek() {
  // If current week is fully complete, advance to next incomplete week
  const maxWeeks = PROGRAMS[currentProgramIdx].totalWeeks;
  while (currentWeek < maxWeeks && weekHasActivity() && isWeekComplete()) {
    currentWeek++;
    saveWeek();
    initState();
  }
}

// Generate apple-touch-icon via canvas (iOS requires PNG)
(function() {
  const s = 180, r = 40;
  const c = document.createElement('canvas');
  c.width = s; c.height = s;
  const ctx = c.getContext('2d');
  // Rounded rect background
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(s-r, 0); ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s-r); ctx.quadraticCurveTo(s, s, s-r, s);
  ctx.lineTo(r, s); ctx.quadraticCurveTo(0, s, 0, s-r);
  ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#191813'; ctx.fill();
  // Weight plates
  ctx.fillStyle = '#f2efe8';
  ctx.beginPath(); ctx.roundRect(16, 52, 28, 76, 8); ctx.fill();
  ctx.beginPath(); ctx.roundRect(136, 52, 28, 76, 8); ctx.fill();
  // Bar with gradient
  const grad = ctx.createLinearGradient(30, 0, 150, 0);
  grad.addColorStop(0, '#e34f1e'); grad.addColorStop(0.5, '#ff7a4d'); grad.addColorStop(1, '#e34f1e');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.roundRect(30, 80, 120, 20, 10); ctx.fill();
  // Center node cutout
  ctx.fillStyle = '#191813';
  ctx.beginPath(); ctx.arc(90, 90, 14, 0, Math.PI*2); ctx.fill();
  // AI nodes
  ctx.fillStyle = '#e34f1e';
  ctx.beginPath(); ctx.arc(90, 90, 7, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.arc(65, 90, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(115, 90, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  // Connections
  ctx.strokeStyle = '#e34f1e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(65,90); ctx.lineTo(83,90); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(97,90); ctx.lineTo(115,90); ctx.stroke();
  ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.moveTo(90,76); ctx.lineTo(90,52); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(90,104); ctx.lineTo(90,128); ctx.stroke();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#e34f1e';
  ctx.beginPath(); ctx.arc(90, 49, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(90, 131, 4, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  // Set as apple-touch-icon
  const link = document.createElement('link');
  link.rel = 'apple-touch-icon';
  link.href = c.toDataURL('image/png');
  document.head.appendChild(link);
})();

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function curProg() { return PROGRAMS[currentProgramIdx]; }
function curDay()  { return DAYS.find(d => d.id === view.dayId) || DAYS[0]; }
