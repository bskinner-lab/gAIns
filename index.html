const THEME_KEY = 'gains_theme';

function storedTheme() {
  try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
}

function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

function setTheme(t) {
  try {
    if (t) localStorage.setItem(THEME_KEY, t);
    else localStorage.removeItem(THEME_KEY);
  } catch (e) {}
  applyTheme(t);
  render();
}

function effectiveTheme() {
  const s = storedTheme();
  if (s) return s;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

applyTheme(storedTheme());

  'LLP': 'Length-Limited Partials: bottom-half reps in the fully stretched position (last set only). For isolation exercises only — never on compounds. Maximizes tension where the muscle is longest — high stimulus, low joint stress.',
  'RPE': 'Rate of Perceived Exertion (1–10). RPE 7 = 3 reps left. RPE 8 = 2 left. RPE 9 = 1 left. Exercise RPE is the allowed range; weekly RPE determines how deep into that range to push. Early weeks stay near the lower end, later weeks push toward the upper end.',
  'RIR': 'Reps In Reserve — how many more reps you could have done before failure. RIR 2 = stopped with 2 reps left.',
  'drop set': 'Complete your working set, immediately reduce weight 20–30%, then continue for more reps without rest.',
  'compounds': 'Multi-joint movements (squat, deadlift, bench press, rows) that recruit many muscle groups simultaneously. Higher injury risk at failure — always keep 1–2 RIR.',
  'MRV': 'Maximum Recoverable Volume — the most training volume you can handle while still recovering between sessions. Exceeding MRV leads to excessive fatigue.',
  'eccentric': 'The lowering/lengthening phase of a lift (e.g. lowering the bar on a bench press). Controlling this phase 3–4 seconds increases muscle damage and growth stimulus.',
  'rest-pause': 'Take a set to near-failure, rest 10–15 seconds, then squeeze out additional reps. An intensity technique for isolations only.',

let DAYS = PROGRAMS[0].days;
let MESOCYCLE = PROGRAMS[0].mesocycle;
let WEEK_PHASES = PROGRAMS[0].weekPhases;
let PROTOCOL_ITEMS = PROGRAMS[0].protocolItems;

// PROGRAM TRACKING
let currentProgramIdx = 0;

function currentProgramId() {
  return PROGRAMS[currentProgramIdx].id;
}

function weekStorageKey(week) {
  return `${STORAGE_KEY}_${currentProgramId()}_w${week}`;
}

function weekKey() {
  return `hypertrophy_week_${currentProgramId()}`;
}

// WEEK TRACKING
let currentWeek = 1;

function loadWeek() {
  try { currentWeek = parseInt(localStorage.getItem(weekKey()) || '1'); } catch(e) {}
  const maxWeeks = PROGRAMS[currentProgramIdx].totalWeeks;
  if (isNaN(currentWeek) || currentWeek < 1) currentWeek = 1;
  if (currentWeek > maxWeeks) currentWeek = maxWeeks;
}

function saveWeek() {
  try { localStorage.setItem(weekKey(), currentWeek); } catch(e) {}
}

function loadProgram() {
  try {
    const saved = parseInt(localStorage.getItem('hypertrophy_program') || '0');
    if (!isNaN(saved) && saved >= 0 && saved < PROGRAMS.length) currentProgramIdx = saved;
  } catch(e) {}
}

function saveProgram() {
  try { localStorage.setItem('hypertrophy_program', currentProgramIdx); } catch(e) {}
}

function changeWeek(delta) {
  const maxWeeks = PROGRAMS[currentProgramIdx].totalWeeks;
  currentWeek = Math.min(maxWeeks, Math.max(1, currentWeek + delta));
  saveWeek();
  initState();
  updateWeekDisplay();
  updateOverallProgress();
  if (currentDayId !== 'info') switchDay(currentDayId);
}

function updateWeekDisplay() {
  const phase = WEEK_PHASES[currentWeek - 1];
  const maxWeeks = PROGRAMS[currentProgramIdx].totalWeeks;
  document.getElementById('weekDisplay').textContent = `${currentWeek} / ${maxWeeks}`;
  const phaseEl = document.getElementById('weekPhase');
  phaseEl.textContent = `${phase.label} · ${phase.rpe}`;
  phaseEl.style.color = phase.color;
}

function updateProgramSelector() {
  document.querySelectorAll('.program-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === currentProgramIdx);
  });
  document.getElementById('headerSubtitle').textContent = PROGRAMS[currentProgramIdx].subtitle;
}

function rebuildLegacyIdMap() {
  Object.keys(LEGACY_ID_MAP).forEach(k => delete LEGACY_ID_MAP[k]);
  DAYS.forEach(day => {
    LEGACY_ID_MAP[day.id] = {};
    day.exercises.forEach((ex, i) => { LEGACY_ID_MAP[day.id][i] = ex.id; });
  });
}

function resolveExercise(dayId, ex) {
  const swaps = (state[dayId] && state[dayId].swaps) || {};
  const altId = swaps[ex.id];
  if (!altId) return ex;
  const alts = EXERCISE_ALTERNATIVES[ex.id];
  if (!alts) return ex;
  return alts.find(a => a.id === altId) || ex;
}

let programInitialized = false;
function switchProgram(idx) {
  if (programInitialized && idx === currentProgramIdx) return;
  programInitialized = true;
  const prog = PROGRAMS[idx];
  currentProgramIdx = idx;
  DAYS = prog.days;
  MESOCYCLE = prog.mesocycle;
  WEEK_PHASES = prog.weekPhases;
  PROTOCOL_ITEMS = prog.protocolItems;
  rebuildLegacyIdMap();
  saveProgram();
  loadWeek();
  initState();
  advanceToCurrentWeek();
  updateWeekDisplay();
  updateProgramSelector();
  switchDay(getStartDay());
  updateOverallProgress();
}

// STATE — sets[exId][si] = false | true | 'skipped', weights[exId] = number|null
let state = {};

const LEGACY_ID_MAP = {};
rebuildLegacyIdMap();

function migrateDayState(dayId, sd) {
  if (!sd || !sd.sets) return sd;
  const hasStringKeys = Object.keys(sd.sets).some(k => isNaN(k));
  if (hasStringKeys) return sd;
  const map = LEGACY_ID_MAP[dayId];
  const m = { sets: {}, weights: {}, effort: {}, protocol: sd.protocol || [], swaps: sd.swaps || {} };
  Object.keys(sd.sets).forEach(k => {
    const exId = map[k];
    if (exId) m.sets[exId] = sd.sets[k];
  });
  if (sd.weights) {
    Object.keys(sd.weights).forEach(k => {
      if (k.includes('_')) {
        const [ei, si] = k.split('_');
        const exId = map[ei];
        if (exId) m.weights[`${exId}_${si}`] = sd.weights[k];
      } else {
        const exId = map[k];
        if (exId) m.weights[exId] = sd.weights[k];
      }
    });
  }
  if (sd.effort) {
    Object.keys(sd.effort).forEach(k => {
      const exId = map[k];
      if (exId) m.effort[exId] = sd.effort[k];
    });
  }
  return m;
}

function initState() {
  const raw = loadState();
  const saved = {};
  DAYS.forEach(day => { saved[day.id] = migrateDayState(day.id, raw[day.id]); });
  DAYS.forEach(day => {
    const savedDay = saved[day.id] || {};
    state[day.id] = {
      sets: {},
      weights: savedDay.weights || {},
      effort: savedDay.effort || {},
      protocol: savedDay.protocol || [],
      swaps: savedDay.swaps || {}
    };
    day.exercises.forEach(originalEx => {
      const ex = resolveExercise(day.id, originalEx);
      state[day.id].sets[ex.id] = savedDay.sets ? (savedDay.sets[ex.id] || Array(ex.sets).fill(false)) : Array(ex.sets).fill(false);
      while (state[day.id].sets[ex.id].length < ex.sets) state[day.id].sets[ex.id].push(false);
    });
  });
  saveState();
  prefillFromPreviousWeeks();
}

function prefillFromPreviousWeeks() {
  if (currentWeek <= 1) return;
  DAYS.forEach(day => {
    const weights = state[day.id].weights;
    const effort = state[day.id].effort;
    day.exercises.forEach(originalEx => {
      const ex = resolveExercise(day.id, originalEx);
      for (let w = currentWeek - 1; w >= 1; w--) {
        try {
          const raw = JSON.parse(localStorage.getItem(weekStorageKey(w)) || '{}');
          const prev = migrateDayState(day.id, raw[day.id]);
          if (!prev) continue;
          if (!weights[ex.id] && prev.weights && prev.weights[ex.id]) {
            weights[ex.id] = prev.weights[ex.id];
          }
          if (!effort[ex.id] && prev.effort && prev.effort[ex.id]) {
            effort[ex.id] = prev.effort[ex.id];
          }
          if (weights[ex.id] && effort[ex.id]) return;
        } catch(e) {}
      }
    });
  });
}

// Cross-week history for a single exercise (current program). Ascending by week.
// Reads each week's localStorage blob via migrateDayState; prefers in-memory
// `state` for the current week so unsaved edits are reflected.
function getExerciseHistory(dayId, exId) {
  const maxWeeks = PROGRAMS[currentProgramIdx].totalWeeks;
  const out = [];
  for (let w = 1; w <= maxWeeks; w++) {
    let dayState;
    if (w === currentWeek && state[dayId]) {
      dayState = state[dayId];
    } else {
      try {
        const raw = JSON.parse(localStorage.getItem(weekStorageKey(w)) || '{}');
        dayState = migrateDayState(dayId, raw[dayId]);
      } catch (e) { dayState = null; }
    }
    if (!dayState) continue;
    const rawW = (dayState.weights || {})[exId];
    const weight = (rawW === '' || rawW == null) ? null : Number(rawW);
    const eff = (dayState.effort || {})[exId] || '';
    if (weight == null && !eff) continue;
    out.push({ week: w, weight, effort: eff });
  }
  return out;
}

// Most recent logged entry strictly before the current week, or null.
function priorWeekEntry(dayId, exId) {
  const hist = getExerciseHistory(dayId, exId);
  for (let i = hist.length - 1; i >= 0; i--) {
    if (hist[i].week < currentWeek) return hist[i];
  }
  return null;
}

function saveState() {
  try { localStorage.setItem(weekStorageKey(currentWeek), JSON.stringify(state)); } catch(e) {}
}

function loadState() {
  try { return JSON.parse(localStorage.getItem(weekStorageKey(currentWeek)) || '{}'); } catch(e) { return {}; }
}

// Migrate old non-week-aware state to week 1
function migrateOldState() {
  try {
    const old = localStorage.getItem(STORAGE_KEY);
    if (!old) return;
    const parsed = JSON.parse(old);
    const dayIds = DAYS.map(d => d.id);
    if (!dayIds.some(id => parsed[id])) return;
    if (!localStorage.getItem(weekStorageKey(1))) {
      localStorage.setItem(weekStorageKey(1), old);
    }
    localStorage.removeItem(STORAGE_KEY);
  } catch(e) {}
}

function migrateToMultiProgram() {
  if (localStorage.getItem('hypertrophy_migrated_v3')) return;
  for (let w = 1; w <= 8; w++) {
    const oldKey = `${STORAGE_KEY}_w${w}`;
    const newKey = `${STORAGE_KEY}_meso1_w${w}`;
    const data = localStorage.getItem(oldKey);
    if (data && !localStorage.getItem(newKey)) {
      localStorage.setItem(newKey, data);
      localStorage.removeItem(oldKey);
    }
  }
  const oldWeek = localStorage.getItem('hypertrophy_week');
  if (oldWeek && !localStorage.getItem('hypertrophy_week_meso1')) {
    localStorage.setItem('hypertrophy_week_meso1', oldWeek);
    localStorage.removeItem('hypertrophy_week');
  }
  localStorage.setItem('hypertrophy_migrated_v3', '1');
}

function isResolved(v) { return v === true || v === 'skipped'; }

function totalSets() {
  let total = 0;
  DAYS.forEach(d => d.exercises.forEach(originalEx => {
    const ex = resolveExercise(d.id, originalEx);
    total += ex.sets;
  }));
  return total;
}

function completedSets() {
  let done = 0;
  DAYS.forEach(day => {
    day.exercises.forEach(originalEx => {
      const ex = resolveExercise(day.id, originalEx);
      const arr = state[day.id].sets[ex.id];
      if (arr) arr.forEach(v => { if (v === true) done++; });
    });
  });
  return done;
}

function skippedSetsCount() {
  let count = 0;
  DAYS.forEach(day => {
    day.exercises.forEach(originalEx => {
      const ex = resolveExercise(day.id, originalEx);
      const arr = state[day.id].sets[ex.id];
      if (arr) arr.forEach(v => { if (v === 'skipped') count++; });
    });
  });
  return count;
}

function isDayComplete(dayId) {
  const day = DAYS.find(d => d.id === dayId);
  if (!day) return false;
  return day.exercises.every(originalEx => {
    const ex = resolveExercise(dayId, originalEx);
    const arr = state[dayId].sets[ex.id];
    return arr && arr.every(v => isResolved(v));
  });
}

function updateOverallProgress() {
  const done = completedSets();
  const total = totalSets();
  const pct = total === 0 ? 0 : Math.round((done / total) * 100);
  const skipped = skippedSetsCount();
  document.getElementById('overallLabel').textContent = skipped > 0
    ? `${done} / ${total} sets (${skipped} skipped)`
    : `${done} / ${total} sets`;
  document.getElementById('overallPct').textContent = `${pct}%`;
  const circumference = 138;
  const offset = circumference - (pct / 100) * circumference;
  document.getElementById('overallRing').style.strokeDashoffset = offset;
}

function renderTabs(activeId) {
  const container = document.getElementById('dayTabs');
  container.innerHTML = '';
  DAYS.forEach(day => {
    const btn = document.createElement('button');
    const complete = isDayComplete(day.id);
    const ids = activeExIds(day.id);
    const hasAnyDone = complete && ids.some(id => state[day.id].sets[id] && state[day.id].sets[id].some(v => v === true));
    btn.className = 'day-tab' + (day.id === activeId ? ' active' : '') + (complete && hasAnyDone ? ' completed' : '') + (complete && !hasAnyDone ? ' all-skipped' : '');
    btn.textContent = day.label;
    btn.onclick = () => switchDay(day.id);
    container.appendChild(btn);
  });
  // Info tab
  const info = document.createElement('button');
  info.className = 'day-tab info-tab' + (activeId === 'info' ? ' active' : '');
  info.textContent = 'Plan';
  info.onclick = () => switchDay('info');
  container.appendChild(info);
  // Progress tab
  const prog = document.createElement('button');
  prog.className = 'day-tab info-tab' + (activeId === 'progress' ? ' active' : '');
  prog.textContent = 'Progress';
  prog.onclick = () => switchDay('progress');
  container.appendChild(prog);
}

  if (day.id === 'info') return renderInfoPanel();

    html += `

        <div class="protocol-items">

    });
    html += `</div></div>`;
  }

  day.exercises.forEach((originalEx, ei) => {

    const sets = state[day.id].sets[ex.id] || Array(ex.sets).fill(false);
    const weights = state[day.id].weights || {};
    const currentWeight = weights[ex.id] || '';
    const doneSets = sets.filter(v => v === true).length;
    const skippedSets = sets.filter(v => v === 'skipped').length;
    const resolvedSets = doneSets + skippedSets;
    const allDone = resolvedSets === ex.sets;
    const isOpen = !allDone;
    const cardId = `card-${day.id}-${ex.id}`;

    const prior = priorWeekEntry(day.id, ex.id);
    const effortLabel = { low: 'Low', medium: 'Med', high: 'High' };
    const lastWeekRef = prior ? `
      <div class="last-week-ref">Last (W${prior.week}):
        ${prior.weight != null
          ? `<span class="lwr-weight">${prior.weight} lbs</span>`

    const hasAlts = EXERCISE_ALTERNATIVES[originalEx.id];

    const llpTag = ex.llp ? `<span class="tag tag-llp tip" data-tip="${GLOSSARY['LLP'].replace(/"/g,'&quot;')}">LLP</span>` : '';

    const restTag = ex.restLabel ? `<span class="tag tag-rest tip" data-tip="Recommended rest between sets for this exercise">⏱ ${ex.restLabel}</span>` : '';

    html += `
      <div class="exercise-card${allDone ? ' all-done' : ''}${isOpen ? ' open' : ''}" id="${cardId}">
        <div class="exercise-header" onclick="toggleCard('${cardId}', event)">
          <div class="exercise-info">
            <div class="exercise-name">${ex.name}</div>
            <div class="exercise-meta">
              <div class="exercise-tag"><span>${ex.sets}</span> sets</div>
              <div class="exercise-tag"><span>${ex.reps}</span> reps</div>
              ${currentWeight ? `<div class="exercise-tag"><span>${currentWeight}</span> lbs</div>` : ''}
            </div>
            <div class="ex-tags">${rpeTag}${restTag}${llpTag}${compTag}</div>
            ${ex.note ? `<div class="exercise-note-small">${ex.note}</div>` : ''}
          </div>
          <div class="exercise-status">
            ${swapBtn}
            <div class="sets-badge${allDone ? ' done' : ''}">${resolvedSets}/${ex.sets}</div>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div class="sets-container">
          <div class="sets-grid">
    `;

    for (let si = 0; si < ex.sets; si++) {
      const val = sets[si];
      const done = val === true;
      const skipped = val === 'skipped';
      const setWeight = (weights[`${ex.id}_${si}`] || currentWeight) || '';
      const stateClass = done ? ' done' : skipped ? ' skipped' : '';
      let label;
      if (done) {
        label = `<div class="set-complete-label" id="scl-${day.id}-${ex.id}-${si}">✓ Done</div>`;
      } else if (skipped) {
        label = `<div class="set-skipped-label">— Skipped</div>`;
      } else {
        label = `<div class="set-action-label">Tap to complete</div>`;
      }
      html += `
        <div class="set-btn-wrapper">
          <button class="set-btn${stateClass}" id="set-${day.id}-${ex.id}-${si}" onclick="toggleSet('${day.id}', '${ex.id}', ${si})">
            <div class="set-num">Set ${si + 1}</div>
            <div class="set-reps">${ex.reps.split('–')[0].replace(/[^0-9]/g,'') || '—'}</div>
            ${label}
            ${setWeight ? `<div class="set-weight">${setWeight} lbs</div>` : ''}
          </button>
          ${!done ? `<div class="skip-set-link" onclick="event.stopPropagation(); skipSet('${day.id}', '${ex.id}', ${si})">${skipped ? 'Unskip' : 'Skip'}</div>` : ''}
        </div>
      `;
    }

    html += `
          </div>
          ${lastWeekRef}
          <div class="weight-row">
            <span class="weight-label">Weight:</span>
            <input
              class="weight-input"
              type="number"
              inputmode="decimal"
              placeholder="0"
              value="${currentWeight}"
              id="weight-${day.id}-${ex.id}"
              oninput="saveWeight('${day.id}', '${ex.id}')"
              onkeydown="if(event.key==='Enter') this.blur();"
            />
            <span class="weight-unit">lbs</span>
          </div>
          <div class="effort-row">
            <span class="effort-label">Effort:</span>
            <div class="effort-toggles">
              ${['low','medium','high'].map(lvl => {
                const currentEffort = (state[day.id].effort || {})[ex.id] || '';
                const activeClass = currentEffort === lvl ? ` active-${lvl}` : '';
                const label = lvl.charAt(0).toUpperCase() + lvl.slice(1);
                return `<button class="effort-btn${activeClass}" id="effort-${day.id}-${ex.id}-${lvl}" data-level="${lvl}" onclick="event.stopPropagation(); saveEffort('${day.id}', '${ex.id}', '${lvl}')">${label}</button>`;
              }).join('')}
            </div>
          </div>
          ${sets.some(v => v === false)
            ? `<div style="text-align:center;padding:4px 0 8px"><button class="skip-exercise-btn" onclick="skipExercise('${day.id}', '${ex.id}')">Skip Exercise</button></div>`
            : sets.every(v => v === 'skipped')
              ? `<div style="text-align:center;padding:4px 0 8px"><button class="skip-exercise-btn" onclick="skipExercise('${day.id}', '${ex.id}')">Unskip Exercise</button></div>`
              : ''
          }
        </div>
      </div>
    `;
  });

  html += `<div class="day-complete-banner${isDayComplete(day.id) ? ' visible' : ''}" id="banner-${day.id}">
    <div class="big">DAY COMPLETE 🔥</div>
    <p>Great work. Rest up and recover strong.</p>
  </div>`;

  return html;
}

function sparklineSVG(hist) {
  const pts = hist.filter(h => h.weight != null);
  if (pts.length < 2) return '<div class="prog-spark-empty">Need 2+ weeks of weight for a trend</div>';

  const W = 240, H = 40, pad = 6;
  const weeks = pts.map(p => p.week);
  const vals = pts.map(p => p.weight);
  const minW = Math.min(...weeks), maxW = Math.max(...weeks);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const spanW = (maxW - minW) || 1;
  const spanV = (maxV - minV) || 1;
  const x = wk => pad + ((wk - minW) / spanW) * (W - 2 * pad);
  const y = v => (H - pad) - ((v - minV) / spanV) * (H - 2 * pad);

  const linePts = pts.map(p => `${x(p.week).toFixed(1)},${y(p.weight).toFixed(1)}`).join(' ');
  const effColor = { low: 'var(--green)', medium: 'var(--accent)', high: 'var(--accent2)' };
  const dots = pts.map(p => {
    const c = p.effort ? effColor[p.effort] : 'var(--muted)';
    return `<circle cx="${x(p.week).toFixed(1)}" cy="${y(p.weight).toFixed(1)}" r="3" fill="${c}"/>`;
  }).join('');

  return `<svg class="prog-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polyline points="${linePts}" fill="none" stroke="var(--border)" stroke-width="1.5"/>
      ${dots}
    </svg>`;
}

function renderProgressPanel() {
  const maxWeeks = PROGRAMS[currentProgramIdx].totalWeeks;
  let html = `<div class="meso-section">
    <div class="meso-title">PROGRESSION</div>
    <div class="meso-subtitle">${PROGRAMS[currentProgramIdx].name} · weight & effort by week</div>`;

  let anyData = false;

  DAYS.forEach(day => {
    let dayRows = '';
    day.exercises.forEach(originalEx => {
      const ex = resolveExercise(day.id, originalEx);
      const hist = getExerciseHistory(day.id, ex.id);
      if (!hist.length) return;
      anyData = true;

      const byWeek = {};
      hist.forEach(h => { byWeek[h.week] = h; });

      const cells = [];
      for (let w = 1; w <= maxWeeks; w++) {
        const h = byWeek[w];
        if (!h) {
          cells.push(`<div class="prog-cell empty"><div class="prog-wk">W${w}</div><div class="prog-val">·</div></div>`);
        } else {
          const dot = h.effort ? `<span class="prog-dot lwr-${h.effort}"></span>` : '';
          const val = h.weight != null ? h.weight : '—';
          cells.push(`<div class="prog-cell"><div class="prog-wk">W${w}</div><div class="prog-val">${val}${dot}</div></div>`);
        }
      }

      dayRows += `
        <div class="prog-ex">
          <div class="prog-ex-name">${ex.name}</div>
          ${sparklineSVG(hist)}
          <div class="prog-grid">${cells.join('')}</div>
        </div>`;
    });

    if (dayRows) {
      html += `<div class="prog-day">
        <div class="prog-day-label">${day.label} · ${day.title}</div>
        ${dayRows}
      </div>`;
    }
  });

  if (!anyData) {
    html += `<div class="prog-empty">No weights or effort logged yet. Track a few sessions and your progression will appear here.</div>`;
  }

  html += `</div>`;
  return html;
}

function toggleMeso(i) {

function switchDay(dayId) {
  const mainContent = document.getElementById('mainContent');
  if (dayId === 'info') {
    mainContent.innerHTML = `<div class="day-panel active" id="info">${renderInfoPanel()}</div>`;
    renderTabs('info');
    currentDayId = 'info';
    return;
  }
  if (dayId === 'progress') {
    mainContent.innerHTML = `<div class="day-panel active" id="progress">${renderProgressPanel()}</div>`;
    renderTabs('progress');
    currentDayId = 'progress';
    return;
  }
  const day = DAYS.find(d => d.id === dayId);
  mainContent.innerHTML = `<div class="day-panel active" id="${dayId}">${renderDay(day)}</div>`;
  renderTabs(dayId);
  currentDayId = dayId;
}

let currentDayId = DAYS[0].id;

function toggleCard(cardId, e) {
  if (e && e.target.closest('.tip')) return;
  const card = document.getElementById(cardId);
  card.classList.toggle('open');
}

function toggleSet(dayId, exId, setIdx) {
  const wasDone = state[dayId].sets[exId][setIdx] === true;

  if (wasDone) {
    state[dayId].sets[exId][setIdx] = false;
    saveState();
    refreshCurrentDay(dayId);
    return;
  }

  requestNotificationPermission();

  const weightInput = document.getElementById(`weight-${dayId}-${exId}`);
  const wVal = weightInput ? weightInput.value.trim() : '';
  if (wVal) {
    if (!state[dayId].weights) state[dayId].weights = {};
    state[dayId].weights[`${exId}_${setIdx}`] = wVal;
    state[dayId].weights[exId] = wVal;
  }

  state[dayId].sets[exId][setIdx] = true;
  saveState();
  refreshCurrentDay(dayId);

  if (isDayComplete(dayId)) {
    return;
  }

  const day = DAYS.find(d => d.id === dayId);
  const exIdx = day.exercises.findIndex(e => resolveExercise(dayId, e).id === exId);
  const ex = resolveExercise(dayId, day.exercises[exIdx]);
  const nextSetInEx = setIdx + 1 < ex.sets ? setIdx + 1 : null;
  const nextOriginalEx = nextSetInEx === null ? day.exercises[exIdx + 1] : null;
  const nextEx = nextOriginalEx ? resolveExercise(dayId, nextOriginalEx) : null;

  let nextLabel = '';
  if (nextSetInEx !== null) {
    nextLabel = `Next: <strong>${ex.name}</strong> — Set ${nextSetInEx + 1}`;
  } else if (nextEx) {
    nextLabel = `Next exercise: <strong>${nextEx.name}</strong>`;
  } else {
    nextLabel = `<strong>Last set of the day!</strong>`;
  }

  document.getElementById('timerSetInfo').textContent = `${ex.name} — Set ${setIdx + 1} Complete`;
  document.getElementById('timerNext').innerHTML = nextLabel;

  const exerciseRest = ex.rest || currentRestTime;
  const restInfo = document.getElementById('timerRestRec');
  if (restInfo && ex.restLabel) {
    restInfo.textContent = `Recommended: ${ex.restLabel}`;
    restInfo.style.display = '';
  } else if (restInfo) {
    restInfo.style.display = 'none';
  }
  startTimer(exerciseRest, () => { refreshCurrentDay(dayId); });
}

function saveWeight(dayId, exId) {
  const input = document.getElementById(`weight-${dayId}-${exId}`);
  if (!input) return;
  const val = input.value.trim();
  if (!state[dayId].weights) state[dayId].weights = {};
  state[dayId].weights[exId] = val;
  saveState();
  const day = DAYS.find(d => d.id === dayId);
  if (!day) return;
  const ex = day.exercises.find(e => e.id === exId);
  if (!ex) return;
  for (let si = 0; si < ex.sets; si++) {
    const btn = document.getElementById(`set-${dayId}-${exId}-${si}`);
    if (!btn) continue;
    let wDiv = btn.querySelector('.set-weight');
    if (val) {
      if (!wDiv) { wDiv = document.createElement('div'); wDiv.className = 'set-weight'; btn.appendChild(wDiv); }
      wDiv.textContent = `${val} lbs`;
    } else {
      if (wDiv) wDiv.remove();
    }
  }
}

function saveEffort(dayId, exId, level) {
  if (!state[dayId].effort) state[dayId].effort = {};
  const current = state[dayId].effort[exId];
  state[dayId].effort[exId] = current === level ? '' : level;
  saveState();
  document.querySelectorAll(`[id^="effort-${dayId}-${exId}-"]`).forEach(btn => {
    const btnLevel = btn.getAttribute('data-level');
    btn.className = 'effort-btn' + (btnLevel === state[dayId].effort[exId] ? ` active-${btnLevel}` : '');
  });
}

function refreshCurrentDay(dayId) {
  updateOverallProgress();
  switchDay(dayId);
}

function toggleProtocol(dayId, idx) {
  if (!state[dayId].protocol) state[dayId].protocol = Array(PROTOCOL_ITEMS.length).fill(false);
  state[dayId].protocol[idx] = !state[dayId].protocol[idx];
  saveState();
  switchDay(dayId);
}

function skipSet(dayId, exId, setIdx) {
  const current = state[dayId].sets[exId][setIdx];
  if (current === 'skipped') {
    state[dayId].sets[exId][setIdx] = false;
  } else if (current === false) {
    state[dayId].sets[exId][setIdx] = 'skipped';
  }
  saveState();
  refreshCurrentDay(dayId);
}

function skipExercise(dayId, exId) {
  const sets = state[dayId].sets[exId];
  const allSkipped = sets.every(v => v === 'skipped');
  if (allSkipped) {
    for (let i = 0; i < sets.length; i++) sets[i] = false;
  } else {
    for (let i = 0; i < sets.length; i++) {
      if (sets[i] !== true) sets[i] = 'skipped';
    }
  }
  saveState();
  refreshCurrentDay(dayId);
}

function activeExIds(dayId) {
  const day = DAYS.find(d => d.id === dayId);
  if (!day) return [];
  return day.exercises.map(ex => resolveExercise(dayId, ex).id);
}

function skipDay(dayId) {
  const d = state[dayId];
  const ids = activeExIds(dayId);
  const allResolved = ids.every(id => d.sets[id] && d.sets[id].every(v => isResolved(v)));
  const hasSkipped = ids.some(id => d.sets[id] && d.sets[id].some(v => v === 'skipped'));
  ids.forEach(id => {
    const arr = d.sets[id];
    if (!arr) return;
    for (let i = 0; i < arr.length; i++) {
      if (allResolved && hasSkipped) {
        if (arr[i] === 'skipped') arr[i] = false;
      } else {
        if (arr[i] === false) arr[i] = 'skipped';
      }
    }
  });
  saveState();
  refreshCurrentDay(dayId);
}

function completeDay(dayId) {
  const ids = activeExIds(dayId);
  ids.forEach(id => {
    const arr = state[dayId].sets[id];
    if (!arr) return;
    for (let i = 0; i < arr.length; i++) {
      if (arr[i] !== true) arr[i] = true;
    }
  });
  saveState();
  refreshCurrentDay(dayId);
}

// CONFIRMATION MODAL
let confirmAction = null;

function showConfirm(title, msg, onConfirm) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  confirmAction = onConfirm;
  document.getElementById('confirmOk').onclick = () => { const fn = confirmAction; closeConfirm(); if (fn) fn(); };
  document.getElementById('confirmOverlay').classList.add('visible');
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('visible');
  confirmAction = null;
}

// EXERCISE SWAP
function showSwapPicker(dayId, originalExId) {
  const alts = EXERCISE_ALTERNATIVES[originalExId];
  if (!alts) return;
  const day = DAYS.find(d => d.id === dayId);
  const originalEx = day.exercises.find(e => e.id === originalExId);
  const currentSwap = (state[dayId].swaps || {})[originalExId];

  document.getElementById('swapCurrent').textContent = `Current: ${resolveExercise(dayId, originalEx).name}`;

  let listHtml = '';
  if (currentSwap) {
    listHtml += `<div class="swap-option swap-option-revert" onclick="performSwap('${dayId}', '${originalExId}', '${originalExId}')">
      <div class="swap-option-name">↩ ${originalEx.name}</div>
      <div class="swap-option-meta">${originalEx.sets} sets · ${originalEx.reps} reps · RPE ${originalEx.rpe}</div>
      <div class="swap-option-note">Revert to original exercise</div>
    </div>`;
  }
  alts.forEach(alt => {
    const isActive = currentSwap === alt.id;
    listHtml += `<div class="swap-option${isActive ? ' active' : ''}" onclick="performSwap('${dayId}', '${originalExId}', '${alt.id}')">
      <div class="swap-option-name">${alt.name}</div>
      <div class="swap-option-meta">${alt.sets} sets · ${alt.reps} reps · RPE ${alt.rpe} · ⏱ ${alt.restLabel}</div>
      <div class="swap-option-note">${alt.note}</div>
    </div>`;
  });
  document.getElementById('swapList').innerHTML = listHtml;
  document.getElementById('swapOverlay').classList.add('visible');
}

function performSwap(dayId, originalExId, newExId) {
  if (!state[dayId].swaps) state[dayId].swaps = {};
  if (newExId === originalExId) {
    delete state[dayId].swaps[originalExId];
  } else {
    state[dayId].swaps[originalExId] = newExId;
  }
  const day = DAYS.find(d => d.id === dayId);
  const originalEx = day.exercises.find(e => e.id === originalExId);
  const ex = resolveExercise(dayId, originalEx);
  if (!state[dayId].sets[ex.id]) {
    state[dayId].sets[ex.id] = Array(ex.sets).fill(false);
  }
  saveState();
  closeSwapPicker();
  switchDay(dayId);
  updateOverallProgress();
}

function closeSwapPicker() {
  document.getElementById('swapOverlay').classList.remove('visible');
}

// NOTIFICATIONS
function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    try { audioCtx = new Ctor(); }
    catch(err) { console.warn('AudioContext creation failed', err); return null; }
  }
  return audioCtx;
}

function primeAudio() {
  const ctx = getAudioCtx();
  if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
}

function playTimerSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const schedule = () => {
    const t0 = ctx.currentTime;
    [0, 0.15, 0.3].forEach(delay => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, t0 + delay);
      gain.gain.exponentialRampToValueAtTime(0.01, t0 + delay + 0.12);
      osc.start(t0 + delay);
      osc.stop(t0 + delay + 0.12);
    });
  };
  if (ctx.state === 'suspended') {
    ctx.resume().then(schedule).catch(err => console.warn('audio resume failed', err));
  } else {
    schedule();
  }
}

function notifyTimerDone() {
  playTimerSound();
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('Rest Over', { body: 'Time for your next set!', icon: '🏋️', tag: 'gains-timer' });
  }
}

// TIMER — timestamp-based so it survives backgrounding
let timerInterval = null;
let audioKeepAlive = null;
let timerEndTime = null;   // absolute epoch ms when timer expires
let timerTotal = 90;
let currentRestTime = 90;
let pendingCallback = null;
let timerMinimized = false;

const CIRCUMFERENCE = 565; // 2 * π * 90

function startAudioKeepAlive() {
  if (audioKeepAlive) clearInterval(audioKeepAlive);
  audioKeepAlive = setInterval(() => {
    const ctx = getAudioCtx();
    if (!ctx || ctx.state !== 'running') return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    g.gain.value = 0;
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.001);
  }, 5000);
}

function stopAudioKeepAlive() {
  if (audioKeepAlive) { clearInterval(audioKeepAlive); audioKeepAlive = null; }
}

function startTimer(seconds, onComplete) {
  primeAudio();
  startAudioKeepAlive();
  clearInterval(timerInterval);
  timerTotal = seconds;
  timerEndTime = Date.now() + seconds * 1000;
  pendingCallback = onComplete;

  timerMinimized = false;
  updateTimerDisplay();
  document.getElementById('timerPill').classList.remove('visible');
  document.getElementById('timerOverlay').classList.add('visible');
  updatePresetButtons(seconds);

  timerInterval = setInterval(timerTick, 250); // poll 4×/sec for accuracy
}

function timerTick() {
  const remaining = Math.max(0, Math.ceil((timerEndTime - Date.now()) / 1000));
  updateTimerDisplayValue(remaining);
  if (remaining <= 0) {
    clearInterval(timerInterval);
    timerInterval = null;
    notifyTimerDone();
    closeTimer();
    if (pendingCallback) pendingCallback();
  }
}

// When user returns to tab/app, immediately resync
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && timerEndTime !== null) {
    const remaining = Math.max(0, Math.ceil((timerEndTime - Date.now()) / 1000));
    updateTimerDisplayValue(remaining);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      timerEndTime = null;
      notifyTimerDone();
      closeTimer();
      if (pendingCallback) pendingCallback();
    }
  }
});

function updateTimerDisplay() {
  const remaining = timerEndTime
    ? Math.max(0, Math.ceil((timerEndTime - Date.now()) / 1000))
    : timerTotal;
  updateTimerDisplayValue(remaining);
}

function updateTimerDisplayValue(remaining) {
  const mins = Math.floor(remaining / 60);
  const secs = remaining % 60;
  const display = `${mins}:${String(secs).padStart(2, '0')}`;
  const urgent = remaining <= 10;
  const progress = remaining / timerTotal;

  // Full overlay
  const timeEl = document.getElementById('timerDisplay');
  const ringEl = document.getElementById('timerRingFill');
  timeEl.textContent = display;
  timeEl.classList.toggle('urgent', urgent);
  ringEl.classList.toggle('urgent', urgent);
  ringEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);

  // Minimized pill
  const pillTime = document.getElementById('pillTimerDisplay');
  const pillRing = document.getElementById('pillRingFill');
  pillTime.textContent = display;
  pillTime.classList.toggle('urgent', urgent);
  pillRing.classList.toggle('urgent', urgent);
  const pillCirc = 2 * Math.PI * 12; // r=12
  pillRing.style.strokeDashoffset = pillCirc * (1 - progress);
}

function skipTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerEndTime = null;
  timerMinimized = false;
  closeTimer();
  if (pendingCallback) pendingCallback();
}

function closeTimer() {
  timerEndTime = null;
  timerMinimized = false;
  stopAudioKeepAlive();
  document.getElementById('timerOverlay').classList.remove('visible');
  document.getElementById('timerPill').classList.remove('visible');
}

function minimizeTimer() {
  timerMinimized = true;
  document.getElementById('timerOverlay').classList.remove('visible');
  document.getElementById('timerPill').classList.add('visible');
}

function expandTimer() {
  timerMinimized = false;
  document.getElementById('timerPill').classList.remove('visible');
  document.getElementById('timerOverlay').classList.add('visible');
}

function addTime(s) {
  if (timerEndTime) {
    timerEndTime += s * 1000;
    const remaining = Math.ceil((timerEndTime - Date.now()) / 1000);
    if (remaining < 5) timerEndTime = Date.now() + 5000; // floor at 5s
    timerTotal = Math.max(timerTotal, Math.ceil((timerEndTime - Date.now()) / 1000));
    updateTimerDisplay();
  }
}

function setRestTime(s) {
  currentRestTime = s;
  updatePresetButtons(s);
  if (document.getElementById('timerOverlay').classList.contains('visible')) {
    clearInterval(timerInterval);
    timerTotal = s;
    timerEndTime = Date.now() + s * 1000;
    updateTimerDisplay();
    timerInterval = setInterval(timerTick, 250);
  }
}

function updatePresetButtons(active) {
  document.querySelectorAll('.rest-preset-btn').forEach(btn => {
    const parts = btn.textContent.split(':');
    const val = parseInt(parts[0]) * 60 + parseInt(parts[1]);
    btn.classList.toggle('active', val === active);
  });
}

// Suppress iOS shake-to-undo: blur inputs on outside tap so iOS has no undo target
document.addEventListener('touchstart', (e) => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT' && !e.target.closest('input')) {
    document.activeElement.blur();
  }
}, { passive: true });
document.addEventListener('beforeinput', (e) => {
  if (e.inputType === 'historyUndo') e.preventDefault();
});

// TOOLTIP — fixed position, escapes all overflow:hidden parents
const tooltipEl = document.getElementById('tooltip');
let tooltipTimeout = null;

function showTooltip(e) {
  const target = e.currentTarget;
  const text = target.getAttribute('data-tip');
  if (!text) return;
  tooltipEl.textContent = text;
  positionTooltip(e.clientX, e.clientY);
  tooltipEl.classList.add('visible');
}

function positionTooltip(cx, cy) {
  const W = 240, pad = 10;
  let left = cx - W / 2;
  let top = cy - tooltipEl.offsetHeight - 12;
  if (left < pad) left = pad;
  if (left + W > window.innerWidth - pad) left = window.innerWidth - W - pad;
  if (top < pad) top = cy + 20; // flip below if no room above
  tooltipEl.style.left = left + 'px';
  tooltipEl.style.top = top + 'px';
}

function moveTooltip(e) { positionTooltip(e.clientX, e.clientY); }
function hideTooltip() { tooltipEl.classList.remove('visible'); }

// Delegate to all .tip elements via event delegation
document.addEventListener('mouseover', e => {
  const tip = e.target.closest('.tip');
  if (tip) { tip.addEventListener('mousemove', moveTooltip); showTooltip({ currentTarget: tip, clientX: e.clientX, clientY: e.clientY }); }
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.tip')) hideTooltip();
});

// Touch support
document.addEventListener('touchstart', e => {
  const tip = e.target.closest('.tip');
  if (tip) {
    const t = e.touches[0];
    tooltipEl.textContent = tip.getAttribute('data-tip') || '';
    positionTooltip(t.clientX, t.clientY);
    tooltipEl.classList.add('visible');
    clearTimeout(tooltipTimeout);
    tooltipTimeout = setTimeout(hideTooltip, 5000);
  }
}, { passive: true });

// Prime AudioContext on first user gesture so later timer beeps are reliable
document.addEventListener('touchstart', primeAudio, { once: true, passive: true });
document.addEventListener('click', primeAudio, { once: true });

// EXPORT / IMPORT
function exportData() {
  const savedProgIdx = currentProgramIdx;
  const allPrograms = {};
  PROGRAMS.forEach((prog, pi) => {
    const weeks = {};
    for (let w = 1; w <= prog.totalWeeks; w++) {
      try {
        const key = `${STORAGE_KEY}_${prog.id}_w${w}`;
        const d = JSON.parse(localStorage.getItem(key) || '{}');
        if (Object.keys(d).length) weeks[w] = d;
      } catch(e) {}
    }
    const weekNum = parseInt(localStorage.getItem(`hypertrophy_week_${prog.id}`) || '1');
    allPrograms[prog.id] = { weeks, currentWeek: weekNum };
  });
  const data = { programs: allPrograms, currentProgram: savedProgIdx, version: 3 };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `gains-backup-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);

      if (data.version === 3 && data.programs) {
        for (const [progId, progData] of Object.entries(data.programs)) {
          for (const [w, wState] of Object.entries(progData.weeks)) {
            localStorage.setItem(`${STORAGE_KEY}_${progId}_w${w}`, JSON.stringify(wState));
          }
          localStorage.setItem(`hypertrophy_week_${progId}`, progData.currentWeek);
        }
        if (typeof data.currentProgram === 'number') {
          currentProgramIdx = data.currentProgram;
          saveProgram();
        }
      } else if (data.version === 2 && data.weeks) {
        if (!data.currentWeek) { alert('Invalid backup file.'); return; }
        for (const [w, wState] of Object.entries(data.weeks)) {
          localStorage.setItem(`${STORAGE_KEY}_meso1_w${w}`, JSON.stringify(wState));
        }
        localStorage.setItem('hypertrophy_week_meso1', data.currentWeek);
      } else if (data.state && data.currentWeek) {
        localStorage.setItem(`${STORAGE_KEY}_meso1_w${data.currentWeek}`, JSON.stringify(data.state));
        localStorage.setItem('hypertrophy_week_meso1', data.currentWeek);
      } else {
        alert('Invalid backup file.'); return;
      }

      switchProgram(currentProgramIdx);
    } catch (err) {
      alert('Could not read backup file.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function isWeekComplete() {
  return DAYS.every(day => isDayComplete(day.id));
}

function getStartDay() {
  for (const day of DAYS) {
    const ids = day.exercises.map(e => resolveExercise(day.id, e).id);
    const some = ids.some(id => state[day.id].sets[id] && state[day.id].sets[id].some(isResolved));
    const all  = ids.every(id => state[day.id].sets[id] && state[day.id].sets[id].every(isResolved));
    if (some && !all) return day.id;
  }
  for (const day of DAYS) if (!isDayComplete(day.id)) return day.id;
  return DAYS[0].id;
}

function advanceToCurrentWeek() {
  // If current week is fully complete, advance to next incomplete week
  const maxWeeks = PROGRAMS[currentProgramIdx].totalWeeks;
  while (currentWeek < maxWeeks && isWeekComplete()) {
    currentWeek++;
    saveWeek();
    initState();
  }
}

// Generate apple-touch-icon via canvas (iOS requires PNG)
(function() {
  const s = 180, r = 40;
  const c = document.createElement('canvas');
  c.width = s; c.height = s;
  const ctx = c.getContext('2d');
  // Rounded rect background
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(s-r, 0); ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s-r); ctx.quadraticCurveTo(s, s, s-r, s);
  ctx.lineTo(r, s); ctx.quadraticCurveTo(0, s, 0, s-r);
  ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#0a0a0a'; ctx.fill();
  // Weight plates
  ctx.fillStyle = '#e8ff47';
  ctx.beginPath(); ctx.roundRect(16, 52, 28, 76, 8); ctx.fill();
  ctx.beginPath(); ctx.roundRect(136, 52, 28, 76, 8); ctx.fill();
  // Bar with gradient
  const grad = ctx.createLinearGradient(30, 0, 150, 0);
  grad.addColorStop(0, '#e8ff47'); grad.addColorStop(0.5, '#4eff91'); grad.addColorStop(1, '#e8ff47');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.roundRect(30, 80, 120, 20, 10); ctx.fill();
  // Center node cutout
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath(); ctx.arc(90, 90, 14, 0, Math.PI*2); ctx.fill();
  // AI nodes
  ctx.fillStyle = '#4eff91';
  ctx.beginPath(); ctx.arc(90, 90, 7, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.arc(65, 90, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(115, 90, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  // Connections
  ctx.strokeStyle = '#4eff91'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(65,90); ctx.lineTo(83,90); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(97,90); ctx.lineTo(115,90); ctx.stroke();
  ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.moveTo(90,76); ctx.lineTo(90,52); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(90,104); ctx.lineTo(90,128); ctx.stroke();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#4eff91';
  ctx.beginPath(); ctx.arc(90, 49, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(90, 131, 4, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  // Set as apple-touch-icon
  const link = document.createElement('link');
  link.rel = 'apple-touch-icon';
  link.href = c.toDataURL('image/png');
  document.head.appendChild(link);
})();

const view = { name: 'day', dayId: null, openPhase: 2, tip: null, confirm: null, swap: null,
               importMsg: '', importOk: true, sessionStart: Date.now(), now: Date.now(),
               pendW: 0, pendKey: '', latestPr: null,
               restEnd: null, restTotal: 0, restInfo: '', restNext: '', restRec: '', restMinimized: false };

function renderMasthead()  { document.getElementById('masthead').innerHTML = ''; }
function renderScroll()    { document.getElementById('scroll').innerHTML = ''; }
function renderBottomBar() { document.getElementById('bottombar').innerHTML = ''; }
function renderOverlays()  { document.getElementById('overlays').innerHTML = ''; }

function render() {
  renderMasthead();
  renderScroll();
  renderBottomBar();
  renderOverlays();
}

function boot() {
  migrateOldState();
  migrateToMultiProgram();
  loadProgram();
  loadWeek();
  initState();
  view.dayId = getStartDay();
  render();
  setInterval(() => {
    view.now = Date.now();
    if (view.restEnd && view.restEnd <= view.now) { view.restEnd = null; view.restMinimized = false; }
    render();
  }, 500);
  document.addEventListener('visibilitychange', () => { view.now = Date.now(); render(); });
}

boot();
