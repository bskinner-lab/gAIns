const THEME_KEY = 'gains_theme';

function storedTheme() {
  try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
}

function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

function setTheme(t) {
  try {
    if (t) localStorage.setItem(THEME_KEY, t);
    else localStorage.removeItem(THEME_KEY);
  } catch (e) {}
  applyTheme(t);
  render();
}

function effectiveTheme() {
  const s = storedTheme();
  if (s) return s;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

applyTheme(storedTheme());

// GLOSSARY for hover tooltips
const GLOSSARY = {
  'LLP': 'Length-Limited Partials: bottom-half reps in the fully stretched position (last set only). For isolation exercises only — never on compounds. Maximizes tension where the muscle is longest — high stimulus, low joint stress.',
  'RPE': 'Rate of Perceived Exertion (1–10). RPE 7 = 3 reps left. RPE 8 = 2 left. RPE 9 = 1 left. Exercise RPE is the allowed range; weekly RPE determines how deep into that range to push. Early weeks stay near the lower end, later weeks push toward the upper end.',
  'RIR': 'Reps In Reserve — how many more reps you could have done before failure. RIR 2 = stopped with 2 reps left.',
  'drop set': 'Complete your working set, immediately reduce weight 20–30%, then continue for more reps without rest.',
  'compounds': 'Multi-joint movements (squat, deadlift, bench press, rows) that recruit many muscle groups simultaneously. Higher injury risk at failure — always keep 1–2 RIR.',
  'MRV': 'Maximum Recoverable Volume — the most training volume you can handle while still recovering between sessions. Exceeding MRV leads to excessive fatigue.',
  'eccentric': 'The lowering/lengthening phase of a lift (e.g. lowering the bar on a bench press). Controlling this phase 3–4 seconds increases muscle damage and growth stimulus.',
  'rest-pause': 'Take a set to near-failure, rest 10–15 seconds, then squeeze out additional reps. An intensity technique for isolations only.',
  'mesocycle': 'A structured training block, typically 4–8 weeks, with a clear progression strategy and a deload at the end.',
  'double progression': 'Hit the top of your rep range → increase weight next session. Miss the top → repeat same weight. Simple, effective loading strategy.',

let DAYS = PROGRAMS[0].days;
let MESOCYCLE = PROGRAMS[0].mesocycle;
let WEEK_PHASES = PROGRAMS[0].weekPhases;
let PROTOCOL_ITEMS = PROGRAMS[0].protocolItems;

// PROGRAM TRACKING
let currentProgramIdx = 0;

function currentProgramId() {
  return PROGRAMS[currentProgramIdx].id;
}

function weekStorageKey(week) {
  return `${STORAGE_KEY}_${currentProgramId()}_w${week}`;
}

function weekKey() {
  return `hypertrophy_week_${currentProgramId()}`;
}

// WEEK TRACKING
let currentWeek = 1;

function loadWeek() {
  try { currentWeek = parseInt(localStorage.getItem(weekKey()) || '1'); } catch(e) {}
  const maxWeeks = PROGRAMS[currentProgramIdx].totalWeeks;
  if (isNaN(currentWeek) || currentWeek < 1) currentWeek = 1;
  if (currentWeek > maxWeeks) currentWeek = maxWeeks;
}

function saveWeek() {
  try { localStorage.setItem(weekKey(), currentWeek); } catch(e) {}
}

function loadProgram() {
  try {
    const saved = parseInt(localStorage.getItem('hypertrophy_program') || '0');
    if (!isNaN(saved) && saved >= 0 && saved < PROGRAMS.length) currentProgramIdx = saved;
  } catch(e) {}
}

function saveProgram() {
  try { localStorage.setItem('hypertrophy_program', currentProgramIdx); } catch(e) {}
}

function changeWeek(delta) {
  const maxWeeks = PROGRAMS[currentProgramIdx].totalWeeks;
  currentWeek = Math.min(maxWeeks, Math.max(1, currentWeek + delta));
  saveWeek();
  initState();
  updateWeekDisplay();
  updateOverallProgress();
  if (currentDayId !== 'info') switchDay(currentDayId);
}

// Compatibility shims — the preserved logic layer calls these; they now just re-render.
function updateWeekDisplay()    {}
function updateProgramSelector(){}

function rebuildLegacyIdMap() {
  Object.keys(LEGACY_ID_MAP).forEach(k => delete LEGACY_ID_MAP[k]);
  DAYS.forEach(day => {
    LEGACY_ID_MAP[day.id] = {};
    day.exercises.forEach((ex, i) => { LEGACY_ID_MAP[day.id][i] = ex.id; });
  });
}

function resolveExercise(dayId, ex) {
  const swaps = (state[dayId] && state[dayId].swaps) || {};
  const altId = swaps[ex.id];
  if (!altId) return ex;
  const alts = EXERCISE_ALTERNATIVES[ex.id];
  if (!alts) return ex;
  return alts.find(a => a.id === altId) || ex;
}

let programInitialized = false;
function switchProgram(idx) {
  if (programInitialized && idx === currentProgramIdx) return;
  programInitialized = true;
  const prog = PROGRAMS[idx];
  currentProgramIdx = idx;
  DAYS = prog.days;
  MESOCYCLE = prog.mesocycle;
  WEEK_PHASES = prog.weekPhases;
  PROTOCOL_ITEMS = prog.protocolItems;
  rebuildLegacyIdMap();
  saveProgram();
  loadWeek();
  initState();
  advanceToCurrentWeek();
  updateWeekDisplay();
  updateProgramSelector();
  switchDay(getStartDay());
  updateOverallProgress();
}

// STATE — sets[exId][si] = false | true | 'skipped', weights[exId] = number|null
let state = {};

const LEGACY_ID_MAP = {};
rebuildLegacyIdMap();

function migrateDayState(dayId, sd) {
  if (!sd || !sd.sets) return sd;
  const hasStringKeys = Object.keys(sd.sets).some(k => isNaN(k));
  if (hasStringKeys) return sd;
  const map = LEGACY_ID_MAP[dayId];
  const m = { sets: {}, weights: {}, effort: {}, protocol: sd.protocol || [], swaps: sd.swaps || {} };
  Object.keys(sd.sets).forEach(k => {
    const exId = map[k];
    if (exId) m.sets[exId] = sd.sets[k];
  });
  if (sd.weights) {
    Object.keys(sd.weights).forEach(k => {
      if (k.includes('_')) {
        const [ei, si] = k.split('_');
        const exId = map[ei];
        if (exId) m.weights[`${exId}_${si}`] = sd.weights[k];
      } else {
        const exId = map[k];
        if (exId) m.weights[exId] = sd.weights[k];
      }
    });
  }
  if (sd.effort) {
    Object.keys(sd.effort).forEach(k => {
      const exId = map[k];
      if (exId) m.effort[exId] = sd.effort[k];
    });
  }
  return m;
}

function initState() {
  const raw = loadState();
  const saved = {};
  DAYS.forEach(day => { saved[day.id] = migrateDayState(day.id, raw[day.id]); });
  DAYS.forEach(day => {
    const savedDay = saved[day.id] || {};
    state[day.id] = {
      sets: {},
      weights: savedDay.weights || {},
      effort: savedDay.effort || {},
      protocol: savedDay.protocol || [],
      swaps: savedDay.swaps || {}
    };
    day.exercises.forEach(originalEx => {
      const ex = resolveExercise(day.id, originalEx);
      state[day.id].sets[ex.id] = savedDay.sets ? (savedDay.sets[ex.id] || Array(ex.sets).fill(false)) : Array(ex.sets).fill(false);
      while (state[day.id].sets[ex.id].length < ex.sets) state[day.id].sets[ex.id].push(false);
    });
  });
  saveState();
  prefillFromPreviousWeeks();
}

function prefillFromPreviousWeeks() {
  if (currentWeek <= 1) return;
  DAYS.forEach(day => {
    const weights = state[day.id].weights;
    const effort = state[day.id].effort;
    day.exercises.forEach(originalEx => {
      const ex = resolveExercise(day.id, originalEx);
      for (let w = currentWeek - 1; w >= 1; w--) {
        try {
          const raw = JSON.parse(localStorage.getItem(weekStorageKey(w)) || '{}');
          const prev = migrateDayState(day.id, raw[day.id]);
          if (!prev) continue;
          if (!weights[ex.id] && prev.weights && prev.weights[ex.id]) {
            weights[ex.id] = prev.weights[ex.id];
          }
          if (!effort[ex.id] && prev.effort && prev.effort[ex.id]) {
            effort[ex.id] = prev.effort[ex.id];
          }
          if (weights[ex.id] && effort[ex.id]) return;
        } catch(e) {}
      }
    });
  });
}

// Cross-week history for a single exercise (current program). Ascending by week.
// Reads each week's localStorage blob via migrateDayState; prefers in-memory
// `state` for the current week so unsaved edits are reflected.
function getExerciseHistory(dayId, exId) {
  const maxWeeks = PROGRAMS[currentProgramIdx].totalWeeks;
  const out = [];
  for (let w = 1; w <= maxWeeks; w++) {
    let dayState;
    if (w === currentWeek && state[dayId]) {
      dayState = state[dayId];
    } else {
      try {
        const raw = JSON.parse(localStorage.getItem(weekStorageKey(w)) || '{}');
        dayState = migrateDayState(dayId, raw[dayId]);
      } catch (e) { dayState = null; }
    }
    if (!dayState) continue;
    const rawW = (dayState.weights || {})[exId];
    const weight = (rawW === '' || rawW == null) ? null : Number(rawW);
    const eff = (dayState.effort || {})[exId] || '';
    if (weight == null && !eff) continue;
    out.push({ week: w, weight, effort: eff });
  }
  return out;
}

// Most recent logged entry strictly before the current week, or null.
function priorWeekEntry(dayId, exId) {
  const hist = getExerciseHistory(dayId, exId);
  for (let i = hist.length - 1; i >= 0; i--) {
    if (hist[i].week < currentWeek) return hist[i];
  }
  return null;
}

function saveState() {
  try { localStorage.setItem(weekStorageKey(currentWeek), JSON.stringify(state)); } catch(e) {}
}

function loadState() {
  try { return JSON.parse(localStorage.getItem(weekStorageKey(currentWeek)) || '{}'); } catch(e) { return {}; }
}

// Migrate old non-week-aware state to week 1
function migrateOldState() {
  try {
    const old = localStorage.getItem(STORAGE_KEY);
    if (!old) return;
    const parsed = JSON.parse(old);
    const dayIds = DAYS.map(d => d.id);
    if (!dayIds.some(id => parsed[id])) return;
    if (!localStorage.getItem(weekStorageKey(1))) {
      localStorage.setItem(weekStorageKey(1), old);
    }
    localStorage.removeItem(STORAGE_KEY);
  } catch(e) {}
}

function migrateToMultiProgram() {
  if (localStorage.getItem('hypertrophy_migrated_v3')) return;
  for (let w = 1; w <= 8; w++) {
    const oldKey = `${STORAGE_KEY}_w${w}`;
    const newKey = `${STORAGE_KEY}_meso1_w${w}`;
    const data = localStorage.getItem(oldKey);
    if (data && !localStorage.getItem(newKey)) {
      localStorage.setItem(newKey, data);
      localStorage.removeItem(oldKey);
    }
  }
  const oldWeek = localStorage.getItem('hypertrophy_week');
  if (oldWeek && !localStorage.getItem('hypertrophy_week_meso1')) {
    localStorage.setItem('hypertrophy_week_meso1', oldWeek);
    localStorage.removeItem('hypertrophy_week');
  }
  localStorage.setItem('hypertrophy_migrated_v3', '1');
}

function isResolved(v) { return v === true || v === 'skipped'; }

function totalSets() {
  let total = 0;
  DAYS.forEach(d => d.exercises.forEach(originalEx => {
    const ex = resolveExercise(d.id, originalEx);
    total += ex.sets;
  }));
  return total;
}

function completedSets() {
  let done = 0;
  DAYS.forEach(day => {
    day.exercises.forEach(originalEx => {
      const ex = resolveExercise(day.id, originalEx);
      const arr = state[day.id].sets[ex.id];
      if (arr) arr.forEach(v => { if (v === true) done++; });
    });
  });
  return done;
}

function skippedSetsCount() {
  let count = 0;
  DAYS.forEach(day => {
    day.exercises.forEach(originalEx => {
      const ex = resolveExercise(day.id, originalEx);
      const arr = state[day.id].sets[ex.id];
      if (arr) arr.forEach(v => { if (v === 'skipped') count++; });
    });
  });
  return count;
}

function isDayComplete(dayId) {
  const day = DAYS.find(d => d.id === dayId);
  if (!day) return false;
  return day.exercises.every(originalEx => {
    const ex = resolveExercise(dayId, originalEx);
    const arr = state[dayId].sets[ex.id];
    return arr && arr.every(v => isResolved(v));
  });
}

// Compatibility shim — the preserved logic layer calls this; it now just re-renders.
function updateOverallProgress(){ render(); }

// Compatibility shim — the preserved logic layer calls this; it now just re-renders.
function switchDay(dayId) { if (dayId) view.dayId = dayId; render(); }

let currentDayId = DAYS[0].id;

function toggleSet(dayId, exId, setIdx) {
  const wasDone = state[dayId].sets[exId][setIdx] === true;

  if (wasDone) {
    state[dayId].sets[exId][setIdx] = false;
    saveState();
    refreshCurrentDay(dayId);
    return;
  }

  requestNotificationPermission();

  const weightInput = document.getElementById(`weight-${dayId}-${exId}`);
  const wVal = weightInput ? weightInput.value.trim() : '';
  if (wVal) {
    if (!state[dayId].weights) state[dayId].weights = {};
    state[dayId].weights[`${exId}_${setIdx}`] = wVal;
    state[dayId].weights[exId] = wVal;
  }

  state[dayId].sets[exId][setIdx] = true;
  saveState();
  refreshCurrentDay(dayId);

  if (isDayComplete(dayId)) {
    return;
  }

  const day = DAYS.find(d => d.id === dayId);
  const exIdx = day.exercises.findIndex(e => resolveExercise(dayId, e).id === exId);
  const ex = resolveExercise(dayId, day.exercises[exIdx]);
  const nextSetInEx = setIdx + 1 < ex.sets ? setIdx + 1 : null;
  const nextOriginalEx = nextSetInEx === null ? day.exercises[exIdx + 1] : null;
  const nextEx = nextOriginalEx ? resolveExercise(dayId, nextOriginalEx) : null;

  let nextLabel = '';
  if (nextSetInEx !== null) {
    nextLabel = `Next: <strong>${ex.name}</strong> — Set ${nextSetInEx + 1}`;
  } else if (nextEx) {
    nextLabel = `Next exercise: <strong>${nextEx.name}</strong>`;
  } else {
    nextLabel = `<strong>Last set of the day!</strong>`;
  }

  document.getElementById('timerSetInfo').textContent = `${ex.name} — Set ${setIdx + 1} Complete`;
  document.getElementById('timerNext').innerHTML = nextLabel;

  const exerciseRest = ex.rest || currentRestTime;
  const restInfo = document.getElementById('timerRestRec');
  if (restInfo && ex.restLabel) {
    restInfo.textContent = `Recommended: ${ex.restLabel}`;
    restInfo.style.display = '';
  } else if (restInfo) {
    restInfo.style.display = 'none';
  }
  startTimer(exerciseRest, () => { refreshCurrentDay(dayId); });
}

function saveWeight(dayId, exId) {
  const input = document.getElementById(`weight-${dayId}-${exId}`);
  if (!input) return;
  const val = input.value.trim();
  if (!state[dayId].weights) state[dayId].weights = {};
  state[dayId].weights[exId] = val;
  saveState();
  const day = DAYS.find(d => d.id === dayId);
  if (!day) return;
  const ex = day.exercises.find(e => e.id === exId);
  if (!ex) return;
  for (let si = 0; si < ex.sets; si++) {
    const btn = document.getElementById(`set-${dayId}-${exId}-${si}`);
    if (!btn) continue;
    let wDiv = btn.querySelector('.set-weight');
    if (val) {
      if (!wDiv) { wDiv = document.createElement('div'); wDiv.className = 'set-weight'; btn.appendChild(wDiv); }
      wDiv.textContent = `${val} lbs`;
    } else {
      if (wDiv) wDiv.remove();
    }
  }
}

function saveEffort(dayId, exId, level) {
  if (!state[dayId].effort) state[dayId].effort = {};
  const current = state[dayId].effort[exId];
  state[dayId].effort[exId] = current === level ? '' : level;
  saveState();
  document.querySelectorAll(`[id^="effort-${dayId}-${exId}-"]`).forEach(btn => {
    const btnLevel = btn.getAttribute('data-level');
    btn.className = 'effort-btn' + (btnLevel === state[dayId].effort[exId] ? ` active-${btnLevel}` : '');
  });
}

// Compatibility shim — the preserved logic layer calls this; it now just re-renders.
function refreshCurrentDay()    { render(); }

function toggleProtocol(dayId, idx) {
  if (!state[dayId].protocol) state[dayId].protocol = Array(PROTOCOL_ITEMS.length).fill(false);
  state[dayId].protocol[idx] = !state[dayId].protocol[idx];
  saveState();
  switchDay(dayId);
}

function skipSet(dayId, exId, setIdx) {
  const current = state[dayId].sets[exId][setIdx];
  if (current === 'skipped') {
    state[dayId].sets[exId][setIdx] = false;
  } else if (current === false) {
    state[dayId].sets[exId][setIdx] = 'skipped';
  }
  saveState();
  refreshCurrentDay(dayId);
}

function skipExercise(dayId, exId) {
  const sets = state[dayId].sets[exId];
  const allSkipped = sets.every(v => v === 'skipped');
  if (allSkipped) {
    for (let i = 0; i < sets.length; i++) sets[i] = false;
  } else {
    for (let i = 0; i < sets.length; i++) {
      if (sets[i] !== true) sets[i] = 'skipped';
    }
  }
  saveState();
  refreshCurrentDay(dayId);
}

function activeExIds(dayId) {
  const day = DAYS.find(d => d.id === dayId);
  if (!day) return [];
  return day.exercises.map(ex => resolveExercise(dayId, ex).id);
}

function skipDay(dayId) {
  const d = state[dayId];
  const ids = activeExIds(dayId);
  const allResolved = ids.every(id => d.sets[id] && d.sets[id].every(v => isResolved(v)));
  const hasSkipped = ids.some(id => d.sets[id] && d.sets[id].some(v => v === 'skipped'));
  ids.forEach(id => {
    const arr = d.sets[id];
    if (!arr) return;
    for (let i = 0; i < arr.length; i++) {
      if (allResolved && hasSkipped) {
        if (arr[i] === 'skipped') arr[i] = false;
      } else {
        if (arr[i] === false) arr[i] = 'skipped';
      }
    }
  });
  saveState();
  refreshCurrentDay(dayId);
}

function completeDay(dayId) {
  const ids = activeExIds(dayId);
  ids.forEach(id => {
    const arr = state[dayId].sets[id];
    if (!arr) return;
    for (let i = 0; i < arr.length; i++) {
      if (arr[i] !== true) arr[i] = true;
    }
  });
  saveState();
  refreshCurrentDay(dayId);
}

// EXERCISE SWAP
function performSwap(dayId, originalExId, newExId) {
  if (!state[dayId].swaps) state[dayId].swaps = {};
  if (newExId === originalExId) {
    delete state[dayId].swaps[originalExId];
  } else {
    state[dayId].swaps[originalExId] = newExId;
  }
  const day = DAYS.find(d => d.id === dayId);
  const originalEx = day.exercises.find(e => e.id === originalExId);
  const ex = resolveExercise(dayId, originalEx);
  if (!state[dayId].sets[ex.id]) {
    state[dayId].sets[ex.id] = Array(ex.sets).fill(false);
  }
  saveState();
  switchDay(dayId);
  updateOverallProgress();
}

// NOTIFICATIONS
function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    try { audioCtx = new Ctor(); }
    catch(err) { console.warn('AudioContext creation failed', err); return null; }
  }
  return audioCtx;
}

function primeAudio() {
  const ctx = getAudioCtx();
  if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
}

function playTimerSound() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const schedule = () => {
    const t0 = ctx.currentTime;
    [0, 0.15, 0.3].forEach(delay => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, t0 + delay);
      gain.gain.exponentialRampToValueAtTime(0.01, t0 + delay + 0.12);
      osc.start(t0 + delay);
      osc.stop(t0 + delay + 0.12);
    });
  };
  if (ctx.state === 'suspended') {
    ctx.resume().then(schedule).catch(err => console.warn('audio resume failed', err));
  } else {
    schedule();
  }
}

function notifyTimerDone() {
  playTimerSound();
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('Rest Over', { body: 'Time for your next set!', icon: '🏋️', tag: 'gains-timer' });
  }
}

// TIMER — timestamp-based so it survives backgrounding
let timerInterval = null;
let audioKeepAlive = null;
let timerEndTime = null;   // absolute epoch ms when timer expires
let timerTotal = 90;
let currentRestTime = 90;
let pendingCallback = null;
let timerMinimized = false;

const CIRCUMFERENCE = 565; // 2 * π * 90

function startAudioKeepAlive() {
  if (audioKeepAlive) clearInterval(audioKeepAlive);
  audioKeepAlive = setInterval(() => {
    const ctx = getAudioCtx();
    if (!ctx || ctx.state !== 'running') return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    g.gain.value = 0;
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.001);
  }, 5000);
}

function stopAudioKeepAlive() {
  if (audioKeepAlive) { clearInterval(audioKeepAlive); audioKeepAlive = null; }
}

function startTimer(seconds, onComplete) {
  primeAudio();
  startAudioKeepAlive();
  clearInterval(timerInterval);
  timerTotal = seconds;
  timerEndTime = Date.now() + seconds * 1000;
  pendingCallback = onComplete;

  timerMinimized = false;
  updateTimerDisplay();
  document.getElementById('timerPill').classList.remove('visible');
  document.getElementById('timerOverlay').classList.add('visible');
  updatePresetButtons(seconds);

  timerInterval = setInterval(timerTick, 250); // poll 4×/sec for accuracy
}

function timerTick() {
  const remaining = Math.max(0, Math.ceil((timerEndTime - Date.now()) / 1000));
  updateTimerDisplayValue(remaining);
  if (remaining <= 0) {
    clearInterval(timerInterval);
    timerInterval = null;
    notifyTimerDone();
    closeTimer();
    if (pendingCallback) pendingCallback();
  }
}

// When user returns to tab/app, immediately resync
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && timerEndTime !== null) {
    const remaining = Math.max(0, Math.ceil((timerEndTime - Date.now()) / 1000));
    updateTimerDisplayValue(remaining);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      timerEndTime = null;
      notifyTimerDone();
      closeTimer();
      if (pendingCallback) pendingCallback();
    }
  }
});

function updateTimerDisplay() {
  const remaining = timerEndTime
    ? Math.max(0, Math.ceil((timerEndTime - Date.now()) / 1000))
    : timerTotal;
  updateTimerDisplayValue(remaining);
}

function updateTimerDisplayValue(remaining) {
  const mins = Math.floor(remaining / 60);
  const secs = remaining % 60;
  const display = `${mins}:${String(secs).padStart(2, '0')}`;
  const urgent = remaining <= 10;
  const progress = remaining / timerTotal;

  // Full overlay
  const timeEl = document.getElementById('timerDisplay');
  const ringEl = document.getElementById('timerRingFill');
  timeEl.textContent = display;
  timeEl.classList.toggle('urgent', urgent);
  ringEl.classList.toggle('urgent', urgent);
  ringEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);

  // Minimized pill
  const pillTime = document.getElementById('pillTimerDisplay');
  const pillRing = document.getElementById('pillRingFill');
  pillTime.textContent = display;
  pillTime.classList.toggle('urgent', urgent);
  pillRing.classList.toggle('urgent', urgent);
  const pillCirc = 2 * Math.PI * 12; // r=12
  pillRing.style.strokeDashoffset = pillCirc * (1 - progress);
}

function closeTimer() {
  timerEndTime = null;
  timerMinimized = false;
  stopAudioKeepAlive();
}

function updatePresetButtons(active) {
  document.querySelectorAll('.rest-preset-btn').forEach(btn => {
    const parts = btn.textContent.split(':');
    const val = parseInt(parts[0]) * 60 + parseInt(parts[1]);
    btn.classList.toggle('active', val === active);
  });
}

// Suppress iOS shake-to-undo: blur inputs on outside tap so iOS has no undo target
document.addEventListener('touchstart', (e) => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT' && !e.target.closest('input')) {
    document.activeElement.blur();
  }
}, { passive: true });
document.addEventListener('beforeinput', (e) => {
  if (e.inputType === 'historyUndo') e.preventDefault();
});

// TOOLTIP — fixed position, escapes all overflow:hidden parents
const tooltipEl = document.getElementById('tooltip');
let tooltipTimeout = null;

function showTooltip(e) {
  const target = e.currentTarget;
  const text = target.getAttribute('data-tip');
  if (!text) return;
  tooltipEl.textContent = text;
  positionTooltip(e.clientX, e.clientY);
  tooltipEl.classList.add('visible');
}

function positionTooltip(cx, cy) {
  const W = 240, pad = 10;
  let left = cx - W / 2;
  let top = cy - tooltipEl.offsetHeight - 12;
  if (left < pad) left = pad;
  if (left + W > window.innerWidth - pad) left = window.innerWidth - W - pad;
  if (top < pad) top = cy + 20; // flip below if no room above
  tooltipEl.style.left = left + 'px';
  tooltipEl.style.top = top + 'px';
}

function moveTooltip(e) { positionTooltip(e.clientX, e.clientY); }
function hideTooltip() { tooltipEl.classList.remove('visible'); }

// Delegate to all .tip elements via event delegation
document.addEventListener('mouseover', e => {
  const tip = e.target.closest('.tip');
  if (tip) { tip.addEventListener('mousemove', moveTooltip); showTooltip({ currentTarget: tip, clientX: e.clientX, clientY: e.clientY }); }
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.tip')) hideTooltip();
});

// Touch support
document.addEventListener('touchstart', e => {
  const tip = e.target.closest('.tip');
  if (tip) {
    const t = e.touches[0];
    tooltipEl.textContent = tip.getAttribute('data-tip') || '';
    positionTooltip(t.clientX, t.clientY);
    tooltipEl.classList.add('visible');
    clearTimeout(tooltipTimeout);
    tooltipTimeout = setTimeout(hideTooltip, 5000);
  }
}, { passive: true });

// Prime AudioContext on first user gesture so later timer beeps are reliable
document.addEventListener('touchstart', primeAudio, { once: true, passive: true });
document.addEventListener('click', primeAudio, { once: true });

// EXPORT / IMPORT
function exportData() {
  const savedProgIdx = currentProgramIdx;
  const allPrograms = {};
  PROGRAMS.forEach((prog, pi) => {
    const weeks = {};
    for (let w = 1; w <= prog.totalWeeks; w++) {
      try {
        const key = `${STORAGE_KEY}_${prog.id}_w${w}`;
        const d = JSON.parse(localStorage.getItem(key) || '{}');
        if (Object.keys(d).length) weeks[w] = d;
      } catch(e) {}
    }
    const weekNum = parseInt(localStorage.getItem(`hypertrophy_week_${prog.id}`) || '1');
    allPrograms[prog.id] = { weeks, currentWeek: weekNum };
  });
  const data = { programs: allPrograms, currentProgram: savedProgIdx, version: 3 };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `gains-backup-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
  view.importMsg = 'Exported all programs & weeks.';
  view.importOk = true;
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);

      if (data.version === 3 && data.programs) {
        for (const [progId, progData] of Object.entries(data.programs)) {
          for (const [w, wState] of Object.entries(progData.weeks)) {
            localStorage.setItem(`${STORAGE_KEY}_${progId}_w${w}`, JSON.stringify(wState));
          }
          localStorage.setItem(`hypertrophy_week_${progId}`, progData.currentWeek);
        }
        if (typeof data.currentProgram === 'number') {
          currentProgramIdx = data.currentProgram;
          saveProgram();
        }
      } else if (data.version === 2 && data.weeks) {
        if (!data.currentWeek) { alert('Invalid backup file.'); return; }
        for (const [w, wState] of Object.entries(data.weeks)) {
          localStorage.setItem(`${STORAGE_KEY}_meso1_w${w}`, JSON.stringify(wState));
        }
        localStorage.setItem('hypertrophy_week_meso1', data.currentWeek);
      } else if (data.state && data.currentWeek) {
        localStorage.setItem(`${STORAGE_KEY}_meso1_w${data.currentWeek}`, JSON.stringify(data.state));
        localStorage.setItem('hypertrophy_week_meso1', data.currentWeek);
      } else {
        alert('Invalid backup file.'); return;
      }

      switchProgram(currentProgramIdx);
    } catch (err) {
      alert('Could not read backup file.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function isWeekComplete() {
  return DAYS.every(day => isDayComplete(day.id));
}

function getStartDay() {
  for (const day of DAYS) {
    const ids = day.exercises.map(e => resolveExercise(day.id, e).id);
    const some = ids.some(id => state[day.id].sets[id] && state[day.id].sets[id].some(isResolved));
    const all  = ids.every(id => state[day.id].sets[id] && state[day.id].sets[id].every(isResolved));
    if (some && !all) return day.id;
  }
  for (const day of DAYS) if (!isDayComplete(day.id)) return day.id;
  return DAYS[0].id;
}

function advanceToCurrentWeek() {
  // If current week is fully complete, advance to next incomplete week
  const maxWeeks = PROGRAMS[currentProgramIdx].totalWeeks;
  while (currentWeek < maxWeeks && isWeekComplete()) {
    currentWeek++;
    saveWeek();
    initState();
  }
}

// Generate apple-touch-icon via canvas (iOS requires PNG)
(function() {
  const s = 180, r = 40;
  const c = document.createElement('canvas');
  c.width = s; c.height = s;
  const ctx = c.getContext('2d');
  // Rounded rect background
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(s-r, 0); ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s-r); ctx.quadraticCurveTo(s, s, s-r, s);
  ctx.lineTo(r, s); ctx.quadraticCurveTo(0, s, 0, s-r);
  ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#191813'; ctx.fill();
  // Weight plates
  ctx.fillStyle = '#f2efe8';
  ctx.beginPath(); ctx.roundRect(16, 52, 28, 76, 8); ctx.fill();
  ctx.beginPath(); ctx.roundRect(136, 52, 28, 76, 8); ctx.fill();
  // Bar with gradient
  const grad = ctx.createLinearGradient(30, 0, 150, 0);
  grad.addColorStop(0, '#e34f1e'); grad.addColorStop(0.5, '#ff7a4d'); grad.addColorStop(1, '#e34f1e');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.roundRect(30, 80, 120, 20, 10); ctx.fill();
  // Center node cutout
  ctx.fillStyle = '#191813';
  ctx.beginPath(); ctx.arc(90, 90, 14, 0, Math.PI*2); ctx.fill();
  // AI nodes
  ctx.fillStyle = '#e34f1e';
  ctx.beginPath(); ctx.arc(90, 90, 7, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.arc(65, 90, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(115, 90, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  // Connections
  ctx.strokeStyle = '#e34f1e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(65,90); ctx.lineTo(83,90); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(97,90); ctx.lineTo(115,90); ctx.stroke();
  ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.moveTo(90,76); ctx.lineTo(90,52); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(90,104); ctx.lineTo(90,128); ctx.stroke();
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#e34f1e';
  ctx.beginPath(); ctx.arc(90, 49, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(90, 131, 4, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  // Set as apple-touch-icon
  const link = document.createElement('link');
  link.rel = 'apple-touch-icon';
  link.href = c.toDataURL('image/png');
  document.head.appendChild(link);
})();

function fmtClock(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function dayStats(dayId) {
  let done = 0, total = 0, skipped = 0;
  const day = DAYS.find(d => d.id === dayId);
  day.exercises.forEach(o => {
    const ex = resolveExercise(dayId, o);
    (state[dayId].sets[ex.id] || []).forEach(v => {
      total++;
      if (v === true) done++;
      else if (v === 'skipped') skipped++;
    });
  });
  return { done, total, skipped };
}

function weekPct() {
  let done = 0, total = 0;
  DAYS.forEach(d => d.exercises.forEach(o => {
    const ex = resolveExercise(d.id, o);
    (state[d.id].sets[ex.id] || []).forEach(v => { total++; if (v === true) done++; });
  }));
  return total ? Math.round(done / total * 100) : 0;
}

function workoutHeaderHTML(day) {
  const s = dayStats(day.id);
  const ids = day.exercises.map(e => resolveExercise(day.id, e).id);
  const hasPending = ids.some(id => (state[day.id].sets[id] || []).some(v => v === false));
  const hasSkipped = ids.some(id => (state[day.id].sets[id] || []).some(v => v === 'skipped'));
  const complete = isDayComplete(day.id);

  const stats = `<div class="stats">
    <div class="stat"><div class="stat-k">TIME</div><div class="stat-v">${fmtClock(view.now - view.sessionStart)}</div></div>
    <div class="stat"><div class="stat-k">SETS</div><div class="stat-v">${s.done}<small>/${s.total}</small></div></div>
    <div class="stat"><div class="stat-k">SKIPPED</div><div class="stat-v">${s.skipped}</div></div>
    <div class="stat"><div class="stat-k">WEEK</div><div class="stat-v" style="color:var(--accent)">${weekPct()}<small>%</small></div></div>
  </div>`;

  const pr = view.latestPr
    ? `<div class="pr"><b>${esc(view.latestPr.type)}</b><span>${esc(view.latestPr.text)}</span></div>` : '';

  let btns = '';
  if (hasPending) {
    btns = `<div class="daybtns">
      <button class="dbtn" data-act="skipday">SKIP DAY</button>
      <button class="dbtn strong" data-act="completeday">COMPLETE DAY</button></div>`;
  } else if (complete && hasSkipped) {
    btns = `<div class="daybtns"><button class="dbtn" data-act="skipday">UNSKIP DAY</button></div>`;
  }

  let proto = '';
  if (day.protocol) {
    const items = (curProg().protocolItems || []).map((t, i) => {
      const on = (state[day.id].protocol || [])[i];
      return `<div class="proto${on ? ' on' : ''}" data-act="proto" data-i="${i}">
        <div class="proto-box${on ? ' on' : ''}">${on ? '✓' : ''}</div><span>${esc(t)}</span></div>`;
    }).join('');
    proto = `<div class="panel"><div class="panel-h">SHOULDER PROTOCOL — BEFORE PRESSING</div>${items}</div>`;
  }

  return stats + pr + btns + proto;
}

function activeSet(day) {
  for (const o of day.exercises) {
    const ex = resolveExercise(day.id, o);
    const arr = state[day.id].sets[ex.id] || [];
    const i = arr.findIndex(v => v === false);
    if (i !== -1) return { ex, orig: o, i };
  }
  return null;
}

function undoSet(dayId, exId, i) {
  state[dayId].sets[exId][i] = false;
  saveState();
  view.pendKey = '';
}

function logActiveSet() {
  const day = curDay(), act = activeSet(day);
  if (!act) return;
  const { ex, i } = act, w = view.pendW;

  const hist = getExerciseHistory(day.id, ex.id).filter(h => h.week < currentWeek && h.weight != null);
  const maxPrior = hist.length ? Math.max(...hist.map(h => h.weight)) : 0;

  state[day.id].sets[ex.id][i] = true;
  state[day.id].weights[ex.id] = w;
  state[day.id].weights[`${ex.id}_${i}`] = w;
  saveState();

  view.latestPr = (maxPrior > 0 && w > maxPrior)
    ? { type: 'WEIGHT PR', text: `${ex.name} — ${w} lb beats your W${hist.find(h => h.weight === maxPrior).week} best of ${maxPrior} lb` }
    : null;
  view.pendKey = '';

  if (!isDayComplete(day.id)) {
    view.restEnd = Date.now() + ex.rest * 1000;
    view.restTotal = ex.rest;
    view.restMinimized = false;
    view.restInfo = `${ex.name} — SET ${i + 1} DONE`;
    view.restRec = ex.restLabel ? `RECOMMENDED ${ex.restLabel}` : '';
    const nxt = activeSet(day);
    view.restNext = nxt
      ? (nxt.ex.id === ex.id ? `Next: ${ex.name} — Set ${nxt.i + 1}` : `Next: ${nxt.ex.name}`)
      : 'Last set of the day!';
  }
}

function setRest(sec) { view.restTotal = sec; view.restEnd = Date.now() + sec * 1000; }

function addRest(delta) {
  if (!view.restEnd) return;
  let end = view.restEnd + delta * 1000;
  if (end - Date.now() < 5000) end = Date.now() + 5000;
  view.restTotal = Math.max(view.restTotal, Math.ceil((end - Date.now()) / 1000));
  view.restEnd = end;
}

const EFF_LABEL = { low: 'LOW', medium: 'MED', high: 'HIGH' };

function exercisesHTML(day) {
  const act = activeSet(day);
  return day.exercises.map((orig, xi) => {
    const ex = resolveExercise(day.id, orig);
    const swapped = ex.id !== orig.id;
    const arr = state[day.id].sets[ex.id] || [];
    const dh = arr.filter(v => v === true).length;
    const sk = arr.filter(v => v === 'skipped').length;
    const allDone = (dh + sk) === ex.sets;
    const prior = priorWeekEntry(day.id, ex.id);
    const curW = state[day.id].weights[ex.id];

    let tags = `<span class="tag">${ex.sets}×${esc(ex.reps)}</span>`
      + `<span class="tag ink" data-act="tip" data-t="RPE">RPE ${esc(ex.rpe)}</span>`;
    if (ex.restLabel) tags += `<span class="tag">⏱ ${esc(ex.restLabel)}</span>`;
    if (ex.llp) tags += `<span class="tag acc" data-act="tip" data-t="LLP">LLP</span>`;
    if (ex.compound) tags += `<span class="tag" data-act="tip" data-t="compounds" style="cursor:help">COMPOUND</span>`;

    const hist = getExerciseHistory(day.id, ex.id).filter(h => h.weight != null);
    let trend = `<div class="trend-empty">▂ LOG 2+ WEEKS TO SEE A TREND</div>`;
    if (hist.length >= 2) {
      const vals = hist.map(h => h.weight), mn = Math.min(...vals), mx = Math.max(...vals);
      const bars = hist.slice(-5).map(h =>
        `<div class="bar-col"><span>W${h.week}</span><div class="bar${h.week === currentWeek ? ' now' : ''}" style="height:${Math.round(12 + (mx === mn ? 22 : (h.weight - mn) / (mx - mn) * 28))}px"></div></div>`
      ).join('');
      const diff = vals[vals.length - 1] - hist[0].weight;
      trend = `<div class="trend"><div class="bars">${bars}</div>
        <div style="flex:1"><div class="effort-k">TREND</div>
        <div style="font-size:11.5px;line-height:1.4;margin-top:2px">${diff >= 0 ? '+' : ''}${diff % 1 ? diff.toFixed(1) : diff} lb over ${hist.length} logged wks.</div></div></div>`;
    }

    const activeI = act && act.ex.id === ex.id ? act.i : -1;
    const rows = arr.map((v, i) => {
      const isActive = i === activeI;
      const setW = state[day.id].weights[`${ex.id}_${i}`];
      const shown = setW != null ? setW : (curW != null ? curW : '');
      let cell;
      if (isActive) cell = `<button class="log-btn" data-act="log">LOG</button>`;
      else if (v === true) cell = `<span class="t-done" data-act="undo" data-ex="${ex.id}" data-i="${i}">${esc(shown)} ●</span>`;
      else if (v === 'skipped') cell = `<span class="t-skip" data-act="skipset" data-ex="${ex.id}" data-i="${i}">SKIP</span>`;
      else cell = `<span class="t-pend" data-act="skipset" data-ex="${ex.id}" data-i="${i}">skip →</span>`;
      const reps = ex.reps + (ex.llp && i === arr.length - 1 && !/LLP/.test(ex.reps) ? ' +LLP' : '');
      return `<div class="grid-r${isActive ? ' active' : ''}${v === true ? ' done' : ''}">
        <span class="n">${i + 1}</span>
        <span class="last">${prior && prior.weight != null ? esc(prior.weight) : '—'}</span>
        <span>${esc(reps)}</span>
        <div class="cell-today">${cell}</div></div>`;
    }).join('');

    const effort = ['low', 'medium', 'high'].map(l => {
      const on = (state[day.id].effort[ex.id] || '') === l;
      return `<button class="eff${on ? ' on' : ''}" data-act="eff" data-ex="${ex.id}" data-l="${l}">${EFF_LABEL[l]}</button>`;
    }).join('');

    const lastCol = prior
      ? `W${prior.week}${prior.effort ? ' · ' + EFF_LABEL[prior.effort] : ''}` : 'LAST';

    return `<div class="ex">
      <div class="ex-top">
        <div class="ex-name${allDone ? ' done' : ''}">${String(xi + 1).padStart(2, '0')} ${esc(ex.name)}</div>
        <div class="ex-right">
          ${EXERCISE_ALTERNATIVES[orig.id] ? `<button class="swap${swapped ? ' on' : ''}" data-act="swap" data-orig="${orig.id}" aria-label="Swap exercise">⇄</button>` : ''}
          <div class="ex-count">${dh + sk}/${ex.sets}</div>
        </div>
      </div>
      <div class="tags">${tags}</div>
      ${ex.note ? `<div class="ex-note">${esc(ex.note)}${swapped ? '  ·  swapped' : ''}</div>` : ''}
      ${trend}
      <div class="grid">
        <div class="grid-h"><span>SET</span><span>${esc(lastCol)}</span><span>REPS</span><span>TODAY</span></div>
        ${rows}
      </div>
      <div class="effort"><span class="effort-k">EFFORT</span><div style="display:flex;gap:5px">${effort}</div></div>
      <button class="skipex" data-act="skipex" data-ex="${ex.id}">${arr.every(v => v === 'skipped') ? 'UNSKIP EXERCISE' : 'SKIP EXERCISE'}</button>
    </div>`;
  }).join('') + `<div style="height:20px"></div>`;
}
const EXEC_RULES = [
  'First set of each exercise → 3–4 sec eccentric',
  'LLP = bottom-half partials on last set only — isolations only, never compounds',
  'No failure on compounds — RPE <10 always',
  'Exercise RPE = allowed range; weekly phase sets how deep to push',
  'Rest: compounds 2–3.5 min · machines 2–2.5 min · isolations 1–1.5 min',
];

const PROG_RULES = [
  'Double progression: hit top reps → increase weight next session. Miss → repeat weight.',
  'Performance drops 2 sessions in a row → reduce volume 20%',
  'If recovery suffers, cut 1 set per exercise before adding more',
];

function phaseIndexForWeek() {
  const label = curProg().weekPhases[currentWeek - 1].label;
  return curProg().mesocycle.findIndex(m => m.label === label);
}

function planHTML() {
  const prog = curProg(), nowIdx = phaseIndexForWeek();
  const phases = prog.mesocycle.map((ph, i) => {
    const open = view.openPhase === i;
    const body = open ? `<div class="ph-body">
      <div class="ph-rir">${esc(ph.rir)}</div>
      ${ph.points.map(p => `<div class="bullet"><i>—</i><span>${esc(p)}</span></div>`).join('')}
    </div>` : '';
    return `<div class="ph${i === nowIdx ? ' now' : ''}">
      <div class="ph-r" data-act="phase" data-i="${i}">
        <span class="w">${esc(ph.weeks)}</span>
        <span class="l">${esc(ph.label)}${i === nowIdx ? '  ← NOW' : ''}</span>
        <span class="r">${esc(ph.rpe)}</span>
      </div>${body}</div>`;
  }).join('');

  const panel = (title, items) =>
    `<div class="panel" style="margin-left:0;margin-right:0"><div class="panel-h">${title}</div>${
      items.map(t => `<div class="rule"><i>→</i><span>${esc(t)}</span></div>`).join('')}</div>`;

  const gloss = Object.entries(GLOSSARY).map(([t, d]) =>
    `<div class="gl"><div class="gl-t">${esc(t)}</div><div class="gl-d">${esc(d)}</div></div>`).join('');

  return `<div class="vw">
    <div class="vw-sub">${prog.totalWeeks}-WEEK MESOCYCLE · PROGRESSIVE OVERLOAD IN PHASES</div>
    <div class="tbl"><div class="tbl-h"><span>WEEKS</span><span>PHASE</span><span>RPE</span></div>${phases}</div>
    ${panel('EXECUTION RULES', EXEC_RULES)}
    ${panel('PROGRESSION RULES', PROG_RULES)}
    <div class="panel" style="margin-left:0;margin-right:0"><div class="panel-h">GLOSSARY</div>${gloss}</div>
  </div>`;
}

const DOT_COLOR = { low: 'var(--muted-2)', medium: 'var(--accent)', high: 'var(--ink)' };

function progressHTML() {
  const prog = curProg(), max = prog.totalWeeks;
  let out = '', any = false;

  DAYS.forEach(d => {
    let rows = '';
    d.exercises.forEach(o => {
      const ex = resolveExercise(d.id, o);
      const hist = getExerciseHistory(d.id, ex.id);
      if (!hist.length) return;
      any = true;
      const byWeek = {};
      hist.forEach(h => { byWeek[h.week] = h; });
      let cells = '';
      for (let w = 1; w <= max; w++) {
        const h = byWeek[w], now = w === currentWeek;
        const val = h && h.weight != null ? (h.weight % 1 ? h.weight.toFixed(1) : h.weight) : '·';
        cells += `<div class="cell${now && h ? ' now' : ''}${h ? '' : ' empty'}">
          <div class="cell-w">W${w}</div><div class="cell-v">${val}</div>
          <div class="cell-dot" style="background:${h && h.effort ? DOT_COLOR[h.effort] : 'transparent'}"></div></div>`;
      }
      const ws = hist.filter(h => h.weight != null).map(h => h.weight);
      const diff = ws.length >= 2 ? ws[ws.length - 1] - ws[0] : null;
      const delta = diff == null ? '—' : `${diff >= 0 ? '+' : ''}${diff % 1 ? diff.toFixed(1) : diff} lb`;
      rows += `<div class="pe"><div class="pe-top"><div class="pe-n">${esc(ex.name)}</div>
        <div class="pe-d">${delta}</div></div><div class="cells">${cells}</div></div>`;
    });
    if (rows) out += `<div class="pd-h">${esc(d.label)} · ${esc(d.title)}</div>${rows}`;
  });

  const empty = `<div style="text-align:center;padding:48px 20px;font-size:12px;color:var(--muted-2);line-height:1.6">
    No weights or effort logged yet.<br>Track a few sessions and your progression appears here.</div>`;

  return `<div class="vw"><div class="vw-sub">${esc(prog.name.toUpperCase())} · ● EFFORT · ▮ = THIS WEEK</div>
    ${any ? out : empty}</div>`;
}

function settingsHTML() {
  const prog = curProg(), s = dayStats(curDay().id);
  const cur = storedTheme() || 'auto';
  const tb = (v, l) => `<button class="theme-b${cur === v ? ' on' : ''}" data-act="theme" data-v="${v}">${l}</button>`;

  return `<div class="vw">
    <div class="vw-sub">BACKUP &amp; RESTORE · v3 · ALL PROGRAMS &amp; WEEKS</div>

    <div class="panel" style="margin-left:0;margin-right:0">
      <div class="panel-h">APPEARANCE</div>
      <div class="theme-row">${tb('light', 'LIGHT')}${tb('dark', 'DARK')}${tb('auto', 'AUTO')}</div>
    </div>

    <div class="panel" style="margin-left:0;margin-right:0">
      <div class="panel-h">EXPORT</div>
      <div style="font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px">Download every logged set, weight, effort rating, swap and protocol check across all programs and weeks as a JSON file.</div>
      <button class="big-btn" data-act="export">↓ EXPORT DATA</button>
    </div>

    <div class="panel" style="margin-left:0;margin-right:0">
      <div class="panel-h">IMPORT</div>
      <div style="font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px">Restore from a v1, v2 or v3 gAIns backup. Legacy files are migrated automatically.</div>
      <button class="big-btn ghost" data-act="import">↑ IMPORT DATA</button>

      ${view.importMsg ? `<div style="margin-top:10px;font-family:var(--font-mono);font-size:10px;color:${view.importOk ? 'var(--ok)' : 'var(--danger)'}">${esc(view.importMsg)}</div>` : ''}
    </div>

    <div class="panel" style="margin-left:0;margin-right:0;border-color:var(--border)">
      <div class="panel-h" style="color:var(--muted-2)">THIS WEEK · WEEK ${currentWeek}/${prog.totalWeeks}</div>
      <div class="kv"><span>Sets done</span><span>${s.done}/${s.total}</span></div>
      <div class="kv"><span>Skipped</span><span>${s.skipped}</span></div>
      <div class="kv"><span>Program</span><span>${esc(prog.name)}</span></div>
    </div>

    <button class="big-btn ghost" style="margin-top:12px;border:1px solid var(--border);color:var(--muted-2)" data-act="clearweek">CLEAR THIS WEEK'S LOG</button>
  </div>`;

function renderScroll() {
  const el = document.getElementById('scroll');
  if (view.name === 'day') el.innerHTML = workoutHeaderHTML(curDay()) + exercisesHTML(curDay());
  else if (view.name === 'plan') el.innerHTML = planHTML();
  else if (view.name === 'progress') el.innerHTML = progressHTML();
  else el.innerHTML = settingsHTML();
  const fi = document.getElementById('importFile');
  if (fi) fi.onchange = importData;
}
function syncPending(day, act) {
  const key = `${curProg().id}:${currentWeek}:${day.id}:${act.ex.id}:${act.i}`;
  if (view.pendKey === key) return;
  view.pendKey = key;
  const stored = state[day.id].weights[act.ex.id];
  const prev = act.i > 0 ? state[day.id].weights[`${act.ex.id}_${act.i - 1}`] : null;
  const prior = priorWeekEntry(day.id, act.ex.id);
  view.pendW = Number(prev != null ? prev : stored != null ? stored : (prior && prior.weight) || 0) || 0;
}

function renderBottomBar() {
  const el = document.getElementById('bottombar');
  if (view.name !== 'day') { el.innerHTML = ''; return; }
  const day = curDay(), act = activeSet(day), s = dayStats(day.id);

  let pill = '';
  const restMs = view.restEnd ? Math.max(0, view.restEnd - view.now) : 0;
  if (view.restEnd && view.restMinimized) {
    const urgent = restMs / 1000 <= 10;
    pill = `<div class="pill">
      <div class="pill-l" data-act="restexpand">
        <span class="dot${urgent ? ' urgent' : ''}"></span>
        <span class="pill-k">REST</span>
        <span class="pill-t${urgent ? ' urgent' : ''}">${fmtClock(restMs)}</span>
      </div>
      <div style="display:flex;gap:8px;flex:none">
        <button class="pill-b" data-act="rest+">+30</button>
        <button class="pill-b" data-act="restskip">SKIP</button>
      </div></div>`;
  }

  let body;
  if (act) {
    syncPending(day, act);
    body = `<div class="log-row">
      <div class="log-top">
        <div class="log-name">${esc(act.ex.name)}</div>
        <div class="log-set">SET ${act.i + 1}/${act.ex.sets} · ${esc(act.ex.reps)} REPS</div>
      </div>
      <div class="log-ctl">
        <div class="stepper">
          <button class="step-b" data-act="w-">−</button>
          <div class="step-v"><div>${view.pendW % 1 ? view.pendW.toFixed(1) : view.pendW}</div><div>LB</div></div>
          <button class="step-b" data-act="w+">+</button>
        </div>
        <button class="log-go" data-act="log">LOG SET</button>
      </div></div>`;
  } else {
    body = `<div class="done-row">
      <div class="done-t">DAY COMPLETE</div>
      <div class="done-s">${fmtClock(view.now - view.sessionStart)} · ${s.done}/${s.total} · ${s.skipped} skip</div>
    </div>`;
  }

  el.innerHTML = `<div class="barbar">${pill}${body}</div>`;
}
const REST_PRESETS = [60, 90, 120, 180];
const RING_C = 527.8;

function renderOverlays() {
  const el = document.getElementById('overlays');

  if (view.confirm) {
    el.innerHTML = `<div class="ov scrim"><div class="modal">
      <div class="modal-t">${esc(view.confirm.title)}</div>
      <div class="modal-m">${esc(view.confirm.msg)}</div>
      <div class="modal-row">
        <button class="ra" style="flex:1" data-act="cfx">CANCEL</button>
        <button class="ra solid" style="flex:1" data-act="cfok">CONFIRM</button>
      </div></div></div>`;
    return;
  }

  if (view.tip) {
    el.innerHTML = `<div class="ov scrim" data-act="tipx"><div class="modal dark">
      <div class="tip-t">${esc(view.tip)}</div>
      <div class="tip-d">${esc(GLOSSARY[view.tip] || '')}</div>
      <div class="tip-c">TAP TO CLOSE</div></div></div>`;
    return;
  }

  if (view.swap) {
    const { dayId, origId } = view.swap;
    const day = DAYS.find(d => d.id === dayId);
    const orig = day.exercises.find(e => e.id === origId);
    const curSwap = (state[dayId].swaps || {})[origId];
    const cur = resolveExercise(dayId, orig);
    let opts = '';
    if (curSwap) {
      opts += `<div class="opt" data-act="doswap" data-orig="${origId}" data-new="${origId}">
        <div class="opt-n">↩ ${esc(orig.name)}</div>
        <div class="opt-m">${orig.sets} sets · ${esc(orig.reps)} · RPE ${esc(orig.rpe)}</div>
        <div class="opt-d">Revert to original exercise</div></div>`;
    }
    (EXERCISE_ALTERNATIVES[origId] || []).forEach(a => {
      opts += `<div class="opt${curSwap === a.id ? ' on' : ''}" data-act="doswap" data-orig="${origId}" data-new="${a.id}">
        <div class="opt-n">${esc(a.name)}</div>
        <div class="opt-m">${a.sets} sets · ${esc(a.reps)} · RPE ${esc(a.rpe)} · ⏱ ${esc(a.restLabel)}</div>
        <div class="opt-d">${esc(a.note)}</div></div>`;
    });
    el.innerHTML = `<div class="ov scrim sheet"><div class="sheet-in">
      <div class="sheet-h">Swap Exercise</div>
      <div class="sheet-s">Current: ${esc(cur.name)}</div>
      ${opts}
      <button class="ra" style="width:100%;margin-top:4px" data-act="swapx">CANCEL</button>
    </div></div>`;
    return;
  }

  if (view.restEnd && !view.restMinimized) {
    const ms = Math.max(0, view.restEnd - view.now);
    const urgent = ms / 1000 <= 10;
    const pct = view.restTotal ? Math.max(0, ms / 1000 / view.restTotal) : 0;
    const presets = REST_PRESETS.map(s =>
      `<button class="preset${view.restTotal === s ? ' on' : ''}" data-act="preset" data-s="${s}">${fmtClock(s * 1000)}</button>`).join('');
    el.innerHTML = `<div class="ov rest">
      <button class="mini" data-act="restmin">MINIMIZE ↓</button>
      <div class="rest-k">Rest Period</div>
      <div class="rest-i">${esc(view.restInfo)}</div>
      <div class="rest-r">${esc(view.restRec)}</div>
      <div class="ring-wrap">
        <svg width="190" height="190" viewBox="0 0 190 190" style="transform:rotate(-90deg)">
          <circle cx="95" cy="95" r="84" fill="none" stroke="var(--border)" stroke-width="6"></circle>
          <circle cx="95" cy="95" r="84" fill="none" stroke="${urgent ? 'var(--danger)' : 'var(--accent)'}"
                  stroke-width="6" stroke-linecap="round" stroke-dasharray="${RING_C}"
                  stroke-dashoffset="${(RING_C * (1 - pct)).toFixed(1)}"></circle>
        </svg>
        <div class="ring-mid">
          <div class="ring-t${urgent ? ' urgent' : ''}">${fmtClock(ms)}</div>
          <div class="ring-s">remaining</div>
        </div>
      </div>
      <div style="display:flex;gap:7px">${presets}</div>
      <div class="rest-actions">
        <button class="ra" data-act="rest-">−15s</button>
        <button class="ra ink" data-act="rest+">+30s</button>
        <button class="ra solid" data-act="restskip">SKIP</button>
      </div>
      <div class="rest-next">${esc(view.restNext)}</div></div>`;
    return;
  }

  el.innerHTML = '';
}

function resetWeek() {
  DAYS.forEach(day => {
    state[day.id].protocol = [];
    state[day.id].weights = {};
    state[day.id].effort = {};
    day.exercises.forEach(o => {
      const ex = resolveExercise(day.id, o);
      state[day.id].sets[ex.id] = Array(ex.sets).fill(false);
    });
  });
  saveState();
  view.latestPr = null;
  view.pendKey = '';
}

function render() {
  renderMasthead();
  renderScroll();
  renderBottomBar();
  renderOverlays();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'prog')     { switchProgram(Number(el.dataset.i)); view.dayId = getStartDay(); view.pendKey = ''; view.latestPr = null; }
  else if (act === 'wk')  { changeWeek(Number(el.dataset.d)); view.dayId = getStartDay(); view.pendKey = ''; view.latestPr = null; view.restEnd = null; }
  else if (act === 'day') { view.name = 'day'; view.dayId = el.dataset.id; view.pendKey = ''; }
  else if (act === 'view'){ view.name = el.dataset.v; }
  else if (act === 'settings') { view.name = view.name === 'settings' ? 'day' : 'settings'; }
  else if (act === 'proto') { toggleProtocol(curDay().id, Number(el.dataset.i)); }
  else if (act === 'skipday') {
    view.confirm = { title: 'Skip Day?', msg: 'All remaining sets will be marked skipped.', act: 'skipday' };
  }
  else if (act === 'completeday') {
    view.confirm = { title: 'Complete Day?', msg: 'All remaining sets will be marked done.', act: 'completeday' };
  }
  else if (act === 'tip')     { view.tip = el.dataset.t; }
  else if (act === 'undo')    { undoSet(curDay().id, el.dataset.ex, Number(el.dataset.i)); }
  else if (act === 'skipset') { skipSet(curDay().id, el.dataset.ex, Number(el.dataset.i)); }
  else if (act === 'skipex')  { skipExercise(curDay().id, el.dataset.ex); }
  else if (act === 'eff')     { saveEffort(curDay().id, el.dataset.ex, el.dataset.l); }
  else if (act === 'swap')    { view.swap = { dayId: curDay().id, origId: el.dataset.orig }; }
  else if (act === 'log')     { logActiveSet(); }
  else if (act === 'w-') { view.pendW = Math.max(0, view.pendW - 2.5); }
  else if (act === 'w+') { view.pendW = view.pendW + 2.5; }
  else if (act === 'restexpand') { view.restMinimized = false; }
  else if (act === 'restskip')   { view.restEnd = null; view.restMinimized = false; }
  else if (act === 'rest+')      { addRest(30); }
  else if (act === 'rest-')      { addRest(-15); }
  else if (act === 'phase')  { view.openPhase = view.openPhase === Number(el.dataset.i) ? -1 : Number(el.dataset.i); }
  else if (act === 'theme')  { setTheme(el.dataset.v === 'auto' ? null : el.dataset.v); return; }
  else if (act === 'export') { exportData(); }
  else if (act === 'import') { document.getElementById('importFile').click(); return; }
  else if (act === 'clearweek') {
    view.confirm = { title: 'Clear Week?', msg: "This week's logged sets, weights and effort will be reset.", act: 'clearweek' };
  }
  else if (act === 'restmin') { view.restMinimized = true; }
  else if (act === 'preset')  { setRest(Number(el.dataset.s)); }
  else if (act === 'tipx')    { view.tip = null; }
  else if (act === 'swapx')   { view.swap = null; }
  else if (act === 'doswap')  { performSwap(view.swap.dayId, el.dataset.orig, el.dataset.new); view.swap = null; view.pendKey = ''; }
  else if (act === 'cfok')    {
    const c = view.confirm; view.confirm = null;
    if (c.act === 'skipday') skipDay(curDay().id);
    else if (c.act === 'completeday') completeDay(curDay().id);
    else if (c.act === 'clearweek') { resetWeek(); view.importMsg = "This week's log cleared."; view.importOk = true; }
  }
  else if (act === 'cfx')     { view.confirm = null; }
  else return;
  render();
});

function boot() {
  migrateOldState();
  migrateToMultiProgram();
  loadProgram();
  loadWeek();
  initState();
  view.dayId = getStartDay();
  render();
  setInterval(() => {
    view.now = Date.now();
    if (view.restEnd && view.restEnd <= view.now) { view.restEnd = null; view.restMinimized = false; }
    render();
  }, 500);
  document.addEventListener('visibilitychange', () => { view.now = Date.now(); render(); });
}

boot();
</script>
</body>
</html>
