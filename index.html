}
function fmtClock(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function dayStats(dayId) {
  let done = 0, total = 0, skipped = 0;
  const day = DAYS.find(d => d.id === dayId);
  day.exercises.forEach(o => {
    const ex = resolveExercise(dayId, o);
    (state[dayId].sets[ex.id] || []).forEach(v => {
      total++;
      if (v === true) done++;
      else if (v === 'skipped') skipped++;
    });
  });
  return { done, total, skipped };
}

function weekPct() {
  let done = 0, total = 0;
  DAYS.forEach(d => d.exercises.forEach(o => {
    const ex = resolveExercise(d.id, o);
    (state[d.id].sets[ex.id] || []).forEach(v => { total++; if (v === true) done++; });
  }));
  return total ? Math.round(done / total * 100) : 0;
}

function workoutHeaderHTML(day) {
  const s = dayStats(day.id);
  const ids = day.exercises.map(e => resolveExercise(day.id, e).id);
  const hasPending = ids.some(id => (state[day.id].sets[id] || []).some(v => v === false));
  const hasSkipped = ids.some(id => (state[day.id].sets[id] || []).some(v => v === 'skipped'));
  const complete = isDayComplete(day.id);

  const stats = `<div class="stats">
    <div class="stat"><div class="stat-k">TIME</div><div class="stat-v">${fmtClock(view.now - view.sessionStart)}</div></div>
    <div class="stat"><div class="stat-k">SETS</div><div class="stat-v">${s.done}<small>/${s.total}</small></div></div>
    <div class="stat"><div class="stat-k">SKIPPED</div><div class="stat-v">${s.skipped}</div></div>
    <div class="stat"><div class="stat-k">WEEK</div><div class="stat-v" style="color:var(--accent)">${weekPct()}<small>%</small></div></div>
  </div>`;

  const pr = view.latestPr
    ? `<div class="pr"><b>${esc(view.latestPr.type)}</b><span>${esc(view.latestPr.text)}</span></div>` : '';

  // Standing "this day is finished" banner. The bottom bar says it too, but
  // that sits below the fold once the exercise list is scrolled, so the state
  // gets its own headline at the top of the day.
  let flag = '';
  if (complete) {
    const nx = nextUp(day.id);
    flag = `<div class="dayflag">
      <div class="dayflag-k">${esc(day.title.replace(/\.$/, ''))} · WEEK ${currentWeek}</div>
      <div class="dayflag-t">DAY COMPLETE</div>
      <div class="dayflag-s">${s.done}/${s.total} SETS LOGGED · ${s.skipped} SKIPPED</div>
      ${nx ? `<button class="dayflag-go" data-act="${nx.act}"${nx.id ? ` data-id="${nx.id}"` : ''}>${esc(nx.label)}</button>` : ''}
    </div>`;
  }

  let btns = '';
  if (hasPending) {
    btns = `<div class="daybtns">
      <button class="dbtn" data-act="skipday">SKIP DAY</button>
      <button class="dbtn strong" data-act="completeday">COMPLETE DAY</button></div>`;
  } else if (complete && hasSkipped) {
    btns = `<div class="daybtns"><button class="dbtn" data-act="skipday">UNSKIP DAY</button></div>`;
  }

  let proto = '';
  if (day.protocol) {
    const items = (curProg().protocolItems || []).map((t, i) => {
      const on = (state[day.id].protocol || [])[i];
      return `<div class="proto${on ? ' on' : ''}" data-act="proto" data-i="${i}">
        <div class="proto-box${on ? ' on' : ''}">${on ? '✓' : ''}</div><span>${esc(t)}</span></div>`;
    }).join('');
    proto = `<div class="panel"><div class="panel-h">SHOULDER PROTOCOL — BEFORE PRESSING</div>${items}</div>`;
  }

  return flag + stats + pr + btns + proto;
}

// What to offer once `dayId` is finished: the next unfinished day of the
// week, or — when nothing is left — the progress view. Returns null when
// there's nothing useful to point at. Shared by the day banner and the
// bottom bar so both always name the same destination.
function nextUp(dayId) {
  const next = DAYS.find(d => d.id !== dayId && !isDayComplete(d.id));
  if (next) return { act: 'donenext', id: next.id, label: `NEXT · ${next.label.toUpperCase()}` };
  if (isWeekComplete()) return { act: 'doneprog', id: '', label: 'SEE PROGRESS' };
  return null;
}

// First open (unlogged, unskipped) set index for `orig` (an ORIGINAL
// day.exercises entry, resolved to whatever it's currently swapped to), or
// -1 if none remain. Shared by activeSet() and the "did this selection just
// run out of sets" checks in logActiveSet()/skipSet() so there's one place
// that knows how to scan a set array. Pass `ex` only when the caller already
// resolved it, to skip a redundant resolveExercise() call.
function openSetIndex(day, orig, ex = resolveExercise(day.id, orig)) {
  const arr = state[day.id].sets[ex.id] || [];
  return arr.findIndex(v => v === false);
}

// A selected exercise wins over plan order, so sets can be logged in any
// order. Stays PURE — it runs during render, so it must never write to
// `view`; the handlers that complete an exercise clear the selection instead.
function activeSet(day) {
  if (view.selectedExId) {
    const sel = day.exercises.find(o => o.id === view.selectedExId);
    if (sel) {
      const ex = resolveExercise(day.id, sel);
      const i = openSetIndex(day, sel, ex);
      if (i !== -1) return { ex, orig: sel, i };
    }
  }
  for (const o of day.exercises) {
    const ex = resolveExercise(day.id, o);
    const i = openSetIndex(day, o, ex);
    if (i !== -1) return { ex, orig: o, i };
  }
  return null;
}

// True when the exercise (given by its ORIGINAL day.exercises entry) still
// has a set waiting to be logged. Used to decide when a selection has been
// used up and should be released.
function hasPendingSet(day, orig) {
  return openSetIndex(day, orig) !== -1;
}

function undoSet(dayId, exId, i) {
  state[dayId].sets[exId][i] = false;
  clearTime(dayId, exId, i);
  saveState();
  syncCompletion(dayId);
  view.pendKey = '';
}

function logActiveSet() {
  const day = curDay(), act = activeSet(day);
  if (!act) return;
  const { ex, i } = act, w = view.pendW, r = view.pendR;

  const hist = getExerciseHistory(day.id, ex.id).filter(h => h.week < currentWeek && h.weight != null);
  const maxPrior = hist.length ? Math.max(...hist.map(h => h.weight)) : 0;

  state[day.id].sets[ex.id][i] = true;
  state[day.id].weights[ex.id] = w;
  state[day.id].weights[`${ex.id}_${i}`] = w;
  // Blank/invalid reps record nothing at all, so "not recorded" stays a single
  // unambiguous state — exactly how every set logged before this feature reads.
  const rn = (r === '' || r == null) ? NaN : Number(r);
  if (!isNaN(rn)) {
    state[day.id].reps[ex.id] = rn;
    state[day.id].reps[`${ex.id}_${i}`] = rn;
  }
  markTime(day.id, ex.id, i, 'log');
  saveState();

  view.latestPr = (maxPrior > 0 && w > maxPrior)
    ? { type: 'WEIGHT PR', text: `${ex.name} — ${w} lb beats your W${hist.find(h => h.weight === maxPrior).week} best of ${maxPrior} lb` }
    : null;
  view.pendKey = '';
  if (view.selectedExId === act.orig.id && !hasPendingSet(day, act.orig)) view.selectedExId = null;

  // Read this BEFORE syncCompletion: finishing the last day of a week moves
  // the app on to the next one, which reloads `state` out from under us — so
  // isDayComplete() would then be answering about a different week entirely.
  const dayDone = isDayComplete(day.id);
  const nxt = dayDone ? null : activeSet(day);
  syncCompletion(day.id);

  if (!dayDone) {
    view.restEnd = Date.now() + ex.rest * 1000;
    view.restTotal = ex.rest;
    view.restMinimized = false;
    view.restInfo = `${ex.name} — SET ${i + 1} DONE`;
    view.restRec = ex.restLabel ? `RECOMMENDED ${ex.restLabel}` : '';
    view.restNext = nxt
      ? (nxt.ex.id === ex.id ? `Next: ${ex.name} — Set ${nxt.i + 1}` : `Next: ${nxt.ex.name}`)
      : 'Last set of the day!';
  }
}

function setRest(sec) { view.restTotal = sec; view.restEnd = Date.now() + sec * 1000; }

function addRest(delta) {
  if (!view.restEnd) return;
  let end = view.restEnd + delta * 1000;
  if (end - Date.now() < 5000) end = Date.now() + 5000;
  view.restTotal = Math.max(view.restTotal, Math.ceil((end - Date.now()) / 1000));
  view.restEnd = end;
}

const EFF_LABEL = { low: 'LOW', medium: 'MED', high: 'HIGH' };

function exercisesHTML(day) {
  const act = activeSet(day);
  return day.exercises.map((orig, xi) => {
    const ex = resolveExercise(day.id, orig);
    const swapped = ex.id !== orig.id;
    const arr = state[day.id].sets[ex.id] || [];
    const dh = arr.filter(v => v === true).length;
    const sk = arr.filter(v => v === 'skipped').length;
    // Against the array's OWN length, not `ex.sets`: the rows below render from
    // `arr`, so in a ramped (or deloaded) week a card whose every rendered set
    // is resolved would otherwise never register as done.
    const allDone = (dh + sk) === arr.length;
    const prior = priorWeekEntry(day.id, ex.id);
    const curW = state[day.id].weights[ex.id];
    const curR = state[day.id].reps[ex.id];

    let tags = `<span class="tag">${setsForWeek(ex)}×${esc(ex.reps)}</span>`
      + `<span class="tag ink hit" data-act="tip" data-t="RPE">RPE ${esc(ex.rpe)}</span>`;
    if (ex.restLabel) tags += `<span class="tag">⏱ ${esc(ex.restLabel)}</span>`;
    if (ex.llp) tags += `<span class="tag acc hit" data-act="tip" data-t="LLP">LLP</span>`;
    if (ex.compound) tags += `<span class="tag hit" data-act="tip" data-t="compounds">COMPOUND</span>`;

    const hist = getExerciseHistory(day.id, ex.id).filter(h => h.weight != null);
    let trend = `<div class="trend-empty">▂ LOG 2+ WEEKS TO SEE A TREND</div>`;
    if (hist.length >= 2) {
      const vals = hist.map(h => h.weight), mn = Math.min(...vals), mx = Math.max(...vals);
      const bars = hist.slice(-5).map(h =>
        `<div class="bar-col"><span>W${h.week}</span><div class="bar${h.week === currentWeek ? ' now' : ''}" style="height:${Math.round(12 + (mx === mn ? 22 : (h.weight - mn) / (mx - mn) * 28))}px"></div></div>`
      ).join('');
      const diff = vals[vals.length - 1] - hist[0].weight;
      trend = `<div class="trend"><div class="bars">${bars}</div>
        <div style="flex:1"><div class="effort-k">TREND</div>
        <div style="font-size:11.5px;line-height:1.4;margin-top:2px">${diff >= 0 ? '+' : ''}${diff % 1 ? diff.toFixed(1) : diff} lb over ${hist.length} logged wks.</div></div></div>`;
    }

    const activeI = act && act.ex.id === ex.id ? act.i : -1;
    const rows = arr.map((v, i) => {
      const isActive = i === activeI;
      const setW = state[day.id].weights[`${ex.id}_${i}`];
      const shown = setW != null ? setW : (curW != null ? curW : '');
      // Reps actually performed for this set: per-set value first, then the
      // exercise-level value, else null (no × suffix). Kept separate from
      // `prescribedReps` below, which is the target range from the program data.
      const setPerformedR = state[day.id].reps[`${ex.id}_${i}`];
      const performedR = setPerformedR != null ? setPerformedR : (curR != null ? curR : null);
      let cell;
      // `cell-today` sits ON the cell element (not a wrapper) so the whole
      // grid cell is a tap target, not just its text.
      if (isActive) cell = `<div class="cell-today"><button class="log-btn" data-act="log">LOG</button></div>`;
      else if (v === true) cell = `<div class="cell-today t-done" data-act="undo" data-ex="${ex.id}" data-i="${i}">${esc(shown)}${performedR != null ? ' × ' + esc(performedR) : ''} ●</div>`;
      else if (v === 'skipped') cell = `<div class="cell-today t-skip" data-act="skipset" data-ex="${ex.id}" data-i="${i}">SKIP</div>`;
      else cell = `<div class="cell-today t-pend" data-act="skipset" data-ex="${ex.id}" data-i="${i}">skip →</div>`;
      const prescribedReps = ex.reps + (ex.llp && i === arr.length - 1 && !/LLP/.test(ex.reps) ? ' +LLP' : '');
      // Prior week's performed reps for this set index, same fallback order.
      const priorSetR = prior && prior.setReps ? prior.setReps[i] : null;
      const priorPerformedR = priorSetR != null ? priorSetR : (prior && prior.reps != null ? prior.reps : null);
      return `<div class="grid-r${isActive ? ' active' : ''}${v === true ? ' done' : ''}">
        <span class="n">${i + 1}</span>
        <span class="last">${prior && prior.weight != null ? esc(prior.weight) + (priorPerformedR != null ? ' × ' + esc(priorPerformedR) : '') : '—'}</span>
        <span>${esc(prescribedReps)}</span>
        ${cell}</div>`;
    }).join('');

    const effort = ['low', 'medium', 'high'].map(l => {
      const on = (state[day.id].effort[ex.id] || '') === l;
      return `<button class="eff${on ? ' on' : ''}" data-act="eff" data-ex="${ex.id}" data-l="${l}">${EFF_LABEL[l]}</button>`;
    }).join('');

    const lastCol = prior
      ? `W${prior.week}${prior.effort ? ' · ' + EFF_LABEL[prior.effort] : ''}` : 'LAST';

    // A finished exercise can't become the active set, so don't offer it —
    // and don't highlight it as selected either, even if `view.selectedExId`
    // still names it (a stale selection is released lazily at render time,
    // not by every call site that can finish an exercise).
    const isSel = view.selectedExId === orig.id && !allDone;
    const topCls = `ex-top${allDone ? '' : ' pick'}`;
    const topAttrs = allDone ? '' : ` data-act="selectex" data-ex="${orig.id}"`;
    return `<div class="ex${isSel ? ' sel' : ''}">
      <div class="${topCls}"${topAttrs}>
        <div class="ex-name${allDone ? ' done' : ''}">${String(xi + 1).padStart(2, '0')} ${esc(ex.name)}</div>
        <div class="ex-right">
          ${EXERCISE_ALTERNATIVES[orig.id] ? `<button class="swap hit${swapped ? ' on' : ''}" data-act="swap" data-orig="${orig.id}" aria-label="Swap exercise">⇄</button>` : ''}
          <div class="ex-count">${dh + sk}/${arr.length}</div>
        </div>
      </div>
      <div class="tags">${tags}</div>
      ${ex.note ? `<div class="ex-note">${esc(ex.note)}${swapped ? '  ·  swapped' : ''}</div>` : ''}
      ${trend}
      <div class="grid">
        <div class="grid-h"><span>SET</span><span>${esc(lastCol)}</span><span>REPS</span><span>TODAY</span></div>
        ${rows}
      </div>
      <div class="effort"><span class="effort-k">EFFORT</span><div style="display:flex;gap:8px">${effort}</div></div>
      <button class="skipex" data-act="skipex" data-ex="${ex.id}">${arr.every(v => v === 'skipped') ? 'UNSKIP EXERCISE' : 'SKIP EXERCISE'}</button>
    </div>`;
  }).join('') + `<div style="height:20px"></div>`;
}
const EXEC_RULES = [
  'First set of each exercise → 3–4 sec eccentric',
  'LLP = bottom-half partials on last set only — isolations only, never compounds',
  'No failure on compounds — RPE <10 always',
  'Exercise RPE = allowed range; weekly phase sets how deep to push',
  'Rest: compounds 2–3.5 min · machines 2–2.5 min · isolations 1–1.5 min',
];

const PROG_RULES = [
  'Double progression: hit top reps → increase weight next session. Miss → repeat weight.',
  'Performance drops 2 sessions in a row → reduce volume 20%',
  'If recovery suffers, cut 1 set per exercise before adding more',
];

function phaseIndexForWeek() {
  const label = curProg().weekPhases[currentWeek - 1].label;
  return curProg().mesocycle.findIndex(m => m.label === label);
}

function planHTML() {
  const prog = curProg(), nowIdx = phaseIndexForWeek();
  const phases = prog.mesocycle.map((ph, i) => {
    const open = view.openPhase === i;
    const body = open ? `<div class="ph-body">
      <div class="ph-rir">${esc(ph.rir)}</div>
      ${ph.points.map(p => `<div class="bullet"><i>—</i><span>${esc(p)}</span></div>`).join('')}
    </div>` : '';
    return `<div class="ph${i === nowIdx ? ' now' : ''}">
      <div class="ph-r" data-act="phase" data-i="${i}">
        <span class="w">${esc(ph.weeks)}</span>
        <span class="l">${esc(ph.label)}${i === nowIdx ? '  ← NOW' : ''}</span>
        <span class="r">${esc(ph.rpe)}</span>
      </div>${body}</div>`;
  }).join('');

  const panel = (title, items) =>
    `<div class="panel" style="margin-left:0;margin-right:0"><div class="panel-h">${title}</div>${
      items.map(t => `<div class="rule"><i>→</i><span>${esc(t)}</span></div>`).join('')}</div>`;

  const gloss = Object.entries(GLOSSARY).map(([t, d]) =>
    `<div class="gl"><div class="gl-t">${esc(t)}</div><div class="gl-d">${esc(d)}</div></div>`).join('');

  return `<div class="vw">
    <div class="vw-sub">${prog.totalWeeks}-WEEK MESOCYCLE · PROGRESSIVE OVERLOAD IN PHASES</div>
    <div class="tbl"><div class="tbl-h"><span>WEEKS</span><span>PHASE</span><span>RPE</span></div>${phases}</div>
    ${panel('EXECUTION RULES', EXEC_RULES)}
    ${panel('PROGRESSION RULES', PROG_RULES)}
    <div class="panel" style="margin-left:0;margin-right:0"><div class="panel-h">GLOSSARY</div>${gloss}</div>
  </div>`;
}

const DOT_COLOR = { low: 'var(--muted-2)', medium: 'var(--accent)', high: 'var(--ink)' };

function progressHTML() {
  const prog = curProg(), max = prog.totalWeeks;
  let out = '', any = false;

  DAYS.forEach(d => {
    let rows = '';
    d.exercises.forEach(o => {
      const ex = resolveExercise(d.id, o);
      const hist = getExerciseHistory(d.id, ex.id);
      if (!hist.length) return;
      any = true;
      const byWeek = {};
      hist.forEach(h => { byWeek[h.week] = h; });
      let cells = '';
      for (let w = 1; w <= max; w++) {
        const h = byWeek[w], now = w === currentWeek;
        const val = h && h.weight != null ? (h.weight % 1 ? h.weight.toFixed(1) : h.weight) : '·';
        cells += `<div class="cell${now && h ? ' now' : ''}${h ? '' : ' empty'}">
          <div class="cell-w">W${w}</div><div class="cell-v">${val}</div>
          <div class="cell-dot" style="background:${h && h.effort ? DOT_COLOR[h.effort] : 'transparent'}"></div></div>`;
      }
      const ws = hist.filter(h => h.weight != null).map(h => h.weight);
      const diff = ws.length >= 2 ? ws[ws.length - 1] - ws[0] : null;
      const delta = diff == null ? '—' : `${diff >= 0 ? '+' : ''}${diff % 1 ? diff.toFixed(1) : diff} lb`;
      rows += `<div class="pe"><div class="pe-top"><div class="pe-n">${esc(ex.name)}</div>
        <div class="pe-d">${delta}</div></div><div class="cells">${cells}</div></div>`;
    });
    if (rows) out += `<div class="pd-h">${esc(d.label)} · ${esc(d.title)}</div>${rows}`;
  });

  const empty = `<div style="text-align:center;padding:48px 20px;font-size:12px;color:var(--muted-2);line-height:1.6">
    No weights or effort logged yet.<br>Track a few sessions and your progression appears here.</div>`;

  return `<div class="vw"><div class="vw-sub">${esc(prog.name.toUpperCase())} · ● EFFORT · ▮ = THIS WEEK</div>
    ${any ? out : empty}</div>`;
}

function settingsHTML() {
  const prog = curProg(), s = dayStats(curDay().id);
  const cur = storedTheme() || 'auto';
  const tb = (v, l) => `<button class="theme-b${cur === v ? ' on' : ''}" data-act="theme" data-v="${v}">${l}</button>`;

  return `<div class="vw">
    <div class="vw-sub">BACKUP &amp; RESTORE · v3 · ALL PROGRAMS &amp; WEEKS</div>

    <div class="panel" style="margin-left:0;margin-right:0">
      <div class="panel-h">APPEARANCE</div>
      <div class="theme-row">${tb('light', 'LIGHT')}${tb('dark', 'DARK')}${tb('auto', 'AUTO')}</div>
    </div>

    <div class="panel" style="margin-left:0;margin-right:0">
      <div class="panel-h">EXPORT</div>
      <div style="font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px">Download every logged set, weight, rep count, effort rating, timestamp, swap and protocol check across all programs and weeks as a JSON file.</div>
      <button class="big-btn" data-act="export">↓ EXPORT DATA</button>
    </div>

    <div class="panel" style="margin-left:0;margin-right:0">
      <div class="panel-h">IMPORT</div>
      <div style="font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px">Restore from a v1, v2 or v3 gAIns backup. Legacy files are migrated automatically.</div>
      <button class="big-btn ghost" data-act="import">↑ IMPORT DATA</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
      ${view.importMsg ? `<div style="margin-top:10px;font-family:var(--font-mono);font-size:10px;color:${view.importOk ? 'var(--ok)' : 'var(--danger)'}">${esc(view.importMsg)}</div>` : ''}
    </div>

    <div class="panel" style="margin-left:0;margin-right:0">
      <div class="panel-h">TRAINING START DATE</div>
      <div style="font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px">Sets logged before dates were recorded have no date. Setting a start date for <strong>${esc(prog.name)}</strong> fills in estimated dates, marked as estimates. Real logged times are never changed, so you can revise this freely.</div>
      <input type="date" id="startDate-${esc(prog.id)}" value="${esc(localStorage.getItem(programStartKey(prog.id)) || '')}" style="width:100%;margin-bottom:10px;font-family:var(--font-mono);font-size:12px;padding:8px;background:var(--surface);color:var(--ink);border:1px solid var(--border)">
      <button class="big-btn ghost" data-act="backfill" data-p="${esc(prog.id)}">SET START DATE</button>
    </div>

    <div class="panel" style="margin-left:0;margin-right:0;border-color:var(--border)">
      <div class="panel-h" style="color:var(--muted-2)">THIS WEEK · WEEK ${currentWeek}/${prog.totalWeeks}</div>
      <div class="kv"><span>Sets done</span><span>${s.done}/${s.total}</span></div>
      <div class="kv"><span>Skipped</span><span>${s.skipped}</span></div>
      <div class="kv"><span>Program</span><span>${esc(prog.name)}</span></div>
    </div>

    <button class="big-btn ghost" style="margin-top:12px;border:1px solid var(--border);color:var(--muted-2)" data-act="clearweek">CLEAR THIS WEEK'S LOG</button>

    <div style="margin-top:20px;text-align:center;font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;color:var(--muted-2)">gAIns · APP VERSION ${esc(APP_VERSION)}</div>
  </div>`;
}

// The markup last written into #scroll, so an idle re-render can tell "nothing
// changed" without reading the DOM back. Reset to null to force a repaint.
let lastScrollHTML = null;

function renderScroll() {
  const el = document.getElementById('scroll');
  let html;
  if (view.name === 'day') html = workoutHeaderHTML(curDay()) + exercisesHTML(curDay());
  else if (view.name === 'plan') html = planHTML();
  else if (view.name === 'progress') html = progressHTML();
  else html = settingsHTML();
  // The 500ms clock tick re-renders everything, and reassigning innerHTML
  // destroys and recreates every node in here — killing live DOM state the
  // markup can't carry. The settings panel's <input type="date"> is the sharp
  // edge: a browser dismisses the native calendar the instant its input leaves
  // the DOM, so the picker closed within half a second of being opened.
  // Skipping the write when the markup is byte-identical leaves those nodes
  // (and their focus, caret, and open pickers) alone on idle ticks. Same
  // hazard renderBottomBar() guards for the inline weight editor.
  //
  // Compare against what we last WROTE, never against el.innerHTML: reading it
  // back returns the browser's re-serialization of the DOM — normalized
  // attribute quoting and order, re-escaped entities, void tags respelled — so
  // it is almost never byte-identical to the string that produced it, the
  // guard never fires, and the picker dies exactly as before. A string shim
  // that stores what you assign cannot reproduce that; a browser can.
  //
  // The emptiness check keeps the cache honest: anything that wipes the
  // container behind our back (the smoke harness does exactly this) must still
  // get a repaint. Testing el.innerHTML for CONTENT is safe in a way that
  // comparing it byte-for-byte is not — serialization reshapes markup, but it
  // never turns a populated container into an empty string.
  if (lastScrollHTML === html && el.innerHTML) return;
  lastScrollHTML = html;
  el.innerHTML = html;
  const fi = document.getElementById('importFile');
  if (fi) fi.onchange = importData;
}

// The bottom of a prescribed range: the FIRST integer in the reps string.
// Those strings vary a lot across programs — "6–10", "12–15", "10 each leg",
// "8–12 each leg", "15 + LLP" — and the first integer is the right answer for
// all of them (low end of a range, or the per-leg count), never an inflated one.
function lowRep(repsStr) {
  const m = /\d+/.exec(String(repsStr == null ? '' : repsStr));
  return m ? Number(m[0]) : '';
}

function syncPending(day, act) {
  const key = `${curProg().id}:${currentWeek}:${day.id}:${act.ex.id}:${act.i}`;
  if (view.pendKey === key) return;
  view.pendKey = key;
  const stored = state[day.id].weights[act.ex.id];
  const prev = act.i > 0 ? state[day.id].weights[`${act.ex.id}_${act.i - 1}`] : null;
  const prior = priorWeekEntry(day.id, act.ex.id);
  view.pendW = Number(prev != null ? prev : stored != null ? stored : (prior && prior.weight) || 0) || 0;

  // Reps deliberately do NOT carry from the previous set the way weight does:
  // reps drop set to set as fatigue accumulates, so set 1's number is a bad
  // guess for set 3. Last week's number at the same set index is the anchor.
  const priorSetR = prior && prior.setReps ? prior.setReps[act.i] : undefined;
  view.pendR = priorSetR != null ? priorSetR
    : (prior && prior.reps != null ? prior.reps : lowRep(act.ex.reps));
}

// Commit an inline numeric edit. Guarded on `view.editing` because a blur
// fires BOTH `change` and `focusout`, so this runs twice for one edit — the
// second call must do nothing rather than re-apply a stale field value.
function commitEdit(raw) {
  if (!view.editing) return;
  const field = view.editing;
  view.editing = null;
  const s = String(raw == null ? '' : raw).trim();
  if (s !== '') {
    if (field === 'w') {
      const n = parseFloat(s);
      if (!isNaN(n)) view.pendW = Math.max(0, n);
    } else if (field === 'r') {
      const n = parseInt(s, 10);
      if (!isNaN(n)) view.pendR = Math.max(0, n);
    }
  }
  render();
}

// `change` and `focusout` intentionally overlap here: for a text input,
// `change` is effectively a subset of `focusout`, so `focusout` alone would
// cover every case in a desktop browser. `change` stays anyway because
// soft-keyboard "Done"/"Go" behavior varies across mobile browsers, and this
// is a phone-first app — the `view.editing` guard inside commitEdit already
// makes the resulting double-fire a free no-op, so the redundancy costs
// nothing and buys robustness.
document.addEventListener('change', e => {
  if (e.target && e.target.id === EDIT_FIELD_ID) commitEdit(e.target.value);
});
document.addEventListener('focusout', e => {
  if (e.target && e.target.id === EDIT_FIELD_ID) commitEdit(e.target.value);
});
document.addEventListener('keydown', e => {
  if (!view.editing || !e.target || e.target.id !== EDIT_FIELD_ID) return;
  if (e.key === 'Enter') { e.preventDefault(); commitEdit(e.target.value); }
  else if (e.key === 'Escape') { view.editing = null; render(); }
});

function renderBottomBar() {
  const el = document.getElementById('bottombar');
  // A 500ms interval rebuilds this whole bar. Once the inline field is on
  // screen, leave the DOM alone or the caret and any partially-typed value
  // die twice a second. Checking the markup (not getElementById) keeps this
  // correct under the headless test shim, whose getElementById never returns
  // null. Only the rest pill's DISPLAY pauses; the timer is timestamp-based
  // (view.restEnd vs Date.now()), so it catches up on the next real render.
  // This match is coupled to the EXACT attribute spelling the two <input>
  // templates below emit (double-quoted `id="..."`) — reorder those
  // attributes or switch quote style and this substring check must change
  // with it, constant or not.
  if (view.editing && el.innerHTML.includes(`id="${EDIT_FIELD_ID}"`)) return;
  if (view.name !== 'day') { el.innerHTML = ''; return; }
  const day = curDay(), act = activeSet(day), s = dayStats(day.id);

  let pill = '';
  const restMs = view.restEnd ? Math.max(0, view.restEnd - view.now) : 0;
  if (view.restEnd && view.restMinimized) {
    const urgent = restMs / 1000 <= 10;
    pill = `<div class="pill">
      <div class="pill-l" data-act="restexpand">
        <span class="dot${urgent ? ' urgent' : ''}"></span>
        <span class="pill-k">REST</span>
        <span class="pill-t${urgent ? ' urgent' : ''}">${fmtClock(restMs)}</span>
      </div>
      <div style="display:flex;gap:8px;flex:none">
        <button class="pill-b" data-act="rest+">+30</button>
        <button class="pill-b" data-act="restskip">SKIP</button>
      </div></div>`;
  }

  let body;
  if (act) {
    syncPending(day, act);
    body = `<div class="log-row">
      <div class="log-top">
        <div class="log-name">${esc(act.ex.name)}</div>
        <div class="log-set">SET ${act.i + 1}/${(state[day.id].sets[act.ex.id] || []).length} · ${esc(act.ex.reps)} REPS</div>
      </div>
      <div class="log-ctl">
        <div class="log-steps">
          <div class="stepper">
            <button class="step-b" data-act="w-">−</button>
            <div class="step-v" data-act="editw">${view.editing === 'w'
              ? `<input id="${EDIT_FIELD_ID}" class="step-in" type="text" inputmode="decimal" value="${esc(view.pendW)}">`
              : `<div>${view.pendW % 1 ? view.pendW.toFixed(1) : view.pendW}</div>`}<div>LB</div></div>
            <button class="step-b" data-act="w+">+</button>
          </div>
          <div class="stepper">
            <button class="step-b" data-act="r-">−</button>
            <div class="step-v" data-act="editr">${view.editing === 'r'
              ? `<input id="${EDIT_FIELD_ID}" class="step-in" type="text" inputmode="numeric" value="${esc(view.pendR)}">`
              : `<div>${view.pendR === '' ? '—' : view.pendR}</div>`}<div>REPS</div></div>
            <button class="step-b" data-act="r+">+</button>
          </div>
        </div>
        <button class="log-go" data-act="log">LOG SET</button>
      </div></div>`;
  } else {
    const nx = nextUp(day.id);
    body = `<div class="done-row">
      <div class="done-mark">✓</div>
      <div class="done-txt">
        <div class="done-t">DAY COMPLETE</div>
        <div class="done-s">${fmtClock(view.now - view.sessionStart)} · ${s.done}/${s.total} SETS · ${s.skipped} SKIP</div>
      </div>
      ${nx ? `<button class="done-go" data-act="${nx.act}"${nx.id ? ` data-id="${nx.id}"` : ''}>${esc(nx.label)}</button>` : ''}
    </div>`;
  }

  el.innerHTML = `<div class="barbar">${pill}${body}</div>`;
  if (view.editing) {
    const f = document.getElementById(EDIT_FIELD_ID);
    if (f) { f.focus(); if (f.select) f.select(); }
  }
}
// Single source of truth for the inline edit field's id — referenced by the
// freeze guard, both input templates, the post-render focus lookup, and the
// change/focusout/keydown listeners. Change it here only; every use site
// below derives from it, so nothing can desync.
const EDIT_FIELD_ID = 'editfield';
const REST_PRESETS = [60, 90, 120, 180];
const RING_C = 527.8;

function doneCardHTML(d) {
  const kicker = d.programDone ? 'MESOCYCLE COMPLETE' : d.weekDone ? `WEEK ${d.week} COMPLETE` : 'SESSION COMPLETE';
  const title  = d.programDone ? 'All done' : d.weekDone ? `Week ${d.week} done` : 'Day complete';
  const sub    = d.programDone
    ? `${d.dayTitle} closed out week ${d.week} — the last week of ${curProg().name}.`
    : d.weekDone
      ? `${d.dayTitle} was the last session of the week.`
      : `${d.dayTitle} is logged. ${d.nextDayLabel ? `${d.nextDayLabel} is next.` : ''}`;

  const stats = `<div class="dc-stats">
    <div class="dc-st"><div class="dc-sk">TIME</div><div class="dc-sv">${fmtClock(d.elapsed)}</div></div>
    <div class="dc-st"><div class="dc-sk">SETS</div><div class="dc-sv">${d.sets}<small>/${d.total}</small></div></div>
    <div class="dc-st"><div class="dc-sk">SKIPPED</div><div class="dc-sv">${d.skipped}</div></div>
  </div>`;

  const moved = d.advancedTo
    ? `<div class="dc-move"><b>MOVED ON TO WEEK ${d.advancedTo}</b>${
        d.nextPhase ? `<span>${esc(d.nextPhase)}</span>` : ''}</div>` : '';

  let cta;
  if (d.advancedTo) {
    cta = `<button class="dc-go" data-act="donex">START WEEK ${d.advancedTo}</button>
      <button class="dc-alt" data-act="doneback">STAY ON WEEK ${d.week}</button>`;
  } else if (d.programDone) {
    cta = `<button class="dc-go" data-act="doneprog">SEE PROGRESS</button>
      <button class="dc-alt" data-act="donex">CLOSE</button>`;
  } else if (d.nextDayId) {
    cta = `<button class="dc-go" data-act="donenext" data-id="${d.nextDayId}">NEXT · ${esc(d.nextDayLabel.toUpperCase())}</button>
      <button class="dc-alt" data-act="donex">STAY HERE</button>`;
  } else {
    cta = `<button class="dc-go" data-act="donex">DONE</button>`;
  }

  return `<div class="dc">
    <div class="dc-mark">✓</div>
    <div class="dc-k">${kicker}</div>
    <div class="dc-t">${esc(title)}</div>
    <div class="dc-sub">${esc(sub)}</div>
    ${stats}${moved}${cta}</div>`;
}

function renderOverlays() {
  const el = document.getElementById('overlays');

  if (view.confirm) {
    el.innerHTML = `<div class="ov scrim"><div class="modal">
      <div class="modal-t">${esc(view.confirm.title)}</div>
      <div class="modal-m">${esc(view.confirm.msg)}</div>
      <div class="modal-row">
        <button class="ra" style="flex:1" data-act="cfx">CANCEL</button>
        <button class="ra solid" style="flex:1" data-act="cfok">CONFIRM</button>
      </div></div></div>`;
    return;
  }

  if (view.done) {
    el.innerHTML = `<div class="ov done">${doneCardHTML(view.done)}</div>`;
    return;
  }

  if (view.tip) {
    el.innerHTML = `<div class="ov scrim" data-act="tipx"><div class="modal dark">
      <div class="tip-t">${esc(view.tip)}</div>
      <div class="tip-d">${esc(GLOSSARY[view.tip] || '')}</div>
      <div class="tip-c">TAP TO CLOSE</div></div></div>`;
    return;
  }

  if (view.swap) {
    const { dayId, origId } = view.swap;
    const day = DAYS.find(d => d.id === dayId);
    const orig = day.exercises.find(e => e.id === origId);
    const curSwap = (state[dayId].swaps || {})[origId];
    const cur = resolveExercise(dayId, orig);
    let opts = '';
    if (curSwap) {
      opts += `<div class="opt" data-act="doswap" data-orig="${origId}" data-new="${origId}">
        <div class="opt-n">↩ ${esc(orig.name)}</div>
        <div class="opt-m">${setsForWeek(orig)} sets · ${esc(orig.reps)} · RPE ${esc(orig.rpe)}</div>
        <div class="opt-d">Revert to original exercise</div></div>`;
    }
    (EXERCISE_ALTERNATIVES[origId] || []).forEach(a => {
      opts += `<div class="opt${curSwap === a.id ? ' on' : ''}" data-act="doswap" data-orig="${origId}" data-new="${a.id}">
        <div class="opt-n">${esc(a.name)}</div>
        <div class="opt-m">${setsForWeek(a)} sets · ${esc(a.reps)} · RPE ${esc(a.rpe)} · ⏱ ${esc(a.restLabel)}</div>
        <div class="opt-d">${esc(a.note)}</div></div>`;
    });
    el.innerHTML = `<div class="ov scrim sheet"><div class="sheet-in">
      <div class="sheet-h">Swap Exercise</div>
      <div class="sheet-s">Current: ${esc(cur.name)}</div>
      ${opts}
      <button class="ra" style="width:100%;margin-top:4px" data-act="swapx">CANCEL</button>
    </div></div>`;
    return;
  }

  if (view.restEnd && !view.restMinimized) {
    const ms = Math.max(0, view.restEnd - view.now);
    const urgent = ms / 1000 <= 10;
    const pct = view.restTotal ? Math.max(0, ms / 1000 / view.restTotal) : 0;
    const presets = REST_PRESETS.map(s =>
      `<button class="preset${view.restTotal === s ? ' on' : ''}" data-act="preset" data-s="${s}">${fmtClock(s * 1000)}</button>`).join('');
    el.innerHTML = `<div class="ov rest">
      <button class="mini" data-act="restmin">MINIMIZE ↓</button>
      <div class="rest-k">Rest Period</div>
      <div class="rest-i">${esc(view.restInfo)}</div>
      <div class="rest-r">${esc(view.restRec)}</div>
      <div class="ring-wrap">
        <svg width="190" height="190" viewBox="0 0 190 190" style="transform:rotate(-90deg)">
          <circle cx="95" cy="95" r="84" fill="none" stroke="var(--border)" stroke-width="6"></circle>
          <circle cx="95" cy="95" r="84" fill="none" stroke="${urgent ? 'var(--danger)' : 'var(--accent)'}"
                  stroke-width="6" stroke-linecap="round" stroke-dasharray="${RING_C}"
                  stroke-dashoffset="${(RING_C * (1 - pct)).toFixed(1)}"></circle>
        </svg>
        <div class="ring-mid">
          <div class="ring-t${urgent ? ' urgent' : ''}">${fmtClock(ms)}</div>
          <div class="ring-s">remaining</div>
        </div>
      </div>
      <div style="display:flex;gap:8px">${presets}</div>
      <div class="rest-actions">
        <button class="ra" data-act="rest-">−15s</button>
        <button class="ra ink" data-act="rest+">+30s</button>
        <button class="ra solid" data-act="restskip">SKIP</button>
      </div>
      <div class="rest-next">${esc(view.restNext)}</div></div>`;
    return;
  }

  el.innerHTML = '';
}

function resetWeek() {
  DAYS.forEach(day => {
    state[day.id].protocol = [];
    state[day.id].weights = {};
    state[day.id].effort = {};
    state[day.id].reps = {};
    state[day.id].times = {};
    day.exercises.forEach(o => {
      const ex = resolveExercise(day.id, o);
      state[day.id].sets[ex.id] = Array(setsForWeek(ex)).fill(false);
    });
  });
  saveState();
  view.latestPr = null;
  view.pendKey = '';
}

function render() {
  renderMasthead();
  renderScroll();
  renderBottomBar();
  renderOverlays();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  // One place to close the inline editor. Doing it per-branch would eventually
  // miss one and leave the bar frozen behind an overlay showing a stale set.
  if (act !== 'editw' && act !== 'editr') view.editing = null;
  // Any deliberate navigation retires a celebration that's still up.
  if (act !== 'donex' && act !== 'doneback' && act !== 'donenext' && act !== 'doneprog') view.done = null;
  if (act === 'prog')     { switchProgram(Number(el.dataset.i)); view.dayId = getStartDay(); view.pendKey = ''; view.latestPr = null; view.selectedExId = null; }
  else if (act === 'wk')  { changeWeek(Number(el.dataset.d)); view.dayId = getStartDay(); view.pendKey = ''; view.latestPr = null; view.restEnd = null; view.selectedExId = null; }
  else if (act === 'day') { view.name = 'day'; view.dayId = el.dataset.id; view.pendKey = ''; view.selectedExId = null; }
  else if (act === 'view'){ view.name = el.dataset.v; }
  else if (act === 'settings') { view.name = view.name === 'settings' ? 'day' : 'settings'; }
  else if (act === 'proto') { toggleProtocol(curDay().id, Number(el.dataset.i)); }
  else if (act === 'skipday') {
    view.confirm = { title: 'Skip Day?', msg: 'All remaining sets will be marked skipped.', act: 'skipday' };
  }
  else if (act === 'completeday') {
    view.confirm = { title: 'Complete Day?', msg: 'All remaining sets will be marked done.', act: 'completeday' };
  }
  else if (act === 'tip')     { view.tip = el.dataset.t; }
  else if (act === 'undo')    { undoSet(curDay().id, el.dataset.ex, Number(el.dataset.i)); }
  else if (act === 'skipset') { skipSet(curDay().id, el.dataset.ex, Number(el.dataset.i)); }
  else if (act === 'skipex')  { skipExercise(curDay().id, el.dataset.ex); }
  else if (act === 'selectex') {
    const id = el.dataset.ex;
    view.selectedExId = view.selectedExId === id ? null : id;
    // Deliberately does NOT clear pendKey. syncPending() keys on the
    // exercise id, so picking a different exercise already recomputes it —
    // and re-selecting the exercise that's already active must NOT reset
    // it, or a weight the user just dialed in on the stepper gets thrown
    // away and re-prefilled from scratch.
  }
  else if (act === 'eff')     { saveEffort(curDay().id, el.dataset.ex, el.dataset.l); }
  else if (act === 'swap')    { view.swap = { dayId: curDay().id, origId: el.dataset.orig }; }
  else if (act === 'log')     { logActiveSet(); }
  else if (act === 'w-') { view.pendW = Math.max(0, view.pendW - 2.5); }
  else if (act === 'w+') { view.pendW = view.pendW + 2.5; }
  else if (act === 'r-') { view.pendR = Math.max(0, (Number(view.pendR) || 0) - 1); }
  else if (act === 'r+') { view.pendR = (Number(view.pendR) || 0) + 1; }
  else if (act === 'editw') { view.editing = 'w'; }
  else if (act === 'editr') { view.editing = 'r'; }
  else if (act === 'restexpand') { view.restMinimized = false; }
  else if (act === 'restskip')   { view.restEnd = null; view.restMinimized = false; }
  else if (act === 'rest+')      { addRest(30); }
  else if (act === 'rest-')      { addRest(-15); }
  else if (act === 'phase')  { view.openPhase = view.openPhase === Number(el.dataset.i) ? -1 : Number(el.dataset.i); }
  else if (act === 'theme')  { setTheme(el.dataset.v === 'auto' ? null : el.dataset.v); return; }
  else if (act === 'export') { exportData(); }
  else if (act === 'import') { document.getElementById('importFile').click(); return; }
  else if (act === 'clearweek') {
    view.confirm = { title: 'Clear Week?', msg: "This week's logged sets, weights, reps, effort, timestamps and protocol checks will be reset.", act: 'clearweek' };
  }
  else if (act === 'restmin') { view.restMinimized = true; }
  else if (act === 'preset')  { setRest(Number(el.dataset.s)); }
  else if (act === 'donex')   { view.done = null; }
  else if (act === 'doneprog'){ view.done = null; view.name = 'progress'; }
  else if (act === 'donenext'){
    view.done = null; view.name = 'day'; view.dayId = el.dataset.id;
    view.pendKey = ''; view.latestPr = null; view.selectedExId = null; view.restEnd = null;
  }
  else if (act === 'doneback'){
    // Undo the automatic week advance — openDayDone() moved exactly one week.
    view.done = null; changeWeek(-1);
    view.dayId = getStartDay(); view.pendKey = ''; view.latestPr = null; view.selectedExId = null;
  }
  else if (act === 'tipx')    { view.tip = null; }
  else if (act === 'swapx')   { view.swap = null; }
  else if (act === 'doswap')  { performSwap(view.swap.dayId, el.dataset.orig, el.dataset.new); view.swap = null; view.pendKey = ''; view.selectedExId = null; }
  else if (act === 'cfok')    {
    const c = view.confirm; view.confirm = null;
    if (c.act === 'skipday') skipDay(curDay().id);
    else if (c.act === 'completeday') completeDay(curDay().id);
    else if (c.act === 'clearweek') { resetWeek(); view.importMsg = "This week's log cleared."; view.importOk = true; }
  }
  else if (act === 'cfx')     { view.confirm = null; }
  else if (act === 'backfill') {
    const pid = el.dataset.p;
    const input = document.getElementById(`startDate-${pid}`);
    const res = backfillProgram(pid, input ? input.value : '');
    // Backfill writes straight to localStorage across all weeks; reload so the
    // in-memory current week reflects it.
    if (res.ok) initState();
    view.importMsg = res.ok
      ? `Estimated dates written for ${res.written} sets.`
      : `Could not set start date: ${res.reason}.`;
    view.importOk = res.ok;
  }
  else return;
  render();
});

function boot() {
  migrateOldState();
  migrateToMultiProgram();
  loadProgram();
  autoSelectNewProgram();
  syncProgramGlobals();
  loadWeek();
  initState();
  advanceToCurrentWeek();
  view.dayId = getStartDay();
  render();
  setInterval(() => {
    view.now = Date.now();
    if (view.restEnd && view.restEnd <= view.now) { view.restEnd = null; view.restMinimized = false; }
    render();
  }, 500);
  document.addEventListener('visibilitychange', () => { view.now = Date.now(); render(); });
}

boot();
</script>
